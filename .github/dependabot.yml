version: 2

# Weekly, grouped so a quiet week is one PR per ecosystem rather than ten.
# Majors stay ungrouped: they can break and deserve their own review.
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      go-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    ignore:
      # jsdom 30.1 changed the Blob internals that vitest 5.0.1's fetch shim
      # reads (makeCompatBlob -> blob[impl]._buffer), which breaks every test
      # that builds a FormData request. Drop this once a vitest release
      # supports jsdom 30.1; see #233.
      - dependency-name: jsdom
        versions: [">=30.1.0"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directories:
      - /deploy/docker
    schedule:
      interval: weekly
      day: monday
    groups:
      docker:
        patterns: ["*"]
