name: CI

on:
  push:
    branches: [main]
  pull_request:

# One run per code state, not per push. Pushing again to a PR cancels the run
# still churning on the superseded commit — that older result can only ever be
# about code nobody will merge.
#
# Main is deliberately EXCLUDED from cancellation: every commit that lands there
# must be verified on its own, since a cancelled run leaves the branch with no
# answer about whether it is healthy. The `github.sha` fallback gives each main
# commit its own group so pushes there queue instead of replacing each other.
#
# The PR run and the post-merge main run are NOT duplicates: they test different
# commits (the PR's merge preview vs. the squashed commit that actually landed).
# Only the second one can tell you main is broken — which is how #82 breaking an
# e2e test showed up as three unrelated PRs failing rather than as one clear
# signal on main.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# The five verification jobs below are INDEPENDENT and run concurrently. They
# were one sequential `verify` job, which meant every run paid the sum of its
# parts (~7m20s) even though nothing in it was actually ordered: only the
# integration suite needs Postgres, and Playwright serves the SPA itself.
# Splitting puts the wall clock at the slowest single job (~2m20s) instead.
#
# This repository is PUBLIC, so Actions minutes are free and the usual argument
# against fan-out — more billed job-minutes for less waiting — does not apply.
# The extra cost is ~25s of duplicated setup per job, paid in parallel.
#
# Branch protection should require the aggregate `ci` job at the bottom, NOT the
# individual jobs: that keeps one stable check name, so adding or renaming a job
# here never silently leaves a PR mergeable with no verification attached.
jobs:
  go-lint:
    name: Go lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25.x"
          cache: true
      # The version comes from the Makefile's GOLANGCI_VERSION, not a literal here.
      # A literal is what let the two diverge: this file pinned v2.1.6 while
      # CLAUDE.md told developers `@latest`, so `make lint` ran an eleven-minor
      # newer rule set than the gate. The older linter did not have the checks the
      # newer one flagged, so main could be red on a developer's machine and green
      # here — and 10 findings merged that way.
      - id: linter
        run: echo "version=$(sed -n 's/^GOLANGCI_VERSION := //p' Makefile)" >> "$GITHUB_OUTPUT"
      # install-mode goinstall, not the default prebuilt binary: a published binary
      # built with an older Go refuses to load a config whose target Go version
      # (from go.mod) is newer than its own build toolchain. Compiling it with the
      # Go set up above keeps this identical to the locally installed one — which is
      # now true of the VERSION as well, not just the toolchain.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v${{ steps.linter.outputs.version }}
          install-mode: goinstall

  go-test:
    name: Go unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # No service containers: the unit suite does not touch Postgres or Redis
    # (dbtest is behind the `integration` build tag), so this job skips the ~16s
    # of container startup the integration job pays.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25.x"
          cache: true
      # Pinned to the version `make sqlc` runs locally: sqlc's generated output is
      # version-dependent, so an unpinned CI would fail `sqlc diff` on a release
      # bump with no source change — and a newer sqlc silently regenerating
      # different code is exactly what `diff` exists to catch.
      # The published binary, not `go install`: sqlc v1.31.1's module declares
      # `go >= 1.26.0`, and actions/setup-go pins GOTOOLCHAIN=local, so building it
      # from source fails outright on the Go version this repo targets. The release
      # tarball carries no toolchain constraint and is the same pinned version
      # `make sqlc` runs locally.
      - name: Install sqlc
        run: |
          mkdir -p "$RUNNER_TEMP/sqlc-bin"
          curl -fsSL "https://downloads.sqlc.dev/sqlc_${SQLC_VERSION}_linux_amd64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP/sqlc-bin" sqlc
          echo "$RUNNER_TEMP/sqlc-bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/sqlc-bin/sqlc" version
        env:
          SQLC_VERSION: 1.31.1
      - name: Verify backend
        run: |
          # Kept alongside golangci-lint's govet rather than deduplicated: the
          # linter config sets `generated: lax`, so it skips sqlc output that
          # `go vet ./...` still checks. It is not on the critical path.
          go vet ./...
          # Again with the integration tag, because the untagged pass cannot see
          # //go:build integration files at all: a renamed query or changed
          # params struct breaks every integration test in a package while
          # `go build`, `go vet` and `go test` all stay green. That happened —
          # this is the check that would have caught it, and it needs no
          # database (vet type-checks, it does not run).
          go vet -tags=integration ./...
          # `sqlc diff` needs no database (it regenerates and compares); only
          # `sqlc vet`, which PREPAREs against a live schema, does — that runs in
          # the integration job.
          sqlc diff
          # -race here and on the integration run: this is the only place it can
          # run at all. It needs cgo, and the Windows dev machines have no C
          # compiler (CGO_ENABLED=0), so a data race in the worker pool or the
          # queue is undetectable locally and CI is the sole line of defence.
          go test -race ./...

  go-integration:
    name: Go integration tests
    runs-on: ubuntu-latest
    # The longest job, and therefore the run's critical path. Raise this ceiling
    # rather than trimming coverage if it starts brushing the limit.
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: inroad
          POSTGRES_PASSWORD: inroad
          POSTGRES_DB: inroad
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U inroad"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      INROAD_DATABASE_URL: postgres://inroad:inroad@localhost:5432/inroad?sslmode=disable
      # The TEST database, shared by two consumers that must agree on it:
      # sqlc.yaml reads it for `sqlc vet` (db-prepare needs a live schema), and
      # internal/platform/db/dbtest uses it verbatim as the database the
      # integration suite runs against. It must therefore be the _test database and
      # not the app's own -- pointing it at `inroad` would silently move the whole
      # integration suite onto the database the app migrates, defeating the
      # isolation dbtest exists to enforce.
      INROAD_TEST_DATABASE_URL: postgres://inroad:inroad@localhost:5432/inroad_test?sslmode=disable

    steps:
      - uses: actions/checkout@v7
      # Headroom for the integration suite, which runs four packages at once, each
      # with its own pool, alongside the app's own connections. Stock
      # max_connections is 100 and the suite used to land exactly on it (4 x the
      # 25-connection pool floor db.Connect applies), failing at random with
      # "sorry, too many clients already" in whichever unrelated package asked
      # last. The pools are small now (internal/platform/db/dbtest), and this is
      # the other half: a future parallelism bump must not walk back into the
      # ceiling silently.
      # A service container accepts no command arguments, so the limit is set on
      # the running server and a restart applies it.
      - name: Raise Postgres max_connections
        run: |
          psql "$INROAD_DATABASE_URL" -c 'ALTER SYSTEM SET max_connections = 300'
          docker restart "$(docker ps --filter ancestor=postgres:16-alpine --format '{{.ID}}')"
          for _ in $(seq 1 30); do
            pg_isready -h localhost -p 5432 -U inroad && break
            sleep 2
          done
          limit=$(psql "$INROAD_DATABASE_URL" -tAc 'SHOW max_connections')
          test "$limit" = "300" || { echo "max_connections is $limit, want 300"; exit 1; }
      # cmd/migrate loads the full config, so the crypto secrets must be
      # present even for a migrate-only step. Generated fresh every run and
      # exported to $GITHUB_ENV rather than committed as a fixed value —
      # nothing shaped like a real secret should live in the workflow file,
      # since a scanner (rightly) cannot tell a "fake" one from a real one.
      - name: Generate ephemeral CI secrets
        run: |
          echo "INROAD_JWT_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "INROAD_MASTER_KEY=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25.x"
          cache: true
      - name: Install sqlc
        run: |
          mkdir -p "$RUNNER_TEMP/sqlc-bin"
          curl -fsSL "https://downloads.sqlc.dev/sqlc_${SQLC_VERSION}_linux_amd64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP/sqlc-bin" sqlc
          echo "$RUNNER_TEMP/sqlc-bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/sqlc-bin/sqlc" version
        env:
          SQLC_VERSION: 1.31.1
      - name: Verify database behavior
        run: |
          go run ./cmd/migrate up
          # sqlc vet reads INROAD_TEST_DATABASE_URL, so that database needs the
          # schema too. dbtest creates it on demand once the suite runs, but vet
          # runs first, so create and migrate it here.
          psql "$INROAD_TEST_DATABASE_URL" -c '\q' 2>/dev/null \
            || psql "${INROAD_TEST_DATABASE_URL%/*}/postgres" -c 'CREATE DATABASE inroad_test'
          INROAD_DATABASE_URL="$INROAD_TEST_DATABASE_URL" go run ./cmd/migrate up
          # After migrate, never before: db-prepare PREPAREs every query against the
          # live schema, so on an unmigrated database it fails on every query that
          # touches a new table rather than on the one that is actually wrong.
          sqlc vet
          # -p 4 matches make test-integration. Each package's pool is capped by
          # dbtest (8 connections), so this is ~32 against max_connections=300.
          go test -race -p 4 -tags=integration ./...

  web:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install frontend dependencies
        working-directory: web
        run: npm ci
      # Contract first: a spec that does not lint makes every generated-type
      # failure below a red herring.
      - name: Verify API contract
        working-directory: web
        run: npm run lint:api
      - name: Verify frontend
        working-directory: web
        run: |
          npm run lint
          npm run typecheck
          npm test
          npm run build

  e2e:
    name: Frontend end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Independent of every other job: the suite mocks every /api/v1 route in the
    # browser, so it needs no API server, no database, and no Go toolchain — and
    # Playwright starts the Vite DEV server itself, so it does not wait on the
    # production build in the `web` job either.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install frontend dependencies
        working-directory: web
        run: npm ci
      - name: Install Playwright browser
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Verify frontend end-to-end
        working-directory: web
        run: npm run test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7

  # The single required status check. Branch protection points here, so the set
  # of jobs above can change without touching repository settings — and a job
  # added but forgotten in protection can never leave a PR silently unverified.
  #
  # `if: always()` is what makes this a real gate: without it the job is SKIPPED
  # when a dependency fails, and GitHub treats a skipped required check as
  # satisfied. The explicit result check below is therefore the assertion, not
  # the `needs` list.
  ci:
    name: CI
    if: always()
    needs: [go-lint, go-test, go-integration, web, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if any verification job did not succeed
        run: |
          echo '${{ toJSON(needs) }}'
          if ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}; then
            echo "::error::one or more verification jobs did not succeed"
            exit 1
          fi
