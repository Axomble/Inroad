name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: inroad
          POSTGRES_PASSWORD: inroad
          POSTGRES_DB: inroad
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U inroad"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      INROAD_DATABASE_URL: postgres://inroad:inroad@localhost:5432/inroad?sslmode=disable
      # cmd/migrate loads the full config, so the crypto secrets must be present
      # even for a migrate-only step. Throwaway CI values, never real secrets.
      INROAD_JWT_SECRET: ci-jwt-secret-not-a-real-secret
      INROAD_MASTER_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      # `sqlc vet` PREPAREs every query against a live schema (sqlc/db-prepare).
      # It reads this from sqlc.yaml, which insists on the TEST database so a local
      # run can never touch a developer's dev data. In CI the whole instance is
      # throwaway, so it points at the same database `cmd/migrate up` migrates —
      # that is the only one guaranteed to be at HEAD's schema when vet runs.
      INROAD_TEST_DATABASE_URL: postgres://inroad:inroad@localhost:5432/inroad?sslmode=disable

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25.x"
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci
      # install-mode goinstall, not the default prebuilt binary: the published
      # v2.1.6 binary is built with go1.24, and golangci-lint refuses to load a
      # config whose target Go version (1.25.0, from go.mod) is newer than its own
      # build toolchain. Compiling it here with the Go set up above makes the CI
      # linter identical to the `go install`-ed one `make lint` runs locally, so
      # neither side can pass while the other fails.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.1.6
          install-mode: goinstall
      # Pinned to the version `make sqlc` runs locally: sqlc's generated output is
      # version-dependent, so an unpinned CI would fail `sqlc diff` on a release
      # bump with no source change — and a newer sqlc silently regenerating
      # different code is exactly what `diff` exists to catch.
      - name: Install sqlc
        run: go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1
      - name: Verify backend
        run: |
          go vet ./...
          sqlc diff
          # -race here and on the integration run: this is the only place it can
          # run at all. It needs cgo, and the Windows dev machines have no C
          # compiler (CGO_ENABLED=0), so a data race in the worker pool or the
          # queue is undetectable locally and CI is the sole line of defence.
          go test -race ./...
      - name: Verify database behavior
        run: |
          go run ./cmd/migrate up
          # After migrate, never before: db-prepare PREPAREs every query against the
          # live schema, so on an unmigrated database it fails on every query that
          # touches a new table rather than on the one that is actually wrong.
          sqlc vet
          go test -race -tags=integration ./...
      - name: Verify API contract
        working-directory: web
        run: npm run lint:api
      - name: Verify frontend
        working-directory: web
        run: |
          npm run lint
          npm run typecheck
          npm test
          npm run build
      # The e2e suite mocks every /api/v1 route in the browser, so it needs no
      # API server or database — only the SPA dev server Playwright starts itself.
      - name: Install Playwright browser
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Verify frontend end-to-end
        working-directory: web
        run: npm run test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7

