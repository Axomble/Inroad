# Strict-but-signal linting for the Inroad Go backend.
# Run: make lint   (or: golangci-lint run)
version: "2"

run:
  timeout: 5m
  tests: true

# Report every finding. Both of these default to sampling — max-issues-per-linter
# to 50, max-same-issues to 3 — and the defaults are why this file never mentioned
# them and `make lint` still lied. noctx had 120 findings and reported 6, so for
# most of this project's life the linter was showing a fifth of one rule's output
# and nothing marked the rest as hidden. A NEW finding of a rule with any backlog
# is invisible under sampling, which inverts the point of running the linter at all.
# Sampling is a tool for triaging a legacy codebase into cleanliness; the tree is
# clean, so the cost of showing everything is zero and the cost of hiding it is a
# regression nobody sees.
issues:
  max-issues-per-linter: 0
  max-same-issues: 0

linters:
  # `standard` = errcheck, govet, ineffassign, staticcheck, unused.
  default: standard
  enable:
    - revive          # golint successor — style/naming/exported-doc
    - gocritic        # opinionated smell detection
    - errorlint       # correct error wrapping / errors.Is|As usage
    - nilerr          # returning nil after a non-nil err (and vice-versa)
    - bodyclose       # HTTP response bodies must be closed
    - noctx           # no context on outbound HTTP requests
    - sqlclosecheck   # sql.Rows/Stmt closed
    - rowserrcheck    # rows.Err() checked
    - unparam         # unused function params / always-same args
    - unconvert       # redundant type conversions
    - misspell        # typos in comments/strings
    - whitespace      # leading/trailing whitespace
    - dupl            # copy-paste duplication detection
    - nolintlint      # keep //nolint directives honest (must be specific + explained)
    - predeclared     # shadowing predeclared identifiers (len, error, ...)
    - reassign        # reassigning package-level vars from other packages
    - depguard        # execution-plane packages may not import the DB layer directly

  settings:
    depguard:
      rules:
        # internal/worker/** (production code only — see the "!$test" exclusion)
        # may not import internal/platform/db. Control-plane state and decrypted
        # credentials reach the worker ONLY through internal/coreapi (the seam
        # docs/security.md and CLAUDE.md both describe as "in-process now, HTTP
        # later"): that is what lets coreapi grow a real network transport later
        # without every worker package needing to change, and what keeps
        # workspace-scoping and credential handling in one reviewed place instead
        # of re-implemented per worker. Denying the project's db package (not
        # pgx itself) is deliberate: internal/worker/webhook/deliver.go imports
        # pgx directly for the pgx.ErrNoRows sentinel in an errors.Is check, which
        # is not a query and must keep working.
        worker-no-db:
          files:
            - "**/internal/worker/**"
            - "internal/worker/**"
            - "!$test"
          deny:
            - pkg: "github.com/inroad/inroad/internal/platform/db"
              desc: >-
                internal/worker reaches relational data only through
                internal/coreapi, never internal/platform/db directly — that is
                the control-plane/execution-plane boundary (see
                docs/security.md and CLAUDE.md). Add or extend a
                coreapi.Client method instead of importing the DB layer here.

        # internal/coreapi/remote is the EXECUTION plane's transport: the
        # coreapi implementation a role=send worker runs, and since slice 4 the
        # ONLY one it runs — cmd/worker opens no pool on that role, so this
        # package is the whole of a fleet host's access to control-plane state.
        #
        # The security claim that makes ("a compromised send host cannot read
        # the tenant database") rests on this package having no way to. That is
        # true today because *remote.Client is HTTP and nothing else, and this
        # rule is what keeps it true: a database import here would not fail a
        # build, it would quietly hand the execution plane back the access the
        # plane split exists to remove — and the type assertion at the
        # composition root would go on succeeding.
        #
        # pgx itself is NOT denied, for the same reason it is not denied above:
        # remote.go re-mints pgx.ErrNoRows as a sentinel for an errors.Is check
        # in internal/worker/webhook. That is a package-level value, not a
        # query. The project's db package, its generated queries and pgxpool
        # are the things there is no innocent reason to reach for here.
        coreapi-remote-no-db:
          files:
            - "**/internal/coreapi/remote/**"
            - "internal/coreapi/remote/**"
          deny:
            - pkg: "github.com/inroad/inroad/internal/platform/db"
              desc: >-
                internal/coreapi/remote is the transport a POOLLESS role=send
                worker runs; it must reach the control plane over HTTP and have
                no database access of its own. Importing the DB layer here
                would give a fleet host back the tenant-database reach slice 4
                removed. Add a route to the transport instead.
            - pkg: "github.com/jackc/pgx/v5/pgxpool"
              desc: >-
                internal/coreapi/remote must hold no connection pool — see
                above. A *remote.Client with no *pgxpool.Pool field is what
                makes "this worker cannot reach the tenant database" a fact
                about the type rather than a claim about reachability.
    dupl:
      threshold: 120          # ~15+ duplicated lines before it flags
    errcheck:
      check-type-assertions: true
      check-blank: false
    govet:
      enable-all: true
      disable:
        - fieldalignment      # micro-optimization noise, not a quality signal
        - shadow              # shadowing `err`/`ctx` is idiomatic Go; low signal
    revive:
      rules:
        - name: exported
          disabled: true      # not requiring doc comments on every export (too noisy for internal/)
        - name: unused-parameter
          disabled: true      # unparam covers the meaningful cases
    gocritic:
      # Drop the performance tag — hugeParam/rangeValCopy are pass-by-value
      # micro-opts that hurt readability more than they help. Keep diagnostics.
      enabled-tags: [diagnostic, style]
      disabled-checks:
        - ifElseChain
        - commentFormatting
        - unnamedResult
    nolintlint:
      require-explanation: true
      require-specific: true
      allow-unused: false

  exclusions:
    generated: lax            # skip sqlc-generated + routeTree etc.
    presets:
      - comments
      - std-error-handling
    rules:
      # Tests may duplicate table rows / skip some rigor.
      - path: _test\.go
        linters:
          - dupl
          - unparam
          - errcheck
      # Generated sqlc lives here; belt-and-braces beyond `generated: lax`.
      - path: internal/platform/db/gen/
        linters:
          - dupl
          - unparam
          - revive

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/inroad/inroad
