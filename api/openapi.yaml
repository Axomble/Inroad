      responses:
        '200': { description: A page of the company's deals, content: { application/json: { schema: { $ref: '#/components/schemas/CRMDealList' } } } }
        '404': { description: Company not found }
        '422': { description: Malformed cursor or non-positive limit }
  /crm/pipelines:
    get:
      operationId: crmListPipelines
      tags: [crm]
      responses:
        '200': { description: Workspace pipelines, content: { application/json: { schema: { $ref: '#/components/schemas/CRMPipelineList' } } } }
    post:
      operationId: crmCreatePipeline
      tags: [crm]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CRMPipelineInput' } } }
      responses:
        '201': { description: Created pipeline with default stages, content: { application/json: { schema: { $ref: '#/components/schemas/CRMPipeline' } } } }
  /crm/pipelines/{id}:
    parameters: [{ $ref: '#/components/parameters/ID' }]
    get:
      operationId: crmGetPipeline
      tags: [crm]
      responses:
        '200': { description: Pipeline, content: { application/json: { schema: { $ref: '#/components/schemas/CRMPipeline' } } } }
        '404': { description: Pipeline not found }
    put:
      operationId: crmUpdatePipeline
      tags: [crm]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CRMPipelineInput' } } }
      responses:
        '200': { description: Updated pipeline, content: { application/json: { schema: { $ref: '#/components/schemas/CRMPipeline' } } } }
    delete:
      operationId: crmDeletePipeline
      tags: [crm]
      responses:
        '204': { description: Pipeline deleted }
        '404': { description: Pipeline not found }
        '409': { description: "The default pipeline cannot be deleted, or it is still referenced" }
  /crm/pipelines/{id}/stages:
    parameters: [{ $ref: '#/components/parameters/ID' }]
    post:
      operationId: crmCreateStage
      tags: [crm]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CRMStageInput' } } }
      responses:
        '201': { description: Created stage, content: { application/json: { schema: { $ref: '#/components/schemas/CRMStage' } } } }
  /crm/pipelines/{id}/stages/{stageID}:
    parameters:
      - { $ref: '#/components/parameters/ID' }
      - name: stageID
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      operationId: crmUpdateStage
      tags: [crm]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CRMStageInput' } } }
      responses:
        '200': { description: Updated stage, content: { application/json: { schema: { $ref: '#/components/schemas/CRMStage' } } } }
    delete:
      operationId: crmDeleteStage
      tags: [crm]
      responses:
        '204': { description: Stage deleted }
        '404': { description: Stage not found }
        '409': { description: Stage still has deals; move them to another stage first }
  /crm/deals:
    get:
      operationId: crmListDeals
      tags: [crm]
      parameters:
        - { $ref: '#/components/parameters/PageLimit' }
        - { $ref: '#/components/parameters/PageCursor' }
      responses:
        '200': { description: Workspace deals, content: { application/json: { schema: { $ref: '#/components/schemas/CRMDealList' } } } }
    post:
      operationId: crmCreateDeal
      tags: [crm]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CRMDealInput' } } }
      responses:
        '201': { description: Created deal, content: { application/json: { schema: { $ref: '#/components/schemas/CRMDeal' } } } }
        '422': { description: Validation error }
  /crm/deals/{id}:
    parameters: [{ $ref: '#/components/parameters/ID' }]
    get:
      operationId: crmGetDeal
      tags: [crm]
      responses:
        '200': { description: Deal, content: { application/json: { schema: { $ref: '#/components/schemas/CRMDeal' } } } }
        '404': { description: Deal not found }
    put:
      operationId: crmUpdateDeal
      tags: [crm]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CRMDealInput' } } }
      responses:
        '200': { description: Updated deal, content: { application/json: { schema: { $ref: '#/components/schemas/CRMDeal' } } } }
    delete:
      operationId: crmDeleteDeal
      tags: [crm]
      responses: { '204': { description: Deal deleted } }
  /crm/board:
    get:
      operationId: crmGetBoard
      tags: [crm]
      parameters:
        - { name: pipeline_id, in: query, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Pipeline board with server-computed stage summaries, content: { application/json: { schema: { $ref: '#/components/schemas/CRMBoard' } } } }
        '404': { description: Pipeline not found }
  /crm/deals/{id}/move:
    parameters: [{ $ref: '#/components/parameters/ID' }]
    post:
      operationId: crmMoveDeal
      tags: [crm]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CRMMoveDealInput' } } }
      responses:
        '200': { description: Moved deal, content: { application/json: { schema: { $ref: '#/components/schemas/CRMDeal' } } } }
        '404': { description: Deal not found }
        '422': { description: Invalid stage or neighbors }
  /crm/deals/{id}/threads:
    parameters: [{ $ref: '#/components/parameters/ID' }]
    get:
      operationId: crmListDealThreads
      tags: [crm]
      description: Structured message metadata only; inbound bodies are never exposed.
      responses:
        '200': { description: Threads linked to the deal, content: { application/json: { schema: { $ref: '#/components/schemas/CRMThreadList' } } } }
  /crm/events:
    get:
      operationId: crmListEvents
      tags: [crm]
      parameters:
        - { name: target_type, in: query, required: true, schema: { type: string, enum: [contact, company, deal] } }
        - { name: target_id, in: query, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Append-only activity feed with adjacent ten-minute groups, content: { application/json: { schema: { $ref: '#/components/schemas/CRMEventList' } } } }
  /crm/settings:
    get:
      operationId: crmGetSettings
      tags: [crm]
      responses:
        '200': { description: CRM workspace settings, content: { application/json: { schema: { $ref: '#/components/schemas/CRMSettings' } } } }
    put:
      operationId: crmUpdateSettings
      tags: [crm]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CRMSettingsInput' } } }
      responses:
        '200': { description: Updated settings, content: { application/json: { schema: { $ref: '#/components/schemas/CRMSettings' } } } }
        '422': { description: Invalid capture policy }
  /crm/notes:
    get:
      operationId: crmListNotes
      tags: [crm]
      description: >-
        Notes attached to one contact, company, or deal. Note the deliberate
        asymmetry with the company sub-resources: this endpoint does NOT resolve
        the target first, so an unknown or cross-workspace target_id returns an
        empty page rather than 404. That is not a bug - the SQL is workspace-pinned
        either way, so nothing leaks and it is not an existence oracle. Kept as-is
        because changing a shipped endpoint's status codes would break clients for
        no gain.
      parameters:
        - { name: target_type, in: query, required: true, schema: { type: string, enum: [contact, company, deal] } }
        - { name: target_id, in: query, required: true, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/PageLimit' }
        - { $ref: '#/components/parameters/PageCursor' }
      responses:
        '200': { description: Notes attached to the target, content: { application/json: { schema: { $ref: '#/components/schemas/CRMNoteList' } } } }
    post:
      operationId: crmCreateNote
      tags: [crm]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CRMNoteInput' } } }
      responses:
        '201': { description: Created note, content: { application/json: { schema: { $ref: '#/components/schemas/CRMNote' } } } }
  /crm/notes/{id}:
    parameters: [{ $ref: '#/components/parameters/ID' }]
    put:
      operationId: crmUpdateNote
      tags: [crm]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CRMNoteUpdate' } } }
      responses:
        '200': { description: Updated note, content: { application/json: { schema: { $ref: '#/components/schemas/CRMNote' } } } }
    delete:
      operationId: crmDeleteNote
      tags: [crm]
      responses: { '204': { description: Note deleted } }
  /crm/tasks:
    get:
      operationId: crmListTasks
      tags: [crm]
      description: >-
        Tasks attached to one contact, company, or deal. Same deliberate asymmetry
        as crmListNotes: an unknown or cross-workspace target_id yields an empty
        page, not 404. See that operation's description.
      parameters:
        - { name: target_type, in: query, required: true, schema: { type: string, enum: [contact, company, deal] } }
        - { name: target_id, in: query, required: true, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/PageLimit' }
        - { $ref: '#/components/parameters/PageCursor' }
      responses:
        '200': { description: Tasks attached to the target, content: { application/json: { schema: { $ref: '#/components/schemas/CRMTaskList' } } } }
    post:
      operationId: crmCreateTask
      tags: [crm]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CRMTaskInput' } } }
      responses:
        '201': { description: Created task, content: { application/json: { schema: { $ref: '#/components/schemas/CRMTask' } } } }
  /crm/tasks/{id}:
    parameters: [{ $ref: '#/components/parameters/ID' }]
    put:
      operationId: crmUpdateTask
      tags: [crm]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CRMTaskInput' } } }
      responses:
        '200': { description: Updated task, content: { application/json: { schema: { $ref: '#/components/schemas/CRMTask' } } } }
    delete:
      operationId: crmDeleteTask
      tags: [crm]
      responses: { '204': { description: Task deleted } }
  /crm/contacts/{id}/emails:
    parameters: [{ $ref: '#/components/parameters/ID' }]
    get:
      operationId: crmListContactEmails
      tags: [crm]
      responses:
        '200': { description: Contact email aliases, content: { application/json: { schema: { $ref: '#/components/schemas/CRMContactEmailList' } } } }
    post:
      operationId: crmAddContactEmail
      tags: [crm]
      description: >-
        Requires BOTH crm:write and contacts:write. A contact's alias set decides
        contacts.email, which is the recipient address on the send path.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CRMContactEmailInput' } } }
      responses:
        '201': { description: Added email alias, content: { application/json: { schema: { $ref: '#/components/schemas/CRMContactEmail' } } } }
        '409': { description: Email already belongs to a contact in this workspace }
  /crm/contacts/{id}/emails/{emailID}/primary:
    parameters:
      - { $ref: '#/components/parameters/ID' }
      - name: emailID
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      operationId: crmSetPrimaryContactEmail
      tags: [crm]
      description: >-
        Requires BOTH crm:write and contacts:write - this rewrites contacts.email,
        which is the address a running campaign sends to.
      responses:
        '204': { description: Primary email changed }
        '403': { description: Insufficient scope }
        '404': { description: Contact email not found }
  /reply-labels:
    get:
      operationId: listReplyLabels
      tags: [reply-labels]
      description: >-
        The workspace's reply-label taxonomy, ordered by position. Seven builtin
        labels are seeded per workspace and reproduce the platform's historical
        reply automation exactly; a workspace may add its own on top.

        Gated on the CAMPAIGN scopes rather than the inbox ones: a label's role
        flags decide whether a reply stops an enrollment, suppresses a contact,
        or opens a deal, which is send-automation configuration.
      responses:
        '200':
          description: Reply labels
          content: { application/json: { schema: { $ref: '#/components/schemas/ReplyLabelList' } } }
    post:
      operationId: createReplyLabel
      tags: [reply-labels]
      description: >-
        Creates a custom label. Its machine `key` is slugified from `label` and
        is immutable thereafter, because historical enrollments name it as free
        text.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ReplyLabelInput' } } }
      responses:
        '201':
          description: Created label
          content: { application/json: { schema: { $ref: '#/components/schemas/ReplyLabel' } } }
        '409': { description: A label with that name already exists }
        '422': { description: Validation error }
  /reply-labels/reorder:
    put:
      operationId: reorderReplyLabels
      tags: [reply-labels]
      description: >-
        Rewrites label positions to the given order. Every label in the
        workspace must appear exactly once, so a stale client list cannot
        silently collapse two labels onto one position.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ReplyLabelReorderInput' } } }
      responses:
        '200':
          description: Reply labels in their new order
          content: { application/json: { schema: { $ref: '#/components/schemas/ReplyLabelList' } } }
        '422': { description: The order must list every label exactly once }
  /reply-labels/{id}:
    parameters: [{ $ref: '#/components/parameters/ID' }]
    put:
      operationId: updateReplyLabel
      tags: [reply-labels]
      description: >-
        Edits the display fields and role flags. `key` cannot be changed, for
        builtin and custom labels alike.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ReplyLabelInput' } } }
      responses:
        '200':
          description: Updated label
          content: { application/json: { schema: { $ref: '#/components/schemas/ReplyLabel' } } }
        '404': { description: Reply label not found }
        '422': { description: Validation error }
    delete:
      operationId: deleteReplyLabel
      tags: [reply-labels]
      description: >-
        Deletes a CUSTOM label. Historical enrollments keep the now-orphaned key
        on purpose - a recorded classification is a fact, not a foreign key -
        and readers degrade to showing the raw key.
      responses:
        '204': { description: Reply label deleted }
        '404': { description: Reply label not found }
        '409': { description: Builtin labels cannot be deleted }
  /inbox/threads:
    get:
      operationId: listInboxThreads
      tags: [inbox]
      security: [{ bearerAuth: [] }]
      description: >-
        One row per matched-reply thread (or per legacy direct-send match, which
        has no root message to anchor a thread on), newest first. There is no
        opaque cursor: to page past the last item on this page, pass its own
        last_message_at/id as before_last_message_at/before_id.
      parameters:
        - name: mailbox_id
          in: query
          required: false
          description: Restrict to one mailbox.
          schema: { type: string, format: uuid }
        - name: reply_class
          in: query
          required: false
          description: Restrict to one reply classification (e.g. positive, neutral, negative).
          schema: { type: string }
        - name: q
          in: query
          required: false
          description: >-
            Case-insensitive substring search against the thread's subject or its
            linked contact's email. LIKE metacharacters (% and _) are matched
            literally, not as wildcards.
          schema: { type: string }
        - name: before_last_message_at
          in: query
          required: false
          description: Keyset cursor. Must be set together with before_id, or not at all.
          schema: { type: string, format: date-time }
        - name: before_id
          in: query
          required: false
          description: Keyset cursor. Must be set together with before_last_message_at, or not at all.
          schema: { type: string, format: uuid }
        - name: limit
          in: query
          required: false
          description: Page size. Defaults to 25, capped at 200 (a larger request is clamped, not rejected).
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Threads in the workspace
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InboxThreadPage' }
        '400': { description: "Malformed filter (bad UUID/timestamp, or a half-set keyset cursor)" }
        '401': { description: Unauthorized }
  /inbox/threads/{id}:
    parameters: [{ $ref: '#/components/parameters/ID' }]
    get:
      operationId: getInboxThread
      tags: [inbox]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Thread with its full message history, oldest first
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InboxThreadDetail' }
        '401': { description: Unauthorized }
        '404': { description: Not found }
  /inbox/threads/{id}/reply:
    parameters: [{ $ref: '#/components/parameters/ID' }]
    post:
      operationId: sendInboxReply
      description: >-
        Queue a plain-text reply on this thread, sent from the thread's mailbox
        to the sender of its latest inbound message. The send happens
        asynchronously in the execution plane; the reply appears in the thread's
        message history once delivered. Requires the inbox:send scope, which is
        deliberately not OAuth-grantable — sending mail is never delegable to a
        third-party client. The recipient's suppression status is checked both
        here and again at send time; a manual reply is never blocked by the
        mailbox's daily cap, but it counts toward it.
      tags: [inbox]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SendInboxReplyRequest' }
      responses:
        '202': { description: Reply queued for sending }
        '400': { description: Malformed request }
        '401': { description: Unauthorized }
        '404': { description: Not found }
        '409': { description: "The recipient is suppressed, or the thread has no inbound message to reply to" }
        '422': { description: Validation error (empty or oversized body) }
  /inbox/threads/{id}/draft-reply:
    parameters: [{ $ref: '#/components/parameters/ID' }]
    post:
      operationId: draftInboxReply
      description: >-
        Generate a suggested plain-text reply body for this thread using the
        workspace's configured AI model, for a human to edit and then send via
        POST /inbox/threads/{id}/reply. This endpoint NEVER sends mail and never
        queues a send. The transcript is built server-side from this thread's own
        message history; there is no request body. Requires the inbox:send scope
        rather than inbox:read — drafting spends the workspace's AI budget and is
        only useful as a step toward replying, so it sits behind the same
        non-OAuth-grantable authority as the send itself. POST (not GET) because
        each call has a billable side effect and must never be cached or
        transparently retried. Rate-limited per IP and per workspace. An
        Idempotency-Key header is IGNORED on this route: a repeated request is a
        request for a fresh draft, and there is no duplicate side effect to
        suppress (nothing is written and no mail is sent), so replaying a
        recorded response would be the wrong answer. That also keeps 422
        unambiguous here — see the 422 response.
      tags: [inbox]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: A suggested reply body
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InboxDraftReply' }
        '401': { description: Unauthorized }
        '404': { description: Not found }
        '409': { description: The thread has no inbound message to reply to }
        '422': { description: "No AI model is configured for this workspace — configure one in Settings, AI. This is the ONLY meaning of 422 on this route (the endpoint takes no request body to validate, and the Idempotency-Key guard is skipped here), so a client may branch on the status alone. Not retryable: it needs a human to configure a provider, which is why this is not a 503." }
        '429': { description: Too many draft requests for this IP or workspace }
        '502': { description: "The AI provider call failed" }
        '504': { description: The AI provider did not respond in time }
  /inbox/threads/{id}/read:
    parameters: [{ $ref: '#/components/parameters/ID' }]
    put:
      operationId: setInboxThreadRead
      tags: [inbox]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetInboxThreadReadRequest' }
      responses:
        '204': { description: Read state updated }
        '400': { description: Validation error }
        '401': { description: Unauthorized }
        '404': { description: Not found }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    ID:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    PageLimit:
      name: limit
      in: query
      required: false
      description: Page size. Defaults to 50, capped at 200.
      schema: { type: integer, minimum: 1, maximum: 200 }
    PageCursor:
      name: cursor
      in: query
      required: false
      description: >-
        Opaque keyset cursor taken from the previous page's next_cursor.
        Round-trip it untouched; never construct one.
      schema: { type: string }
    CaptchaToken:
      name: X-Captcha-Token
      in: header
      required: false
      description: >-
        Client-solved captcha (Cloudflare Turnstile) token. Required ONLY when the
        server is configured with a captcha secret (INROAD_TURNSTILE_SECRET); on such
        a server a missing or invalid token is rejected 403. On a server without a
        captcha configured the header is ignored.
      schema: { type: string }
  schemas:
    EmailOTPStartRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }
    EmailOTPStartResponse:
      type: object
      required: [status]
      properties:
        status: { type: string, description: Generic acknowledgement; identical whether or not the email matched an account. }
    EmailOTPVerifyRequest:
      type: object
      required: [email, code]
      properties:
        email: { type: string, format: email }
        code: { type: string, description: The 6-digit numeric code delivered by email. }
    RegisterRequest:
      type: object
      required: [workspace_name, email, password]
      properties:
        workspace_name: { type: string }
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }
    SessionResponse:
      type: object
      required: [access_token, expires_in, user_id, active_workspace_id, role, memberships, email, onboarding_completed_at]
      properties:
        access_token: { type: string }
        expires_in: { type: integer }
        user_id: { type: string }
        active_workspace_id: { type: string }
        role: { type: string }
        memberships:
          type: array
          items: { $ref: '#/components/schemas/Membership' }
        email: { type: string, description: The signed-in user's email — the SPA's identity source after a silent refresh. }
        onboarding_completed_at:
          type: string
          format: date-time
          nullable: true
          description: >-
            When the ACTIVE workspace finished onboarding, or null while it is still
            pending. Present on the session response so the SPA can gate its
            onboarding modal on first paint without a second round trip. A nullable
            timestamp rather than a boolean beside it, so a response can never claim
            to be complete with no completion time.
    Membership:
      type: object
      required: [workspace_id, workspace_name, role, onboarding_completed_at]
      properties:
        workspace_id: { type: string }
        workspace_name: { type: string }
        role: { type: string }
        onboarding_completed_at:
          type: string
          format: date-time
          nullable: true
          description: >-
            When THIS workspace finished onboarding, or null while pending, so
            switching into a freshly created one needs no extra request.
    MeResponse:
      type: object
      required: [user_id, active_workspace_id, role, memberships, email, email_verified, onboarding_completed_at]
      properties:
        user_id: { type: string }
        active_workspace_id: { type: string }
        role: { type: string }
        memberships:
          type: array
          items: { $ref: '#/components/schemas/Membership' }
        email: { type: string, description: The caller's email address. }
        email_verified: { type: boolean, description: Whether the caller has confirmed their email address. }
        onboarding_completed_at:
          type: string
          format: date-time
          nullable: true
          description: "When the caller's ACTIVE workspace finished onboarding, or null while pending."
    SwitchWorkspaceRequest:
      type: object
      required: [workspace_id]
      properties:
        workspace_id: { type: string }
    SessionInfo:
      type: object
      required: [id, workspace_id, created_at, expires_at, current]
      properties:
        id: { type: string, format: uuid }
        workspace_id: { type: string, format: uuid }
        user_agent: { type: string, nullable: true }
        ip: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        current: { type: boolean, description: Whether this is the session tied to the caller's current access token. }
    SessionListResponse:
      type: object
      required: [sessions]
      properties:
        sessions:
          type: array
          items: { $ref: '#/components/schemas/SessionInfo' }
    RevokeOthersResponse:
      type: object
      required: [revoked]
      properties:
        revoked: { type: integer, description: Number of other sessions revoked. }
    SwitchWorkspaceResponse:
      type: object
      required: [access_token, expires_in, active_workspace_id, role, onboarding_completed_at]
      properties:
        access_token: { type: string }
        expires_in: { type: integer }
        active_workspace_id: { type: string }
        role: { type: string }
        onboarding_completed_at:
          type: string
          format: date-time
          nullable: true
          description: When the workspace just switched into finished onboarding, or null while pending.
    GoogleSignInStartRequest:
      type: object
      properties:
        invite_token:
          type: string
          nullable: true
          description: >-
            Raw token from an invite link, when the invitee chose to accept it with
            Google rather than by setting a password. Only its hash is persisted
            server-side; it is never placed in the OAuth `state` parameter.
        return_to:
          type: string
          nullable: true
          description: >-
            In-app path to land on after sign-in. Validated server-side as a
            same-origin path; anything else is silently dropped.
    GoogleSignInStartResponse:
      type: object
      required: [auth_url]
      properties:
        auth_url: { type: string, description: The Google consent URL to navigate the browser to. }
    CompleteOnboardingRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: The workspace's real name, replacing the one derived at signup.
    OnboardingResponse:
      type: object
      required: [workspace_id, name, onboarding_completed_at]
      properties:
        workspace_id: { type: string, format: uuid }
        name: { type: string }
        onboarding_completed_at:
          type: string
          format: date-time
          nullable: true
          description: When onboarding was completed. Always set on a successful response.
    TwoFactorRequiredResponse:
      type: object
      required: [two_factor_required, challenge]
      properties:
        two_factor_required: { type: boolean, description: Always true; distinguishes this from a SessionResponse. }
        challenge: { type: string, description: "Single-use, short-lived challenge token to submit to /auth/2fa/verify." }
    TwoFactorStatusResponse:
      type: object
      required: [totp_enabled, recovery_codes_remaining]
      properties:
        totp_enabled: { type: boolean }
        recovery_codes_remaining: { type: integer, description: Number of unused single-use recovery codes. }
    TwoFactorEnrollResponse:
      type: object
      required: [secret, otpauth_uri]
      properties:
        secret: { type: string, description: Base32 TOTP secret for manual entry. Returned only at enrollment. }
        otpauth_uri: { type: string, description: otpauth:// provisioning URI to render as a QR code. }
    TwoFactorConfirmResponse:
      type: object
      required: [recovery_codes]
      properties:
        recovery_codes:
          type: array
          description: Single-use recovery codes, shown exactly once.
          items: { type: string }
    TwoFactorCodeRequest:
      type: object
      required: [code]
      properties:
        code: { type: string, description: A TOTP code or a recovery code. }
    TwoFactorVerifyRequest:
      type: object
      required: [challenge, code]
      properties:
        challenge: { type: string, description: The challenge token returned by /auth/login. }
        code: { type: string, description: A TOTP code or a recovery code. }
    ApiKeyCreateRequest:
      type: object
      required: [name, scopes]
      properties:
        name: { type: string, description: Operator-facing label for the key. }
        scopes:
          type: array
          minItems: 1
          description: >-
            Granted scopes; a subset of the owned vocabulary (e.g. mailboxes:read,
            campaigns:send). The key holds exactly these.
          items: { type: string }
        ip_allowlist:
          type: array
          nullable: true
          description: >-
            Optional IPs or CIDRs the key may be used from; a bare IP is treated as
            a host route. Omit or leave empty for no restriction.
          items: { type: string }
        rate_limit_per_min:
          type: integer
          nullable: true
          description: Optional per-minute request cap. Omit for unlimited.
        expires_at:
          type: string
          format: date-time
          nullable: true
          description: Optional RFC3339 expiry. Omit for a key that never expires.
    ApiKey:
      type: object
      description: Non-secret view of an API key. Never carries the secret or its hash.
      required: [id, name, prefix, scopes, created_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        prefix: { type: string, description: "Public, non-secret token prefix (the part before the secret)." }
        scopes: { type: array, items: { type: string } }
        ip_allowlist: { type: array, nullable: true, items: { type: string } }
        rate_limit_per_min: { type: integer, nullable: true }
        expires_at: { type: string, format: date-time, nullable: true }
        revoked_at: { type: string, format: date-time, nullable: true }
        last_used_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
    ApiKeyCreateResponse:
      type: object
      required: [token, api_key]
      properties:
        token:
          type: string
          description: >-
            The full API key token (inrd_<prefix>_<secret>). SHOWN EXACTLY ONCE —
            store it now; it is never retrievable again.
        api_key: { $ref: '#/components/schemas/ApiKey' }
    ApiKeyListResponse:
      type: object
      required: [api_keys]
      properties:
        api_keys:
          type: array
          items: { $ref: '#/components/schemas/ApiKey' }
    PasskeyBeginResponse:
      type: object
      required: [session_id, publicKey]
      properties:
        session_id:
          type: string
          description: >-
            Opaque single-use ceremony handle. Echo it back in the matching finish
            call's session_id. The server holds the real challenge; this is never
            the challenge itself.
        publicKey:
          type: object
          additionalProperties: true
          description: >-
            The WebAuthn options object (PublicKeyCredentialCreationOptions for
            register, PublicKeyCredentialRequestOptions for login) as defined by the
            WebAuthn spec — pass straight to navigator.credentials.create/get.
    PasskeyFinishRequest:
      type: object
      required: [session_id, credential]
      properties:
        session_id:
          type: string
          description: The opaque session_id from the matching begin call.
        credential:
          type: object
          additionalProperties: true
          description: >-
            The PublicKeyCredential JSON returned by navigator.credentials.create
            (attestation) or navigator.credentials.get (assertion), serialized.
        label:
          type: string
          description: Optional friendly name for the passkey (registration only).
    PasskeyInfo:
      type: object
      required: [id, label, transports, created_at]
      properties:
        id: { type: string, format: uuid }
        label: { type: string }
        transports:
          type: array
          items: { type: string }
          description: Advisory transport hints (e.g. internal, hybrid). Always present; empty when none.
        created_at: { type: string, format: date-time }
        last_used_at: { type: string, format: date-time, nullable: true }
    PasskeyListResponse:
      type: object
      required: [passkeys]
      properties:
        passkeys:
          type: array
          items: { $ref: '#/components/schemas/PasskeyInfo' }
    VerifyEmailRequest:
      type: object
      required: [token]
      properties:
        token: { type: string }
    ForgotPasswordRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }
    ResetPasswordRequest:
      type: object
      required: [token, new_password]
      properties:
        token: { type: string }
        new_password: { type: string, minLength: 8 }
    AcceptInviteRequest:
      type: object
      required: [token]
      properties:
        token: { type: string }
        password: { type: string, minLength: 8 }
    CreateInviteRequest:
      type: object
      required: [email, role]
      properties:
        email: { type: string, format: email }
        role: { type: string, enum: [admin, member] }
    Invite:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        role: { type: string }
        status: { type: string }
        expires_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
    ConnectMailboxRequest:
      type: object
      required: [email, smtp_host, smtp_port, imap_host, imap_port, secret]
      properties:
        email: { type: string, format: email }
        display_name: { type: string }
        smtp_host: { type: string }
        smtp_port: { type: integer }
        smtp_username: { type: string }
        imap_host: { type: string }
        imap_port: { type: integer }
        imap_username: { type: string }
        secret: { type: string }
        allow_plaintext:
          type: boolean
          default: false
          description: >-
            Explicit opt-out from TLS, persisted on the mailbox so the connect
            test AND every subsequent send apply the SAME policy (rare
            cleartext-only internal relay). Omitted/false enforces TLS
            (STARTTLS on 25/587/2525, implicit TLS on 465); an absent value can
            never silently downgrade to cleartext auth. Replaces the removed
            use_tls flag.
    Mailbox:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        display_name: { type: string }
        provider: { type: string }
        smtp_host: { type: string }
        smtp_port: { type: integer }
        smtp_username: { type: string }
        imap_host: { type: string }
        imap_port: { type: integer }
        imap_username: { type: string }
        allow_plaintext: { type: boolean }
        daily_cap: { type: integer }
        min_interval_seconds: { type: integer }
        ramp_enabled: { type: boolean }
        ramp_start_cap: { type: integer }
        ramp_days: { type: integer }
        status: { type: string }
        last_error: { type: string }
        created_at: { type: string, format: date-time }
    CampaignReport:
      type: object
      required: [campaigns, totals]
      properties:
        campaigns:
          type: array
          items: { $ref: '#/components/schemas/CampaignPerformance' }
        totals:
          allOf:
            - $ref: '#/components/schemas/PerformanceCounts'
          description: The workspace roll-up, weighted by volume.
    CampaignPerformance:
      allOf:
        - $ref: '#/components/schemas/PerformanceCounts'
        - type: object
          required: [id, name, status, created_at]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            status: { type: string }
            created_at: { type: string, format: date-time }
    PerformanceCounts:
      type: object
      required:
        [sent, enrolled, opens, clicks, replies, bounces, unsubscribes,
         open_rate, click_rate, reply_rate, bounce_rate, unsub_rate]
      properties:
        sent: { type: integer, format: int64, description: "Messages sent." }
        enrolled: { type: integer, format: int64, description: "Contacts enrolled — the denominator for the reply/bounce/unsubscribe rates." }
        opens: { type: integer, format: int64, description: "Sends opened at least once. Indicative, not reliable: proxy prefetches and opens within 2s of the send are excluded, but open tracking cannot be exact." }
        clicks: { type: integer, format: int64, description: "Sends with at least one link click." }
        replies: { type: integer, format: int64 }
        bounces: { type: integer, format: int64 }
        unsubscribes: { type: integer, format: int64 }
        open_rate: { type: number, format: double, description: "opens / sent, in [0,1]. Zero when nothing was sent." }
        click_rate: { type: number, format: double, description: "clicks / sent, in [0,1]." }
        reply_rate: { type: number, format: double, description: "replies / enrolled, in [0,1]." }
        bounce_rate: { type: number, format: double, description: "bounces / enrolled, in [0,1]." }
        unsub_rate: { type: number, format: double, description: "unsubscribes / enrolled, in [0,1]." }
    List:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        contact_count:
          type: integer
          format: int64
          description: >-
            How many contacts are on this list. Present on GET /lists, which
            aggregates it in the same query. Absent from the POST /lists
            response — a list is empty the moment it is created, so there is
            nothing to report yet.
    ImportResult:
      type: object
      required: [imported, skipped, duplicates, mapped_fields, ignored_columns, invalid_values]
      properties:
        imported: { type: integer }
        skipped: { type: integer, description: "Rows rejected outright: unreadable, or no valid email address." }
        duplicates: { type: integer }
        mapped_fields:
          type: array
          items: { type: string }
          description: Custom field keys this file populated, so an operator can confirm their column landed somewhere.
        ignored_columns:
          type: array
          items: { type: string }
          description: >-
            Headers matching neither a built-in column nor a live custom field.
            These are reported rather than dropped in silence, which is what made
            a mis-named column impossible to diagnose before.
        invalid_values:
          type: integer
          description: >-
            Cells rejected by their field's type (a "next week" in a date column).
            The ROW still imports - one bad cell should not cost the contact - so
            this is counted separately from `skipped`.
    CustomFieldType:
      type: string
      enum: [text, number, date, select]
      description: >-
        Every value is STORED and rendered as text regardless of type; the type
        decides what is accepted on write. A number would otherwise be formatted by
        the send path (15000000 arriving in a subject line as 1.5e+07), and a date
        needs one unambiguous form because 03/04/2026 means two different days
        depending on who reads the email.
    CustomFieldDef:
      type: object
      required: [id, key, label, type, options, created_at, archived, archived_at]
      properties:
        id: { type: string, format: uuid }
        key:
          type: string
          description: Lower-case identifier used as `{{custom.<key>}}` in sequence steps and as the CSV column name on import.
        label: { type: string }
        type: { $ref: '#/components/schemas/CustomFieldType' }
        options:
          type: array
          items: { type: string }
          description: The allowed values for a `select`. Always present - an empty array for every other type - so a client never distinguishes null from absent.
        created_at: { type: string, format: date-time }
        archived:
          type: boolean
          description: An archived field accepts no new values and no longer resolves in templates, but the values contacts already hold under it are untouched and still send.
        archived_at: { type: string, format: date-time, nullable: true }
    CustomFieldCreate:
      type: object
      required: [key, label, type]
      properties:
        key: { type: string, pattern: '^[a-z][a-z0-9_]{0,39}$' }
        label: { type: string, minLength: 1, maxLength: 80 }
        type: { $ref: '#/components/schemas/CustomFieldType' }
        options:
          type: array
          items: { type: string }
          description: Required for `select` (1-100 entries) and rejected for every other type.
    CustomFieldUpdate:
      type: object
      required: [label]
      properties:
        label: { type: string, minLength: 1, maxLength: 80 }
        options:
          type: array
          items: { type: string }
          description: The select's full replacement option list. Rejected for a non-select field.
    CustomFieldValue:
      type: object
      required: [key, value, def]
      properties:
        key: { type: string }
        value: { type: string, description: Empty for a live field the contact has no value for. }
        def:
          allOf: [{ $ref: '#/components/schemas/CustomFieldDef' }]
          type: object
          nullable: true
          description: Null when the key has no live definition - an archived field, or a value written before definitions existed. Render these read-only rather than hiding them.
    CustomFieldValueSet:
      type: object
      required: [values]
      properties:
        values:
          type: object
          additionalProperties: { type: string }
          description: The contact's COMPLETE live field set, keyed by field key. An omitted live key is cleared; an empty value clears its key.
    Contact:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        first_name: { type: string }
        last_name: { type: string }
        company_id: { type: string, format: uuid, nullable: true }
        company_name: { type: string }
        job_title: { type: string }
        linkedin_url: { type: string, format: uri }
        deal_count: { type: integer, format: int64 }
    Campaign:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        subject: { type: string }
        status: { type: string }
        stats: { type: object, additionalProperties: { type: integer } }
    CampaignDetail:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        subject: { type: string }
        status: { type: string }
        tracking_enabled: { type: boolean, description: Whether open/click tracking is injected into this campaign's sends. }
        stats: { type: object, additionalProperties: { type: integer }, description: send counts by status }
        enrollments: { type: object, additionalProperties: { type: integer }, description: enrollment counts by status }
        steps: { type: array, items: { $ref: '#/components/schemas/SequenceStep' } }
        metrics: { $ref: '#/components/schemas/Metrics' }
    Metrics:
      type: object
      description: >-
        Per-campaign engagement rollup. Rates are fractions in 0..1 rounded to
        4 decimal places. opens_indicative/open_rate are proxy-filtered but
        remain approximate -- clicks are the reliable signal.
      properties:
        sent: { type: integer }
        opens_indicative: { type: integer }
        clicks: { type: integer }
        replies: { type: integer }
        bounces: { type: integer }
        unsubscribes: { type: integer }
        open_rate: { type: number }
        click_rate: { type: number }
        reply_rate: { type: number }
        bounce_rate: { type: number }
        unsub_rate: { type: number }
    CampaignEnrollment:
      type: object
      description: >-
        One contact's enrollment reply status in a campaign. The reply fields
        (reply_class/reply_source/replied_at) are null until an inbound reply is
        classified for that enrollment.
      required: [email, first_name, status, reply_class, reply_source, replied_at]
      properties:
        email: { type: string }
        first_name: { type: string }
        status: { type: string, description: enrollment lifecycle status (active/completed/stopped) }
        reply_class:
          type: string
          nullable: true
          description: >-
            Key of the reply label this reply was classified into. Deliberately
            an OPEN string, not an enum: a workspace defines its own labels
            (GET /reply-labels), and the key of a deleted custom label survives
            on historical enrollments, so clients must resolve it for display
            and degrade to showing the raw key.
        reply_source:
          type: string
          nullable: true
          description: layer that decided the class (header/lexicon/model)
        replied_at:
          type: string
          format: date-time
          nullable: true
          description: RFC3339 timestamp the reply was classified
    CampaignResultRow:
      type: object
      description: One arm's performance - a step's own copy, or one of its variants.
      required: [variant_id, label, is_base, weight, sent, opens, clicks, replies, bounces, unsubscribes, open_rate, click_rate, reply_rate, bounce_rate, unsub_rate]
      properties:
        variant_id:
          type: string
          format: uuid
          nullable: true
          description: Null for the step's own base copy, which is also every send made before variants existed.
        label: { type: string, description: "\"A\" for the base copy, otherwise the variant's own label." }
        is_base: { type: boolean }
        weight: { type: integer, description: "The arm share of the split. 0 for a retired arm that still has results." }
        sent: { type: integer, format: int64 }
        opens: { type: integer, format: int64, description: "Indicative opens: proxy-filtered, and structurally zero when tracking is off." }
        clicks: { type: integer, format: int64 }
        replies: { type: integer, format: int64 }
        bounces: { type: integer, format: int64 }
        unsubscribes: { type: integer, format: int64 }
        open_rate: { type: number, format: double }
        click_rate: { type: number, format: double }
        reply_rate: { type: number, format: double }
        bounce_rate: { type: number, format: double }
        unsub_rate:
          type: number
          format: double
          description: >-
            Every rate divides by this arm's own `sent`, never by enrollments -
            the numerator is per-arm, so a per-campaign denominator would let a
            rate exceed 1.
    CampaignStepResults:
      type: object
      required: [step_order, subject, rows, winner, winner_note]
      properties:
        step_order: { type: integer }
        subject: { type: string }
        rows: { type: array, items: { $ref: '#/components/schemas/CampaignResultRow' } }
        winner:
          type: string
          nullable: true
          description: >-
            The label of the arm with the clearly-best REPLY rate, or null. Reply
            rate is the criterion because it is the only measure of what a cold
            email is for: opens are proxy-inflated and unmeasurable with tracking
            off, and clicks rank a variant for containing a link.


            Null far more often than not, deliberately. Naming a winner is an
            instruction to promote one arm and retire another, and doing that on
            noise costs a worse campaign plus a false belief about why. It stays
            null below 200 sends on the leading arm, with no replies anywhere, and
            when the leader is under 25% relatively ahead of the runner-up.
        winner_note:
          type: string
          description: >-
            Why there is no winner, so a null is never left to be interpreted.
            Empty both when a winner was named and when the step has a single arm
            (no comparison is pending).
    CampaignResults:
      type: object
      required: [campaign_id, steps]
      properties:
        campaign_id: { type: string, format: uuid }
        steps: { type: array, items: { $ref: '#/components/schemas/CampaignStepResults' } }
    StepVariant:
      type: object
      description: One A/B alternative for a step. The step's own copy is variant A and is not represented here.
      required: [id, step_id, label, weight, subject, body_text, body_html]
      properties:
        id: { type: string, format: uuid }
        step_id: { type: string, format: uuid }
        label: { type: string, maxLength: 40, description: "Short name shown as a column in the results table; unique per step." }
        weight:
          type: integer
          minimum: 0
          description: >-
            Relative selection weight, against the step's own variant_weight and
            the other variants. 0 means "still here, no longer sending", which is
            how a losing arm is retired without orphaning the sends attributed to
            it.
        subject: { type: string, description: "Empty on a follow-up step threads onto the previous message, exactly as the base copy does." }
        body_text: { type: string }
        body_html: { type: string }
    StepVariantRequest:
      type: object
      required: [label, weight]
      properties:
        label: { type: string, minLength: 1, maxLength: 40 }
        weight: { type: integer, minimum: 0 }
        subject: { type: string }
        body_text: { type: string }
        body_html: { type: string }
    StepBaseWeightRequest:
      type: object
      required: [weight]
      properties:
        weight: { type: integer, minimum: 0 }
    SequenceStep:
      type: object
      properties:
        id: { type: string, format: uuid }
        step_order: { type: integer }
        delay_seconds: { type: integer, description: wait after the previous step's send before this one }
        subject: { type: string }
        body_text: { type: string }
        body_html: { type: string }
        variant_weight:
          type: integer
          minimum: 0
          description: >-
            This step's OWN share of its A/B split - the "A" side. Only
            meaningful alongside variants: a step with none sends its own content
            regardless of this value, matching the send path. Set it through PUT
            /campaigns/{id}/steps/{stepId}/base-weight, never through a step
            content edit.
    StepRequest:
      type: object
      properties:
        delay_seconds: { type: integer, minimum: 0 }
        subject: { type: string, maxLength: 500 }
        body_text: { type: string }
        body_html: { type: string }
    ReorderStepsRequest:
      type: object
      required: [step_ids]
      properties:
        step_ids:
          type: array
          description: the FULL ordered list of the campaign's step ids, in the desired order
          items: { type: string, format: uuid }
    CreateCampaignRequest:
      type: object
      required: [name, mailbox_id, list_id, subject]
      properties:
        name: { type: string }
        mailbox_id: { type: string, format: uuid }
        list_id: { type: string, format: uuid }
        subject: { type: string }
        body_text: { type: string }
        body_html: { type: string }
    UpdateCampaignTrackingRequest:
      type: object
      properties:
        enabled: { type: boolean }
    RenameCampaignRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
    DomainAuthState:
      type: string
      description: >-
        passing requires SPF AND DMARC. DKIM is deliberately excluded: selectors
        are not discoverable from DNS, so a "not found" means none of the probed
        selectors matched, not that the domain is unsigned. unknown means a lookup
        could not be completed (timeout, SERVFAIL) and is NOT a failure — a
        resolver hiccup must never read as a misconfigured domain.
      enum: [unknown, passing, failing]
    SpfStatus:
      type: object
      required: [found]
      properties:
        found: { type: boolean }
        record: { type: string, description: "The v=spf1 record as published, when found." }
    DmarcStatus:
      type: object
      required: [found]
      properties:
        found: { type: boolean }
        policy:
          type: string
          description: >-
            The p= tag. "none" is monitoring only, not enforcement, and should be
            surfaced differently from quarantine/reject.
          enum: ["", none, quarantine, reject]
    DkimStatus:
      type: object
      description: >-
        Advisory only. Selectors cannot be enumerated from DNS, so this reports
        which probed selector matched, and a false "found" never makes a domain
        fail.
      required: [found]
      properties:
        found: { type: boolean }
        selector: { type: string, description: "The selector that matched, when one did." }
    SendingDomain:
      type: object
      required: [domain, state, spf, dmarc, dkim, mailbox_count]
      properties:
        domain: { type: string, example: acme.com }
        state: { $ref: '#/components/schemas/DomainAuthState' }
        spf: { $ref: '#/components/schemas/SpfStatus' }
        dmarc: { $ref: '#/components/schemas/DmarcStatus' }
        dkim: { $ref: '#/components/schemas/DkimStatus' }
        mailbox_count: { type: integer, description: "How many of this workspace's mailboxes send from this domain." }
        checked_at: { type: string, format: date-time, nullable: true, description: "null when never checked." }
    ScoreConfidence:
      type: string
      description: >-
        How far the score should be trusted: driven by sample size and by how many
        inputs were actually measured. A high score at low confidence is not a
        clean bill of health.
      enum: [low, medium, high]
    ScoreComponent:
      type: object
      required: [key, label, penalty, measured]
      properties:
        key: { type: string, enum: [bounce, complaint, spam_placement, warmup, domain_auth] }
        label: { type: string }
        penalty: { type: integer, description: "Points subtracted from 100 by this component." }
        rate: { type: number, nullable: true, description: "Observed rate as a percentage, when measured." }
        measured:
          type: boolean
          description: >-
            False when no feed exists for this signal. False means ABSENT, not
            clean: render it as "not measured", never as 0%.
        detail: { type: string, description: "Human explanation, e.g. the warmup state driving the penalty." }
    DeliverabilityScore:
      type: object
      required: [value, confidence, components, delivered]
      properties:
        value: { type: integer, minimum: 0, maximum: 100 }
        confidence: { $ref: '#/components/schemas/ScoreConfidence' }
        delivered: { type: integer, description: "Sample the score was computed over." }
        components: { type: array, items: { $ref: '#/components/schemas/ScoreComponent' } }
    DeliverabilityPoint:
      type: object
      required: [date, delivered, bounced]
      properties:
        date: { type: string, format: date }
        delivered: { type: integer }
        bounced: { type: integer }
        complained: { type: integer, nullable: true }
        spam_placed: { type: integer, nullable: true }
    AtRiskItem:
      type: object
      required: [label, reason]
      properties:
        label: { type: string, description: "Mailbox address or domain." }
        reason: { type: string }
    DeliverabilityReport:
      type: object
      required: [score, series, at_risk_mailboxes, at_risk_domains]
      properties:
        score: { $ref: '#/components/schemas/DeliverabilityScore' }
        series: { type: array, items: { $ref: '#/components/schemas/DeliverabilityPoint' } }
        at_risk_mailboxes: { type: array, items: { $ref: '#/components/schemas/AtRiskItem' } }
        at_risk_domains: { type: array, items: { $ref: '#/components/schemas/AtRiskItem' } }
    CampaignPauseEvent:
      type: object
      required: [reason, metric, value, threshold, delivered, created_at]
      properties:
        reason: { type: string, enum: [bounce_spike, complaint_spike] }
        metric: { type: string, enum: [bounce_rate, complaint_rate] }
        value: { type: number, description: "The observed rate that tripped it." }
        threshold: { type: number }
        delivered: { type: integer, description: "Sample it was judged on, always at or above the minimum." }
        created_at: { type: string, format: date-time }
    CampaignDeliverability:
      type: object
      required: [score, guardrails, pause_events, verdict]
      properties:
        score: { $ref: '#/components/schemas/DeliverabilityScore' }
        guardrails: { $ref: '#/components/schemas/CampaignGuardrails' }
        pause_events: { type: array, items: { $ref: '#/components/schemas/CampaignPauseEvent' } }
        verdict:
          type: string
          description: >-
            ok; warn when a rate sits in the band below its pause threshold; paused
            when the breaker has fired.
          enum: [ok, warn, paused]
    CampaignGuardrails:
      type: object
      required: [auto_pause_enabled, bounce_pause_pct, complaint_pause_pct]
      properties:
        auto_pause_enabled: { type: boolean }
        bounce_pause_pct: { type: number, minimum: 0.1, maximum: 100 }
        complaint_pause_pct: { type: number, minimum: 0.1, maximum: 100 }
    DeliverabilityEvent:
      type: object
      required: [kind, email, provider_event_id]
      properties:
        kind: { type: string, enum: [complaint, bounce] }
        email: { type: string }
        provider_event_id: { type: string, description: "The provider's own id; the idempotency key." }
        send_id: { type: string, format: uuid, nullable: true }
        bounce_class:
          type: string
          enum: [hard, soft, unknown]
          default: unknown
          description: >-
            Whether a bounce is permanent (hard) or transient (soft). Provider
            feeds mix them, and only hard bounces feed the warmup hard-bounce
            rate — counting a greylist or a full mailbox as permanent pauses a
            healthy sender. Omitted or 'unknown' is excluded from that rate
            rather than assumed hard: under-counting is the safe direction.
            Ignored when kind is 'complaint'.
    ContactSort:
      type: string
      description: >-
        newest/oldest order by created_at, email orders alphabetically. Each is
        backed by its own index, and a cursor is only valid for the sort that
        produced it.
      enum: [newest, oldest, email]
      default: newest
    ContactPage:
      type: object
      required: [items, total, total_is_capped]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Contact' } }
        next_cursor:
          type: string
          nullable: true
          description: Cursor for the following page; null on the last page.
        prev_cursor:
          type: string
          nullable: true
          description: Cursor for the preceding page; null on the first page.
        total:
          type: integer
          description: >-
            Matching contacts. Exact when below the cap; equal to the cap when
            total_is_capped is true.
        total_is_capped:
          type: boolean
          description: >-
            True when there are at least `total` matches and counting stopped there.
            Render as "N+" — counting further would be an unbounded scan.
    ContactCompany:
      type: object
      required: [id, name, domain]
      description: >-
        The CRM company record the contact is linked to. The free-text company name
        an import row carried is NOT this - only a real `companies` row appears here.
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        domain: { type: string, description: "Empty when the company has no domain on file." }
    ContactCompanyLink:
      type: object
      required: [company_id]
      properties:
        company_id:
          type: string
          format: uuid
          nullable: true
          description: >-
            The company to link this contact to, or null to unlink. Must be a
            company in the caller's workspace; anything else is 404.
    ContactSuppression:
      type: object
      required: [reason, email, is_primary_email, suppressed_at]
      description: >-
        Why this person may not be emailed. Present when any address of theirs is
        on the workspace suppression list; the record page's first question is
        "may I email this person at all", which outranks every engagement number.


        Exactly ONE reason is reported, never a set of flags: the suppression list
        is unique per (workspace, address), so an address has one reason. A contact
        with several addresses could have a different reason on each - this reports
        the one that matters, preferring the primary address, so a client renders a
        single unambiguous label and never has to invent a precedence rule.


        This is NOT the same fact as the engagement rollup's `bounces` and
        `unsubscribes`, which count stopped ENROLLMENTS (one campaign ended). This
        is the authoritative, workspace-wide answer to whether the person may be
        contacted at all.
      properties:
        reason:
          type: string
          enum: [unsubscribe, bounce, complaint, manual]
          description: >-
            The suppression list's own reason literal. `complaint` (they reported
            us as spam) is deliberately distinct from `unsubscribe` (they asked to
            stop) and is never collapsed into it. `bounce` here means a HARD bounce
            classified by the inbox poller - an ingested provider bounce feed does
            not suppress at all, because those include soft bounces (full mailbox,
            greylisting) and suppressing forever on a temporary failure is not
            recoverable. So a `bounce` on this list is a permanent delivery
            failure, not "a message bounced once".
        email:
          type: string
          description: The suppressed address, which is not necessarily the one sends would use.
        is_primary_email:
          type: boolean
          description: >-
            Which of TWO different operational states this is - do not simplify it
            away to "an address is suppressed".


            True: the suppressed address is the contact's primary one, the address
            the send path actually resolves, so this person cannot be emailed at
            all. A hard stop, now.


            False: only a secondary alias is suppressed. Sending works today
            because it does not use that address - but promoting the alias to
            primary (PUT /crm/contacts/{id}/emails/{emailID}/primary) would
            silently stop sending. Reachable now, breakable by a routine edit.


            A boolean "suppressed" flag would merge those two into one answer that
            is wrong for whichever case it is not describing.
        suppressed_at: { type: string, format: date-time }
    ContactDeal:
      type: object
      required: [id, name, pipeline_id, stage_id, stage_label, stage_color, stage_is_won, stage_is_lost, currency, created_at, updated_at]
      description: A deal this contact is the primary contact on, with the stage fields a chip needs.
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        pipeline_id: { type: string, format: uuid }
        stage_id: { type: string, format: uuid }
        stage_label: { type: string }
        stage_color: { type: string }
        stage_is_won: { type: boolean }
        stage_is_lost: { type: boolean }
        amount_micros: { type: integer, format: int64, nullable: true }
        currency: { type: string }
        close_date: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ContactDetail:
      type: object
      required: [id, email, first_name, last_name, job_title, linkedin_url, suppression, company, deals, deal_count, deals_truncated, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, description: The address the send path resolves for this contact. }
        first_name: { type: string }
        last_name: { type: string }
        job_title: { type: string }
        linkedin_url: { type: string }
        suppression:
          allOf: [{ $ref: '#/components/schemas/ContactSuppression' }]
          type: object
          nullable: true
          description: Null when no address of this contact is suppressed - i.e. they may be emailed.
        company:
          allOf: [{ $ref: '#/components/schemas/ContactCompany' }]
          type: object
          nullable: true
          description: Null when the contact is not linked to a company record.
        deals:
          type: array
          description: >-
            Deals in board order, capped at 25. A record page shows a roster, not a
            paginated list; the cap is what keeps this response bounded.
          items: { $ref: '#/components/schemas/ContactDeal' }
        deal_count:
          type: integer
          format: int64
          description: >-
            The contact's TRUE deal total, counted independently of the capped
            `deals` list. Render "25 of 38" from this rather than treating the cap
            as the whole set.
        deals_truncated:
          type: boolean
          description: True when the contact has more deals than the cap and `deals` was cut short.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ContactCampaignEnrollment:
      type: object
      required: [campaign_id, campaign_name, tracking_enabled, status, current_step, enrolled_at]
      properties:
        campaign_id: { type: string, format: uuid }
        campaign_name: { type: string }
        tracking_enabled:
          type: boolean
          description: >-
            Whether this campaign injected open/click tracking. This is the only
            thing that tells "nobody opened" apart from "opens were never
            recorded": a campaign with tracking off contributes to `emails_sent`
            but structurally cannot contribute to `opens_indicative` or `clicks`.
            The rollup's counts deliberately do not adjust for it - use this to
            explain a zero rather than to correct one.


            This is the PER-ENROLLMENT detail, for marking individual rows. Do not
            aggregate it to decide whether the summary's zeros were measured: the
            list is capped, so use the top-level `opens_measurable` for that.
        status: { type: string, enum: [active, completed, stopped] }
        current_step:
          type: integer
          description: "0 means enrolled but not yet sent to; N means step N was the last one sent."
        stop_reason:
          type: string
          nullable: true
          description: >-
            Why the sequence stopped - one of replied, bounced, suppressed, manual,
            failed. `failed` is real (added by migration 000008 for a degenerate or
            exhausted send cap) and is deliberately NOT counted as a bounce or an
            unsubscribe in the rollup above. Null while the enrollment is still
            active or completed normally. Treat this as an open set: render an
            unrecognised literal verbatim rather than dropping it, so a future
            reason degrades visibly instead of vanishing.
        enrolled_at: { type: string, format: date-time }
        last_sent_at: { type: string, format: date-time, nullable: true }
    ContactEngagement:
      type: object
      required: [contact_id, emails_sent, opens_indicative, clicks, replies, bounces, unsubscribes, open_rate, click_rate, campaigns_enrolled, opens_measurable, last_activity_at, campaigns, campaigns_truncated]
      description: >-
        Counts reuse the per-campaign Metrics definitions verbatim, so a contact's
        numbers roll up to the campaign's. `open_rate`/`click_rate` divide by
        `emails_sent` (per-send, because a multi-step sequence sends several times
        per contact) and are 0 when nothing has been sent - never a division by
        zero. Reply/bounce/unsubscribe are reported as counts only: their
        per-contact denominator is `campaigns_enrolled`, which is not a rate anyone
        reads for one person.


        Every counter is always a number and never null: nothing-happened is 0. The
        one case a 0 does not distinguish is a campaign with tracking disabled,
        which contributes sends but cannot contribute opens or clicks - read
        `opens_measurable` (NOT `campaigns[].tracking_enabled`, which is capped) to
        tell an unmeasured zero from a real one.
      properties:
        contact_id: { type: string, format: uuid }
        emails_sent: { type: integer, format: int64, description: "Sends with status 'sent' - the same numerator as the campaign rollup's stats.sent." }
        opens_indicative:
          type: integer
          format: int64
          description: >-
            Distinct sends with an open event that is not a known prefetch (image
            proxy UA, or a fetch within two seconds of the send). Approximate by
            nature - clicks are the reliable signal.
        clicks: { type: integer, format: int64, description: Distinct sends with at least one click event. }
        replies: { type: integer, format: int64, description: "Enrollments stopped with reason 'replied'." }
        bounces: { type: integer, format: int64, description: "Enrollments stopped with reason 'bounced'." }
        unsubscribes: { type: integer, format: int64, description: "Enrollments stopped with reason 'suppressed'." }
        open_rate: { type: number, description: "opens_indicative / emails_sent, or 0 when nothing was sent." }
        click_rate: { type: number, description: "clicks / emails_sent, or 0 when nothing was sent." }
        campaigns_enrolled: { type: integer, format: int64, description: "Enrollments over the contact's lifetime - active, completed, and stopped." }
        opens_measurable:
          type: boolean
          description: >-
            Whether an open COULD have been recorded for this contact: true when at
            least one send that actually went out belonged to a campaign with
            tracking enabled.


            Use it as `emails_sent > 0 && !opens_measurable` to render
            `opens_indicative` and `clicks` as "not measured" instead of 0. Do NOT
            derive this from `campaigns[].tracking_enabled`: that list is capped at
            20, so for a contact with more enrollments whose newest are untracked
            and whose older ones were tracked, a client-side `some()` answers false
            and explains away a genuine zero. This field is computed over the whole
            send history and is correct at any enrollment count.


            Caveat: `campaigns.tracking_enabled` is mutable (PUT
            /campaigns/{id}/tracking), and no per-send record of the flag at send
            time exists, so this reflects each campaign's CURRENT setting. Toggling
            tracking off after a send can therefore turn a measured zero into an
            "unmeasured" one retroactively. Reporting the current setting is the
            best available answer, not a perfect one.


            When a non-zero count coexists with `opens_measurable: false`, trust
            the count - a recorded event outranks an inference about whether it
            could have been recorded.
        last_activity_at:
          type: string
          format: date-time
          nullable: true
          description: >-
            The most recent of the contact's last send and last tracking event. Null
            when neither has ever happened.
        campaigns:
          type: array
          description: The 20 most recently enrolled campaigns, newest first.
          items: { $ref: '#/components/schemas/ContactCampaignEnrollment' }
        campaigns_truncated:
          type: boolean
          description: True when the contact has more enrollments than the cap. The counts above stay exact regardless.
    RotationMode:
      type: string
      description: >-
        How a contact is assigned a mailbox from the pool. round_robin evens out the
        contact count, least_recently_used spreads over time, and weighted (the
        default) scores each mailbox by remaining daily capacity, warmup health, and
        age so the mailbox best able to carry volume takes more of it.
      enum: [round_robin, least_recently_used, weighted]
    CampaignSender:
      type: object
      required: [mailbox_id, email, weight, enabled, assigned_count]
      properties:
        mailbox_id: { type: string, format: uuid }
        email: { type: string, description: "Read-only, for display" }
        provider: { type: string, description: "Read-only mailbox provider" }
        status: { type: string, description: "Read-only mailbox status" }
        weight: { type: integer, minimum: 1, maximum: 100 }
        enabled: { type: boolean }
        assigned_count: { type: integer, format: int64, description: "Contacts assigned to this mailbox so far" }
        last_assigned_at: { type: string, format: date-time, nullable: true }
        health_state:
          type: string
          nullable: true
          description: "Read-only warmup health; null when the mailbox is not warming up."
          enum: [unknown, healthy, watch, throttled, paused, null]
        sending:
          type: boolean
          description: >-
            Read-only. False when this mailbox is not taking cold volume right now —
            paused by warmup, held out of rotation, or an inactive mailbox.
        cap_today:
          type: integer
          description: "Read-only effective cap for today, after ramp and after warmup-health scaling."
        sent_today:
          type: integer
          description: "Read-only count of sends from this mailbox today (UTC day)." 
    CampaignSenderPool:
      type: object
      required: [rotation_mode, senders, max_fault_domain_share, fault_domain_shares]
      properties:
        rotation_mode: { $ref: '#/components/schemas/RotationMode' }
        senders: { type: array, items: { $ref: '#/components/schemas/CampaignSender' } }
        max_fault_domain_share:
          type: number
          format: double
          description: >-
            Read-only. The most of a campaign's assigned volume that should rest on
            one fault domain while an alternative exists — the limit
            fault_domain_shares is measured against. Carried on the wire so a client
            never hard-codes it.
        fault_domain_shares:
          type: array
          description: >-
            Read-only. How concentrated this campaign's sending is, worst first:
            one entry per thing that can fail for several of its mailboxes at once.
            Empty when nothing in the pool can be grouped. Measured over the WHOLE
            pool including disabled members, because the risk lives in the mail
            already sent rather than in today's roster.
          items: { $ref: '#/components/schemas/FaultDomainShare' }
    FaultDomainShare:
      type: object
      description: >-
        One fault domain's slice of a campaign's assigned contacts. The domain is
        the organizational domain the mailboxes share standing under; consumer
        providers (gmail.com and the like) are deliberately absent, because two
        strangers there do not share a fate.
      required: [domain, assigned, share, ceiling, over_budget]
      properties:
        domain: { type: string }
        assigned:
          type: integer
          format: int64
          description: "Contacts assigned to mailboxes on this domain."
        share:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: "Fraction of the campaign's assigned contacts, not a percentage."
        ceiling:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: >-
            The share this domain was judged against — max_fault_domain_share, or a
            LOWER one because the domain is degrading. Published because otherwise a
            reader cannot tell why a domain at 25% is over budget while another at 55%
            is not, and would reasonably conclude the figure was wrong. Compare each
            share against its own ceiling, never against max_fault_domain_share alone.
        over_budget:
          type: boolean
          description: >-
            True when share exceeds max_fault_domain_share. Advisory: the rotation
            routes new contacts away from an over-budget domain when an alternative
            exists, but never withholds a send — a single-domain pool reports 1.0
            here and keeps sending.
    CampaignSenderRequest:
      type: object
      required: [mailbox_id]
      properties:
        mailbox_id: { type: string, format: uuid }
        weight: { type: integer, minimum: 1, maximum: 100, default: 1 }
        enabled: { type: boolean, default: true }
    CampaignSenderPoolRequest:
      type: object
      description: "Full replace. At least one sender is required."
      required: [rotation_mode, senders]
      properties:
        rotation_mode: { $ref: '#/components/schemas/RotationMode' }
        senders: { type: array, minItems: 1, items: { $ref: '#/components/schemas/CampaignSenderRequest' } }
    SendWindowInterval:
      type: object
      description: >-
        A half-open [start_minute, end_minute) span of minutes from local
        midnight, so 540-720 and 720-1020 are adjacent rather than overlapping.
      required: [start_minute, end_minute]
      properties:
        start_minute: { type: integer, minimum: 0, maximum: 1439 }
        end_minute: { type: integer, minimum: 1, maximum: 1440 }
    SendWindowDay:
      type: object
      description: One weekday's open sending intervals. 0 = Sunday.
      required: [weekday, intervals]
      properties:
        weekday: { type: integer, minimum: 0, maximum: 6 }
        intervals: { type: array, items: { $ref: '#/components/schemas/SendWindowInterval' } }
    CampaignSchedule:
      type: object
      description: >-
        A campaign's sending plan: when it may send, and at most how much. Sends are
        placed inside these windows, spread through a distribution curve and nudged
        off the clock grid, so a launch never emits on a uniform interval.
      required: [timezone, days]
      properties:
        timezone: { type: string, description: "IANA zone the windows are interpreted in", example: America/New_York }
        days: { type: array, items: { $ref: '#/components/schemas/SendWindowDay' } }
        daily_limit:
          type: integer
          minimum: 1
          maximum: 1000000
          nullable: true
          description: >-
            Campaign-wide cap on sends per UTC day, across every mailbox in the pool.
            null means no campaign limit. It can only lower throughput: a mailbox is
            never raised above its own ramped, health-scaled daily cap. Bounded at
            1000000 because the column is a 32-bit integer — an unbounded value would
            reach Postgres out of range and surface as a 500 instead of a validation
            error.
        max_new_leads_per_day:
          type: integer
          minimum: 1
          maximum: 1000000
          nullable: true
          description: >-
            Narrower than daily_limit: caps how many BRAND-NEW contacts this campaign
            starts per UTC day. null means no limit. Counts only step-1 sends, so a
            sequence already in flight keeps sending its follow-ups on schedule
            regardless of how many new contacts started today. Bounded at 1000000 for
            the same 32-bit-integer reason as daily_limit.
        preview:
          type: array
          description: "Human-readable preview of the next few send instants this schedule produces, in its own timezone."
          items: { type: string, example: 'Mon 09:14:37' }
    CampaignScheduleRequest:
      type: object
      description: Full replace. A weekday absent from days is closed.
      required: [timezone, days]
      properties:
        timezone: { type: string, example: America/New_York }
        days: { type: array, items: { $ref: '#/components/schemas/SendWindowDay' } }
        daily_limit:
          type: integer
          minimum: 1
          maximum: 1000000
          nullable: true
          description: "Campaign-wide sends per UTC day; null or omitted clears the limit."
        max_new_leads_per_day:
          type: integer
          minimum: 1
          maximum: 1000000
          nullable: true
          description: >-
            Brand-new contacts started per UTC day; null or omitted clears the limit.
            This is a full-replace PUT, so an omitted field clears it exactly like an
            explicit null.

    CampaignPreflightCheck:
      type: object
      description: One readiness check's verdict.
      required: [id, severity, title, detail, remedy]
      properties:
        id:
          type: string
          enum: [sequence_steps, empty_bodies, personalization_tokens, variant_weights, schedule_windows, sender_pool, audience, domain_auth, tracking, daily_limit, warmup_health]
          description: >-
            `personalization_tokens` FAILS (does not warn) when a step contains a
            `{{...}}` placeholder nothing will substitute, which is harsher than
            the neighbouring content checks on purpose: an empty body is visible
            the moment an operator looks at it, whereas a bad token produces an
            email that looks fine in the editor and arrives reading "Hi
            {{firstname}}" or "Hi ,". A token nothing resolves is always a typo or
            a since-archived field, never an intent.
        severity: { type: string, enum: [pass, warn, fail] }
        title: { type: string }
        detail: { type: string }
        remedy: { type: string, description: "Empty string for a passing check." }
    CampaignPreflight:
      type: object
      description: >-
        GET /campaigns/{id}/preflight's launch-readiness report. ready is true
        iff no check below is severity fail — a warn is informational and
        never blocks a launch.
      required: [ready, checks]
      properties:
        ready: { type: boolean }
        checks: { type: array, items: { $ref: '#/components/schemas/CampaignPreflightCheck' } }
    TestSendRequest:
      type: object
      required: [step_id, to]
      properties:
        step_id: { type: string, format: uuid }
        to: { type: string, format: email }
    TestSendResponse:
      type: object
      required: [queued]
      properties:
        queued: { type: boolean }

    WarmupSettings:
      type: object
      description: >-
        Warmup ramp settings for a mailbox. All fields optional on update; omitted
        fields keep their current (or default) value. Validated at the boundary:
        1 <= start_volume <= max_volume <= 200, ramp_increment >= 1,
        0 <= reply_rate <= 1.
      properties:
        start_volume: { type: integer, minimum: 1, maximum: 200, description: warmup emails/day at day 0 }
        max_volume: { type: integer, minimum: 1, maximum: 200, description: daily ceiling the ramp climbs to }
        ramp_increment: { type: integer, minimum: 1, description: emails/day added each day }
        reply_rate: { type: number, minimum: 0, maximum: 1, description: probability a warmup send is an in-thread reply }
    WarmupParticipant:
      type: object
      description: >-
        One mailbox's warmup enrollment state. health_state and lane are two
        independent axes and neither implies the other: health_state is SENDER
        REPUTATION (how this mailbox's outbound mail performs), lane is POOL
        ELIGIBILITY (which peers it may exchange warmup traffic with, and
        whether it may take new campaign leads). A mailbox can be
        reputation-healthy and still sit in probation because it has not proven
        itself yet, or sit in quarantine while its last measured reputation was
        fine. Clients must not present either axis as a synonym for the other,
        and must not order the two enums against each other.
      required: [mailbox_id, enabled, start_volume, max_volume, ramp_increment, reply_rate, health_state, health_reason, lane, started_at, today_sent, today_target]
      properties:
        mailbox_id: { type: string, format: uuid }
        enabled: { type: boolean }
        start_volume: { type: integer }
        max_volume: { type: integer }
        ramp_increment: { type: integer }
        reply_rate: { type: number }
        health_state:
          type: string
          enum: [unknown, healthy, watch, throttled, paused]
          description: >-
            SENDER REPUTATION axis — the verdict on this mailbox's outbound mail,
            derived from inbox-placement and behavior signals. Carries no claim
            about pool eligibility; see lane for that.
        health_reason: { type: string, description: human-readable explanation of a non-healthy state }
        lane:
          type: string
          enum: [pending_auth, probation, healthy, watch, recovery, quarantine, blocked]
          description: >-
            POOL ELIGIBILITY axis — which peers this mailbox may exchange warmup
            traffic with (selection pairs same-lane only) and whether it may
            take new campaign leads. pending_auth = authentication and ownership
            not proven yet, no warmup and no new leads. probation = gathering
            evidence at a floor volume in its own lane, reduced leads.
            healthy = full participation. watch = reduced volume while a signal
            is diagnosed. recovery = earning its way back at a floor volume in
            its own lane. quarantine = withheld from the pool and new campaign
            leads blocked; exit needs fresh qualifying evidence, never elapsed
            time alone. blocked = withheld until an operator approves re-entry.
            Clients must treat an unrecognized value as unproven (probation),
            never as healthy.
        started_at: { type: string, format: date-time }
        today_sent: { type: integer, description: warmup emails sent by this mailbox today }
        today_target: { type: integer, description: "today's intended (un-jittered) daily ramp target; 0 when paused. The worker applies a ±20% per-day jitter factor, so today_sent may occasionally exceed this." }
    WarmupTransitionPage:
      type: object
      required: [transitions]
      properties:
        transitions:
          type: array
          items: { $ref: '#/components/schemas/WarmupTransition' }
    WarmupTransition:
      type: object
      description: >-
        One automated state change and the evidence behind it. Both axes are
        recorded because they move independently and are written together: the
        health fields are always present, the lane fields are null on rows
        written before pool lanes existed.
      required:
        [id, created_at, from_state, to_state, reason_code, reason,
         placement_samples, spam_rate, bounce_samples, bounce_rate,
         complaint_samples, complaint_rate, invalid_tokens, policy_version]
      properties:
        id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        from_state:
          type: string
          enum: [unknown, healthy, watch, throttled, paused]
          description: "SENDER REPUTATION axis before the change."
        to_state:
          type: string
          enum: [unknown, healthy, watch, throttled, paused]
        reason_code:
          type: string
          description: >-
            Stable machine identifier for why the health axis landed here, e.g.
            spam_watch, campaign_bounce_throttle, recovery_step,
            placement_sample_insufficient. Never empty.
        reason: { type: string, description: "Human-readable form of reason_code." }
        from_lane:
          type: string
          nullable: true
          enum: [pending_auth, probation, healthy, watch, recovery, quarantine, blocked, null]
          description: "POOL ELIGIBILITY axis before the change; null on pre-lane rows."
        to_lane:
          type: string
          nullable: true
          enum: [pending_auth, probation, healthy, watch, recovery, quarantine, blocked, null]
        lane_reason_code: { type: string, nullable: true }
        lane_reason: { type: string, nullable: true }
        placement_samples:
          type: integer
          description: "Trusted inbox+spam observations in the evidence window."
        spam_rate:
          type: number
          description: >-
            Confidence-adjusted, not the raw observed fraction: a 95% lower bound,
            so a thin sample reads lower than its point estimate. 0 when the
            minimum sample was not met.
        bounce_population:
          type: string
          enum: [campaign, warmup]
          nullable: true
          description: >-
            WHICH bounce population the samples and rate below describe. The engine
            keeps campaign and warmup hard bounces apart deliberately — pooling them
            let synthetic warmup traffic dilute a real campaign bounce rate below its
            own threshold — and the transition records whichever arm actually drove
            the decision, with its own denominator. Without this the row can read
            "campaign hard bounces crossed the pause threshold" beside a figure
            labelled only "hard bounces", or report a warmup-driven pause next to a
            campaign denominator of zero. Null on rows written before the split.
        bounce_samples: { type: integer, description: "Denominator of the population named by bounce_population." }
        bounce_rate: { type: number, description: "Lower-bounded, like spam_rate." }
        complaint_samples: { type: integer }
        complaint_rate: { type: number, description: "Lower-bounded, like spam_rate." }
        invalid_tokens:
          type: integer
          description: >-
            Forged warmup tokens this mailbox RECEIVED. Observer-side only and
            never attributed to a claimed sender, so it never gates health.
        policy_version:
          type: string
          description: "Which thresholds produced this decision, so an old row stays readable after they move."
    WarmupMailbox:
      type: object
      description: >-
        A participant enriched with rolling placement rates for the overview.
        health_state and lane are the two independent axes described on
        WarmupParticipant — reputation and pool eligibility respectively — so a
        row may pair any health_state with any lane.
      required: [mailbox_id, email, enabled, health_state, health_reason, lane, lane_reason, today_sent, today_target, placement_sample_7d, inbox_rate_7d, spam_rate_7d]
      properties:
        mailbox_id: { type: string, format: uuid }
        email: { type: string }
        enabled: { type: boolean }
        health_state:
          type: string
          enum: [unknown, healthy, watch, throttled, paused]
          description: SENDER REPUTATION axis (see WarmupParticipant.health_state)
        health_reason: { type: string }
        lane:
          type: string
          enum: [pending_auth, probation, healthy, watch, recovery, quarantine, blocked]
          description: POOL ELIGIBILITY axis (see WarmupParticipant.lane)
        lane_reason:
          type: string
          description: >-
            human-readable explanation of the current lane — what put the mailbox
            there and what clears it. Empty for a lane that needs no explanation.
        today_sent: { type: integer }
        today_target: { type: integer }
        placement_sample_7d: { type: integer, format: int64, description: "trusted inbox plus spam placement observations in the trailing 7 days" }
        tabbed_rate_7d:
          type: number
          nullable: true
          description: >-
            Of this mailbox's warmup mail that a provider could categorise, the
            fraction that landed in a TAB (Gmail Promotions/Updates/Social/Forums)
            rather than the primary inbox. CATEGORY_PERSONAL is not a tab — Gmail
            applies it to ordinary Primary-tab mail, so counting it would report
            almost everything as tabbed and invert the signal. A tabbed landing still
            counts as an inbox placement in placement_sample_7d and inbox_rate_7d:
            it arrived, just not in Primary, and excluding it would strip a
            Promotions-only mailbox of every placement sample and demote it to
            unknown. Null when nothing that OBSERVED this
            mailbox's mail could report a category. Note whose capability that is:
            placement is attributed to the SENDER but recorded by the RECIPIENT's
            poller, so a Gmail sender whose warmup partners are all IMAP reports null
            even though its own provider could categorise perfectly well. Render it as
            "no partner could report a tab", never as a clean zero, and never as a
            statement about this mailbox's own provider. Reported for visibility only: no threshold,
            lane or promotion decision reads it, because a signal invisible on a whole
            provider class must not gate anything.
        tab_capable_sample_7d:
          type: integer
          format: int64
          description: >-
            INBOX-SIDE placement observations in the window whose reader could have
            seen a tab — the denominator of tabbed_rate_7d. Spam-placed observations
            are excluded deliberately: a tab is a distinction WITHIN the inbox, so
            folding spam into this denominator would make a mailbox with a spam
            problem read as having less of a tab problem. Counted separately from
            placement_sample_7d because pooling observations that structurally cannot
            report a tab would dilute the rate toward zero and make an untested pool
            read clean.
        inbox_rate_7d: { type: number, nullable: true, description: "of this mailbox's SENT warmup mail over 7 days, the fraction that landed in partners' inboxes (0..1); null when no placement was observed" }
        spam_rate_7d: { type: number, nullable: true, description: "of this mailbox's SENT warmup mail over 7 days, the fraction that landed in partners' spam (0..1); null when no placement was observed" }
        identity:
          type: object
          nullable: true
          description: >-
            The latest observed SENDING identity of this mailbox's warmup mail and the
            receiving provider's authentication verdicts on it. Null when no observation
            has yet carried identity facts. Reported for visibility only: no threshold,
            lane, or promotion decision reads any of it.
            The three verdicts separate an absence from a finding, and a UI that renders
            them alike is wrong: `unknown` means no Authentication-Results header could be
            trusted to speak for the receiving system (RFC 8601 §5), so nobody reported a
            verdict — permanent for a provider that stamps none, and never a failure —
            whereas `none` IS the receiver's finding, that it checked and there was no
            SPF record, no signature, or no DMARC record to check against.
          required: [dkim_domain, return_path_domain, spf_result, dkim_result, dmarc_result, observed_at]
          properties:
            dkim_domain:        { type: string, description: "the DKIM d= signing domain, as the EXACT host and lower-cased; empty when the mail was unsigned or the signature was unparseable" }
            return_path_domain: { type: string, description: "host of the Return-Path address, EXACT and lower-cased; empty when absent or a null return path (the <> a bounce carries). Deliberately not folded to the organizational domain the reputation gate groups on: authentication identities are published per host, so folding bounce.example.com into example.com would erase the distinction between a failing signing identity and its healthy siblings." }
            spf_result:         { type: string, enum: [pass, fail, neutral, none, unknown] }
            dkim_result:        { type: string, enum: [pass, fail, neutral, none, unknown] }
            dmarc_result:       { type: string, enum: [pass, fail, neutral, none, unknown] }
            observed_at:        { type: string, format: date-time }
    WarmupOverview:
      type: object
      description: >-
        Workspace warmup summary. pool_size is the number of enabled participants;
        warmup needs at least 2 to exchange mail (active is true when pool_size>=2).
      required: [pool_size, active, mailboxes, discounted_observers, incidents, incidents_min_pool]
      properties:
        pool_size: { type: integer }
        incidents_min_pool:
          type: integer
          description: >-
            The smallest pool in which correlated-incident detection can find
            anything: enough participants to form a cohort AND at least one outside
            it to compare against. Served so the UI can tell "we looked and found no
            shared cause" from "this pool is too small to look", which are different
            answers and must not render alike. It is here rather than hardcoded
            client-side because it is derived from a backend policy constant, and a
            client copy would drift the moment that constant is recalibrated —
            leaving the UI claiming it searched a pool the server never examined.
        active: { type: boolean }
        mailboxes:
          type: array
          items: { $ref: '#/components/schemas/WarmupMailbox' }
        discounted_observers:
          type: array
          description: >-
            Mailboxes that reported far more of the warmup mail they received as spam than
            their peers on the same receiving provider did. Placement is sender-attributed
            but recipient-observed, so one mailbox that reports everything it receives as
            spam — a misconfigured filter, a bulk-junked folder, one compromised account —
            makes every sender that mails it look worse than it is. Empty when no observer
            stands out from its peers.
            NOTHING IS EXCLUDED. Every report here still counts as evidence exactly as it did
            before, and no threshold, lane, health state or promotion decision reads any of
            it. An exclusion was built and removed: the peer comparison is gameable, because
            adding clean volume to a provider's mailboxes drags the peer rate down until an
            HONEST observer clears the multiple — silencing the mailbox reporting real spam
            and leaving the sender it reported looking cleaner than it is. Evidence that makes
            a sender look worse than it is costs sending and is visible; evidence that makes
            one look better goes unnoticed, which is the direction that matters. See
            security.md invariant 59 for what must be true before this can act.
            A client must not render it as a sanction: a legitimately strict provider looks
            identical from here, which is why the whole sum ships rather than a badge.
            Ordered worst-lift first, then by mailbox id. An observer whose history spans two
            receiving providers is compared against each separately and may appear once per
            cohort — the same mailbox, two comparisons, not two mailboxes.
          items:
            type: object
            required: [observer_mailbox_id, cohort, spam, total, spam_rate, cohort_spam_rate, lift]
            properties:
              observer_mailbox_id: { type: string, format: uuid, description: "the mailbox whose reports were dropped — NOT a mailbox anything is wrong with as a sender" }
              cohort:
                type: string
                enum: [google, microsoft, other, unknown]
                description: >-
                  The OBSERVER's own receiving provider, which is the population its rate was
                  compared against. Providers junk at materially different rates, so a pooled
                  comparison would flag every Microsoft mailbox in a mostly-Google pool.
              spam:  { type: integer, description: "placements this observer called spam in the trailing 7 days" }
              total: { type: integer, description: "every placement this observer reported in the same window — the denominator of spam_rate, and the same population the snapshot counts" }
              spam_rate: { type: number, description: "spam/total, rounded to two decimals" }
              cohort_spam_rate:
                type: number
                description: >-
                  The same rate for the observer's cohort EXCLUDING this observer, rounded to
                  two decimals. Excluding it matters most where the cohort is small: a mailbox
                  that dominates its cohort would otherwise raise the very baseline it is
                  measured against and hide itself.
              lift:
                type: number
                description: >-
                  How many times the peer rate this observer reports, rounded to two decimals.
                  A cohort with no spam at all is scored with the same continuity correction
                  the incident fold uses (half a case), so this stays finite.
        incidents:
          type: array
          description: >-
            Degradation that is CONCENTRATED in one fault dimension — several mailboxes
            degrading through one destination route, signing domain, return path, or sender
            domain. Derived at read time from observations, never persisted. A correlation,
            not a cause. Empty when no dimension shows concentration. Reported for
            visibility only: no threshold, lane or promotion decision reads any of it.
          items:
            type: object
            required: [dimension, value, member_mailbox_ids, cohort_size, degraded_inside, cohort_outside, degraded_outside, lift]
            properties:
              dimension:          { type: string, enum: [destination_route, signing_domain, return_path_domain, sender_domain] }
              value:              { type: string, description: "the shared value, e.g. a signing domain or an ESP name" }
              member_mailbox_ids: { type: array, items: { type: string }, description: "the DEGRADED members of the cohort" }
              cohort_size:        { type: integer, description: "participants carrying this value, degraded or not" }
              degraded_inside:    { type: integer }
              cohort_outside:     { type: integer, description: "the rest of the pool" }
              degraded_outside:   { type: integer }
              lift:               { type: number, description: "how many times more degraded the cohort is than the rest of the pool" }
    WarmupDayStat:
      type: object
      required: [day, sent, received, inbox, spam, replies]
      properties:
        day: { type: string, format: date, description: UTC day }
        sent: { type: integer, description: warmup mail this mailbox sent }
        received: { type: integer, description: warmup mail this mailbox received }
        inbox: { type: integer, description: "of this mailbox's SENT mail, how many landed in partners' inboxes (sender placement)" }
        spam: { type: integer, description: "of this mailbox's SENT mail, how many landed in partners' spam (sender placement)" }
        replies: { type: integer }
    WarmupDetail:
      type: object
      description: One mailbox's participant state plus its daily series.
      required: [participant, series]
      properties:
        participant: { $ref: '#/components/schemas/WarmupParticipant' }
        series:
          type: array
          description: daily stats, oldest first, up to 30 days
          items: { $ref: '#/components/schemas/WarmupDayStat' }
        routes:
          type: array
          description: >-
            Placement split by WHERE THE MAIL WAS DELIVERED — the destination ESP, decided
            by the recipient domain's MX. Each route carries its OWN sample count and its
            rates are computed over that count, never the mailbox's pooled total. Empty
            when nothing has been observed. Reported for visibility only: no threshold,
            lane or promotion decision reads any of it.
            Warmup partners are the workspace's own connected mailboxes, so the only routes
            observable are the ESPs in that pool: a single-ESP workspace reports ONE route,
            and a client must render that as "one destination observed" rather than as a
            matrix that happens to have one clean row — it says nothing about delivery to
            any provider absent from the pool. `unknown` is not a fourth provider: it means
            the recipient domain's MX has not been resolved yet, and must never render
            beside google/microsoft/other as if it were a destination. `other` is its
            opposite — resolved, and neither Google nor Microsoft.
          items:
            type: object
            required: [destination_esp, placement_sample_7d, inbox_rate_7d, spam_rate_7d, tabbed_rate_7d, tab_capable_sample_7d]
            properties:
              destination_esp:
                type: string
                enum: [google, microsoft, other, unknown]
                description: >-
                  Where the mail was delivered, from the recipient's own provider or the
                  recipient domain's MX cache — never from the sender's relay. Recorded on
                  the observation at receipt time, so a later provider or MX change does
                  not rewrite which route historical mail was measured on. unknown = not
                  resolved yet (an absence of lookup); other = resolved, and neither Google
                  nor Microsoft (a finding). The two must not render alike.
              placement_sample_7d:
                type: integer
                format: int64
                description: >-
                  Inbox plus spam placement observations ON THIS ROUTE in the trailing 7
                  days — the denominator of this row's inbox and spam rates, and never the
                  mailbox's pooled placement_sample_7d.
              inbox_rate_7d:
                type: number
                nullable: true
                description: >-
                  Fraction of this route's placements that reached the inbox (0..1). Null
                  when this route is below the placement sample floor: not established, not
                  zero. Splitting a window by destination shrinks every count, so null is
                  common here rather than exceptional.
              spam_rate_7d:
                type: number
                nullable: true
                description: >-
                  Fraction of this route's placements that landed in spam (0..1). Null when
                  this route is below the placement sample floor — not established, and
                  never to be rendered as a clean 0%.
              tabbed_rate_7d:
                type: number
                nullable: true
                description: >-
                  Fraction of this route's tab-capable placements that landed in a tab
                  rather than the primary inbox (0..1), over tab_capable_sample_7d. Null
                  when nothing observing this route could report a category.
              tab_capable_sample_7d:
                type: integer
                format: int64
                description: >-
                  Inbox-side placements on this route whose reader could have seen a tab —
                  the denominator of this row's tabbed_rate_7d, and smaller than this row's
                  placement_sample_7d by construction.
    Pulse:
      type: object
      description: >-
        Workspace-wide aggregates in one payload. attention is severity-sorted
        worst-first (danger > warn > info); an all-clear workspace has an empty
        array. inbox is literal zeros until the inbox read-model ships.
      required: [mailboxes, warmup, campaigns, contacts, sending, inbox, attention]
      properties:
        mailboxes:
          type: object
          required: [total, active, paused, error]
          properties:
            total: { type: integer }
            active: { type: integer }
            paused: { type: integer }
            error: { type: integer }
        warmup:
          type: object
          description: >-
            Enabled warmup participants counted on both warmup axes.
            unknown/healthy/watch/at_risk bucket the SENDER REPUTATION axis
            (health_state; at_risk = throttled + paused); probation and
            quarantine count the POOL ELIGIBILITY axis (lane). The two axes are
            independent, so a participant appears in one bucket per axis and the
            counts across axes overlap — only the reputation buckets sum to pool.
          required: [pool, unknown, healthy, watch, at_risk, probation, quarantine]
          properties:
            pool: { type: integer }
            unknown: { type: integer, description: enabled participants without enough evidence for a health verdict }
            healthy: { type: integer }
            watch: { type: integer }
            at_risk: { type: integer }
            probation: { type: integer, description: "participants gathering evidence: lane in (probation, recovery) — sending at a floor volume in their own lane, not yet cleared for the healthy pool" }
            quarantine: { type: integer, description: "participants withheld from the pool: lane in (quarantine, blocked) — exchanging no warmup mail and blocked from taking new campaign leads. pending_auth is excluded; an unproven domain is already reported by the dmarc_failing attention row." }
        campaigns:
          type: object
          required: [total, running, draft, paused]
          properties:
            total: { type: integer }
            running: { type: integer }
            draft: { type: integer }
            paused: { type: integer }
        contacts:
          type: object
          required: [total]
          properties:
            total: { type: integer }
        sending:
          type: object
          required: [sent_today, daily_cap]
          properties:
            sent_today: { type: integer, description: cold sends completed this UTC day (same boundary the caps enforce) }
            daily_cap: { type: integer, description: "today's workspace capacity: each active mailbox's ramped cap scaled by its warmup health" }
        inbox:
          type: object
          required: [unread, interested]
          properties:
            unread: { type: integer, description: always 0 until the inbox ships }
            interested: { type: integer, description: always 0 until the inbox ships }
        attention:
          type: array
          items: { $ref: '#/components/schemas/PulseAttention' }
    PulseAttention:
      type: object
      description: >-
        One server-defined "needs attention" row. Clients render whatever
        appears here, so new producers require no client changes; unknown
        kinds must render generically.
      required: [kind, severity, count, reason, href]
      properties:
        kind:
          type: string
          description: "stable machine identifier; current producers: mailbox_error, senders_gated, dmarc_failing, cap_consumed"
        severity: { type: string, enum: [danger, warn, info] }
        count: { type: integer }
        reason: { type: string, description: human-readable explanation derived from real data }
        href: { type: string, description: console destination that shows/fixes the condition }
    AISettings:
      type: object
      description: >-
        Workspace AI settings. Model references are ids from GET /ai/models
        ("<provider_id>/<name>") or the sentinels "default-smart-model" /
        "default-fast-model", which resolve at run time against the
        workspace's enabled models.
      required: [default_smart_model, default_fast_model, enabled_model_ids, additional_instructions]
      properties:
        default_smart_model: { type: string, example: default-smart-model }
        default_fast_model: { type: string, example: default-fast-model }
        enabled_model_ids:
          type: array
          items: { type: string }
          description: empty array = every listed model is enabled
        additional_instructions: { type: string, description: workspace-specific instructions appended to the agent system prompt }
    AgentThread:
      type: object
      required: [id, title, total_input_tokens, total_output_tokens, context_window_tokens, active_run_id, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        total_input_tokens: { type: integer, format: int64 }
        total_output_tokens: { type: integer, format: int64 }
        context_window_tokens: { type: integer }
        active_run_id: { type: string, format: uuid, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        messages: { type: array, items: { $ref: '#/components/schemas/AgentMessage' } }
    AgentThreadList:
      type: object
      required: [threads]
      properties:
        threads: { type: array, items: { $ref: '#/components/schemas/AgentThread' } }
    AgentMessage:
      type: object
      required: [id, turn_id, role, status, created_at, parts]
      properties:
        id: { type: string, format: uuid }
        turn_id: { type: string, format: uuid }
        role: { type: string, enum: [user, assistant] }
        status: { type: string, enum: [sent, queued, processing] }
        created_at: { type: string, format: date-time }
        parts: { type: array, items: { $ref: '#/components/schemas/AgentPart' } }
    AgentPart:
      type: object
      required: [id, order_index, type]
      properties:
        id: { type: string, format: uuid }
        order_index: { type: integer }
        type: { type: string, enum: [text, reasoning, tool_call, tool_result, compaction_notice] }
        text: { type: string }
        reasoning: { type: string }
        tool_name: { type: string }
        tool_call_id: { type: string }
        tool_input: { type: object, additionalProperties: true }
        tool_output: {}
        state: { type: string, enum: ['', running, done, error, awaiting_approval] }
        error: { type: string }
    AgentBrowsingContext:
      type: object
      required: [type]
      properties:
        type: { type: string, enum: [record_page, list_view] }
        object: { type: string }
        record_id: { type: string }
        url: { type: string }
        view: { type: string }
        filters: { type: object, additionalProperties: { type: string } }
    AgentSendRequest:
      type: object
      required: [text]
      properties:
        text: { type: string, minLength: 1, maxLength: 20000 }
        model: { type: string, description: composite model id or default-smart-model }
        browsing_context: { $ref: '#/components/schemas/AgentBrowsingContext' }
    AgentSendResult:
      type: object
      required: [message_id, run_id, queued]
      properties:
        message_id: { type: string, format: uuid }
        run_id: { type: string, format: uuid, nullable: true }
        queued: { type: boolean }
    AgentQueuedMessage:
      type: object
      required: [id, text, model, created_at]
      properties:
        id: { type: string, format: uuid }
        text: { type: string }
        model: { type: string }
        created_at: { type: string, format: date-time }
    AgentQueue:
      type: object
      required: [queued]
      properties:
        queued: { type: array, items: { $ref: '#/components/schemas/AgentQueuedMessage' } }
    AgentApprovalStatus:
      type: string
      enum: [pending, approved, rejected, expired, executed, failed]
    AgentApproval:
      type: object
      required: [id, workspace_id, thread_id, run_id, tool_name, tool_call_id, arguments, risk_tier, status, expires_at, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        workspace_id: { type: string, format: uuid }
        thread_id: { type: string, format: uuid }
        run_id: { type: string, format: uuid }
        tool_name: { type: string }
        tool_call_id: { type: string }
        arguments: { type: object, additionalProperties: true }
        edited_arguments: { type: object, additionalProperties: true }
        risk_tier: { type: string, enum: [read, write, consequential, irreversible] }
        status: { $ref: '#/components/schemas/AgentApprovalStatus' }
        decision_reason: { type: string }
        expires_at: { type: string, format: date-time }
        result: {}
        error: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    AgentApprovalList:
      type: object
      required: [actions]
      properties:
        actions: { type: array, items: { $ref: '#/components/schemas/AgentApproval' } }
    AgentApprovalDecisionRequest:
      type: object
      required: [decision]
      properties:
        decision: { type: string, enum: [approve, reject] }
        edited_arguments: { type: object, additionalProperties: true }
        reason: { type: string, minLength: 1, maxLength: 1000 }
    AISettingsUpdate:
      type: object
      description: >-
        Partial update — omitted fields keep their current (or default) value.
        default_smart_model / default_fast_model accept a model id or the
        field's own sentinel; enabled_model_ids entries must be ids from
        GET /ai/models.
      properties:
        default_smart_model: { type: string }
        default_fast_model: { type: string }
        enabled_model_ids: { type: array, items: { type: string } }
        additional_instructions: { type: string }
    AIProviderKind:
      type: string
      enum: [anthropic, bedrock, vertex_anthropic, openai, azure_openai, openai_compatible, google, vertex_google]
      description: >-
        One kind per DOOR to a vendor — the same model may be reachable
        natively, via Bedrock, and via Vertex as three separate providers.
    AIProviderConfig:
      type: object
      description: >-
        Non-secret connection settings; the valid keys depend on kind —
        openai_compatible: base_url (required); azure_openai: endpoint +
        api_version (required); bedrock: region (required); vertex_anthropic /
        vertex_google: project_id + region (required); anthropic / openai /
        google: none.
      properties:
        base_url: { type: string }
        endpoint: { type: string }
        api_version: { type: string }
        region: { type: string }
        project_id: { type: string }
    AIProviderCredentials:
      type: object
      description: >-
        Kind-variant secret object, sealed whole at rest and never returned.
        anthropic / openai / google / azure_openai: api_key (required);
        openai_compatible: api_key (optional — a local Ollama has none);
        bedrock: access_key_id + secret_access_key; vertex_anthropic /
        vertex_google: service_account_json (a service-account key file's
        JSON content).
      properties:
        api_key: { type: string }
        access_key_id: { type: string }
        secret_access_key: { type: string }
        service_account_json: { type: string }
    AIProvider:
      type: object
      description: >-
        A configured provider door, masked: credentials are sealed at rest and
        never returned — key_prefix carries the first 8 characters of the api
        key / access key id, or the service account's client_email. No
        secret/ciphertext field exists on this shape by construction.
      required: [id, kind, display_name, config, configured, key_prefix, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: '#/components/schemas/AIProviderKind' }
        display_name: { type: string }
        config: { $ref: '#/components/schemas/AIProviderConfig' }
        configured: { type: boolean, description: always true for a stored row }
        key_prefix: { type: string, description: masked credential identifier for display }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    AIProviderList:
      type: object
      required: [providers]
      properties:
        providers:
          type: array
          items: { $ref: '#/components/schemas/AIProvider' }
    AIProviderCreateRequest:
      type: object
      required: [kind, credentials]
      properties:
        kind: { $ref: '#/components/schemas/AIProviderKind' }
        display_name: { type: string }
        credentials: { $ref: '#/components/schemas/AIProviderCredentials' }
        config: { $ref: '#/components/schemas/AIProviderConfig' }
    AIProviderUpdateRequest:
      type: object
      description: >-
        Partial update. credentials absent = keep the sealed credential;
        config absent = keep current config (when present it REPLACES the
        config object whole); display_name absent = keep. kind is immutable.
      properties:
        display_name: { type: string }
        credentials: { $ref: '#/components/schemas/AIProviderCredentials' }
        config: { $ref: '#/components/schemas/AIProviderConfig' }
    AIModel:
      type: object
      description: >-
        One entry of the merged model list. id is the stable composite
        "<provider_id>/<name>" — the same model name via two doors never
        collides, and settings store exactly these ids. source=catalog entries
        come from models.dev (native kinds); source=custom entries are
        workspace_ai_models rows.
      required: [id, provider_id, kind, name, label, context_window_tokens, max_output_tokens, supports_reasoning, source, custom_model_id, input_cost_per_mtok, output_cost_per_mtok, enabled]
      properties:
        id: { type: string, description: composite "<provider_id>/<name>" }
        provider_id: { type: string, format: uuid }
        kind: { $ref: '#/components/schemas/AIProviderKind' }
        name: { type: string, description: the bare model id the provider SDK receives }
        label: { type: string }
        context_window_tokens: { type: integer }
        max_output_tokens: { type: integer }
        supports_reasoning: { type: boolean }
        source: { type: string, enum: [catalog, custom] }
        custom_model_id:
          type: string
          format: uuid
          nullable: true
          description: the deletable row id behind a source=custom entry (DELETE /ai/models/{id}); null for catalog entries
        input_cost_per_mtok: { type: number, nullable: true, description: informational USD per million input tokens }
        output_cost_per_mtok: { type: number, nullable: true }
        enabled: { type: boolean, description: "enabled_model_ids is empty OR contains this id" }
    AIModelList:
      type: object
      required: [models]
      properties:
        models:
          type: array
          items: { $ref: '#/components/schemas/AIModel' }
    AIModelCreateRequest:
      type: object
      required: [provider_id, name, label, context_window_tokens, max_output_tokens]
      properties:
        provider_id: { type: string, format: uuid }
        name: { type: string }
        label: { type: string }
        context_window_tokens: { type: integer, minimum: 1 }
        max_output_tokens: { type: integer, minimum: 1 }
        supports_reasoning: { type: boolean }
        input_cost_per_mtok: { type: number, nullable: true }
        output_cost_per_mtok: { type: number, nullable: true }
    AIDiscoveredModel:
      type: object
      description: >-
        One discovery candidate. Only name is guaranteed; the rest is
        best-effort (bare-id endpoints yield name-only entries).
      required: [name]
      properties:
        name: { type: string }
        label: { type: string }
        context_window_tokens: { type: integer }
        max_output_tokens: { type: integer }
        input_cost_per_mtok: { type: number, nullable: true }
        output_cost_per_mtok: { type: number, nullable: true }
    AIDiscoveryResult:
      type: object
      required: [supported, models]
      properties:
        supported: { type: boolean, description: false = this kind has no discovery path yet; add models manually }
        models:
          type: array
          items: { $ref: '#/components/schemas/AIDiscoveredModel' }
    OAuth2RegisterRequest:
      type: object
      required: [client_name, redirect_uris]
      description: RFC 7591 dynamic client registration request.
      properties:
        client_name: { type: string }
        redirect_uris:
          type: array
          minItems: 1
          items: { type: string }
          description: https (or http loopback) URIs, no fragment; exact-matched at /authorize
        grant_types:
          type: array
          items: { type: string, enum: [authorization_code, refresh_token] }
          description: defaults to [authorization_code]
        response_types:
          type: array
          items: { type: string, enum: [code] }
          description: defaults to [code]
        scope: { type: string, description: space-delimited; each scope must be OAuth-grantable }
        token_endpoint_auth_method:
          type: string
          enum: [none, client_secret_basic, client_secret_post]
          description: omitted or "none" => public PKCE client (no secret); client_secret_* => confidential
    OAuth2Client:
      type: object
      required: [client_id, client_name, redirect_uris, grant_types, response_types, scope, client_type, token_endpoint_auth_method, created_at]
      properties:
        client_id: { type: string }
        client_secret:
          type: string
          description: Present ONLY on a confidential client's registration response, shown exactly once. Never on a list.
        client_name: { type: string }
        redirect_uris: { type: array, items: { type: string } }
        grant_types: { type: array, items: { type: string } }
        response_types: { type: array, items: { type: string } }
        scope: { type: string, description: space-delimited registered scopes }
        client_type: { type: string, enum: [public, confidential] }
        token_endpoint_auth_method: { type: string }
        created_at: { type: string, format: date-time }
        revoked_at: { type: string, format: date-time, nullable: true }
    OAuth2ClientList:
      type: object
      required: [clients]
      properties:
        clients:
          type: array
          items: { $ref: '#/components/schemas/OAuth2Client' }
    OAuth2ConsentData:
      type: object
      required: [client_name, requested_scopes, redirect_uri]
      description: Display data the SPA renders on the consent screen.
      properties:
        client_name: { type: string }
        requested_scopes: { type: array, items: { type: string } }
        redirect_uri: { type: string }
    OAuth2ConsentDecision:
      type: object
      required: [consent_id, decision]
      properties:
        consent_id: { type: string }
        decision: { type: string, enum: [approve, deny] }
    OAuth2RedirectTo:
      type: object
      required: [redirect_to]
      properties:
        redirect_to: { type: string, description: URL the SPA navigates the browser to }
    OAuth2TokenRequest:
      type: object
      required: [grant_type]
      description: >-
        Form body for the token endpoint. Fields used depend on grant_type. A confidential
        client may instead present its secret via HTTP Basic (client_secret_basic).
      properties:
        grant_type: { type: string, enum: [authorization_code, refresh_token] }
        code: { type: string, description: authorization_code grant only }
        redirect_uri: { type: string, description: authorization_code grant only; must exactly match the code's redirect_uri }
        code_verifier: { type: string, description: authorization_code grant only; the PKCE verifier (S256) }
        refresh_token: { type: string, description: refresh_token grant only }
        scope: { type: string, description: refresh_token grant only; a space-delimited SUBSET of the token's scopes (narrowing) }
        client_id: { type: string }
        client_secret: { type: string, description: "confidential client, client_secret_post (or use HTTP Basic)" }
    OAuth2TokenResponse:
      type: object
      required: [access_token, token_type, expires_in, refresh_token, scope]
      properties:
        access_token: { type: string, description: opaque bearer token (inoa_ prefix) }
        token_type: { type: string, enum: [Bearer] }
        expires_in: { type: integer, description: access-token lifetime in seconds }
        refresh_token: { type: string, description: rotating single-use refresh token (inor_ prefix) }
        scope: { type: string, description: space-delimited granted scopes }
    OAuth2TokenError:
      type: object
      required: [error]
      description: RFC 6749 §5.2 error response.
      properties:
        error: { type: string, enum: [invalid_request, invalid_client, invalid_grant, unsupported_grant_type, invalid_scope, server_error] }
        error_description: { type: string }
    OAuth2IntrospectRequest:
      type: object
      required: [token]
      properties:
        token: { type: string }
        token_type_hint: { type: string, enum: [access_token, refresh_token] }
        client_id: { type: string }
        client_secret: { type: string }
    OAuth2IntrospectResponse:
      type: object
      required: [active]
      description: >-
        RFC 7662 response. For an inactive/unknown token ONLY `active` (false) is present.
      properties:
        active: { type: boolean }
        scope: { type: string }
        client_id: { type: string }
        sub: { type: string, description: the resource owner (user) id }
        exp: { type: integer, description: expiry as a Unix timestamp }
        token_type: { type: string }
    OAuth2RevokeRequest:
      type: object
      required: [token]
      properties:
        token: { type: string }
        token_type_hint: { type: string, enum: [access_token, refresh_token] }
        client_id: { type: string }
        client_secret: { type: string }
    CRMCompanyInput:
      type: object
      required: [name, domain, currency]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        domain: { type: string }
        owner_user_id: { type: string, format: uuid, nullable: true }
        annual_revenue_micros: { type: integer, format: int64, minimum: 0, nullable: true }
        currency: { type: string, minLength: 3, maxLength: 3 }
    CRMCompany:
      allOf:
        - $ref: '#/components/schemas/CRMCompanyInput'
        - type: object
          required: [id, deal_count, created_at, updated_at]
          properties:
            id: { type: string, format: uuid }
            deal_count: { type: integer, format: int64 }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }
    CRMCompanyList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/CRMCompany' } }
        next_cursor:
          type: string
          description: Cursor for the next page. Absent on the last page.
    CRMCompanyContact:
      type: object
      required: [id, email, first_name, last_name, job_title, linkedin_url, created_at]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        first_name: { type: string }
        last_name: { type: string }
        job_title: { type: string }
        linkedin_url: { type: string }
        created_at: { type: string, format: date-time }
    CRMCompanyContactList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/CRMCompanyContact' } }
        next_cursor:
          type: string
          description: Cursor for the next page. Absent on the last page.
    CRMStageInput:
      type: object
      required: [label, color, position, is_won, is_lost]
      properties:
        label: { type: string, minLength: 1, maxLength: 80 }
        color: { type: string, pattern: '^#[0-9A-Fa-f]{6}$' }
        position: { type: integer, minimum: 0 }
        is_won: { type: boolean }
        is_lost: { type: boolean }
    CRMStage:
      allOf:
        - $ref: '#/components/schemas/CRMStageInput'
        - type: object
          required: [id, pipeline_id, key, created_at, updated_at]
          properties:
            id: { type: string, format: uuid }
            pipeline_id: { type: string, format: uuid }
            key: { type: string }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }
    ReplyLabelInput:
      type: object
      description: >-
        The editable surface of a reply label. `key` is deliberately absent: it
        is derived from `label` on create and immutable thereafter.

        The role flags are the automation contract the inbox poller reads.
        Two combinations are refused: an automated label that also stops the
        enrollment (automated mail is not a human reply), and a deferring label
        that is not automated.
      required: [label, color, stops_enrollment, is_automated, suppresses_contact, captures_deal, defers_enrollment]
      properties:
        label: { type: string, minLength: 1, maxLength: 80 }
        color: { type: string, pattern: '^#[0-9A-Fa-f]{6}$' }
        stops_enrollment: { type: boolean, description: halt the sequence on this reply }
        is_automated: { type: boolean, description: machine-generated mail (out-of-office / auto-reply); never a human reply }
        suppresses_contact: { type: boolean, description: 'suppress the address, then stop (compliance)' }
        captures_deal: { type: boolean, description: open or update a CRM deal from this reply }
        defers_enrollment:
          type: boolean
          description: >-
            Reschedule the next step past a return date stated in the body
            instead of stopping. When no date can be parsed the reply is only
            tagged - the sequence is never deferred on a guess. Deferrals are
            capped at 30 days.
    ReplyLabel:
      allOf:
        - $ref: '#/components/schemas/ReplyLabelInput'
        - type: object
          required: [id, key, position, is_builtin, created_at, updated_at]
          properties:
            id: { type: string, format: uuid }
            key:
              type: string
              description: stable machine key; the value stored on CampaignEnrollment.reply_class
            position: { type: integer, minimum: 0 }
            is_builtin:
              type: boolean
              description: >-
                Seeded with the workspace. May be renamed and have its flags
                changed, but never deleted - the classifier and historical
                enrollments both name its key.
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }
    ReplyLabelList:
      type: object
      required: [labels]
      properties:
        labels: { type: array, items: { $ref: '#/components/schemas/ReplyLabel' } }
    ReplyLabelReorderInput:
      type: object
      required: [ids]
      properties:
        ids:
          type: array
          items: { type: string, format: uuid }
          description: every label in the workspace, exactly once, in the new order
    CRMPipelineInput:
      type: object
      required: [name]
      properties: { name: { type: string, minLength: 1, maxLength: 120 } }
    CRMPipeline:
      type: object
      required: [id, name, is_default, stages, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        is_default: { type: boolean }
        stages: { type: array, items: { $ref: '#/components/schemas/CRMStage' } }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CRMPipelineList:
      type: object
      required: [items]
      properties: { items: { type: array, items: { $ref: '#/components/schemas/CRMPipeline' } } }
    CRMDealInput:
      type: object
      required: [pipeline_id, stage_id, name, currency]
      properties:
        pipeline_id: { type: string, format: uuid }
        stage_id: { type: string, format: uuid }
        company_id: { type: string, format: uuid, nullable: true }
        primary_contact_id: { type: string, format: uuid, nullable: true }
        owner_user_id: { type: string, format: uuid, nullable: true }
        name: { type: string, minLength: 1, maxLength: 200 }
        amount_micros: { type: integer, format: int64, minimum: 0, nullable: true }
        currency: { type: string, minLength: 3, maxLength: 3 }
        close_date: { type: string, format: date-time, nullable: true }
    CRMDeal:
      allOf:
        - $ref: '#/components/schemas/CRMDealInput'
        - type: object
          required: [id, position, source, created_by_actor, pipeline_name, stage_label, stage_color, stage_is_won, stage_is_lost, created_at, updated_at]
          properties:
            id: { type: string, format: uuid }
            position:
              type: number
              description: >-
                Fractional board ordering within the stage. Server-computed;
                change it with the move operation, never by writing it.
            source: { type: string }
            source_campaign_id: { type: string, format: uuid, nullable: true }
            source_thread_ref: { type: string }
            created_by_actor: { type: object, additionalProperties: true }
            pipeline_name: { type: string }
            stage_label: { type: string }
            stage_color: { type: string }
            stage_is_won: { type: boolean }
            stage_is_lost: { type: boolean }
            company_name: { type: string }
            contact_email: { type: string }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }
    CRMDealList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/CRMDeal' } }
        next_cursor:
          type: string
          description: Cursor for the next page. Absent on the last page.
    CRMMoveDealInput:
      type: object
      required: [stage_id]
      properties:
        stage_id: { type: string, format: uuid }
        before_deal_id: { type: string, format: uuid, nullable: true }
        after_deal_id: { type: string, format: uuid, nullable: true }
    CRMBoardStage:
      type: object
      required: [stage, deals, deal_count, amount_micros]
      properties:
        stage: { $ref: '#/components/schemas/CRMStage' }
        deals: { type: array, items: { $ref: '#/components/schemas/CRMDeal' } }
        deal_count: { type: integer, format: int64 }
        amount_micros: { type: integer, format: int64 }
    CRMBoard:
      type: object
      required: [pipeline, stages]
      properties:
        pipeline: { $ref: '#/components/schemas/CRMPipeline' }
        stages: { type: array, items: { $ref: '#/components/schemas/CRMBoardStage' } }
    CRMSettingsInput:
      type: object
      required: [auto_capture_policy]
      properties:
        auto_capture_policy: { type: string, enum: [sent_and_received, sent, off] }
    CRMSettings:
      allOf:
        - $ref: '#/components/schemas/CRMSettingsInput'
        - type: object
          required: [updated_at]
          properties: { updated_at: { type: string, format: date-time } }
    CRMThreadParticipant:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }
        display_name: { type: string }
        contact_id: { type: string, format: uuid, nullable: true }
    CRMThreadMessage:
      type: object
      required: [id, direction, kind, occurred_at]
      properties:
        id: { type: string, format: uuid }
        direction: { type: string, enum: [inbound, outbound] }
        kind: { type: string, enum: [sent, reply] }
        message_id: { type: string }
        sender_email: { type: string }
        recipient_email: { type: string }
        subject: { type: string }
        reply_class: { type: string }
        occurred_at: { type: string, format: date-time }
    CRMThread:
      type: object
      required: [id, thread_ref, last_message_at, participants, messages]
      properties:
        id: { type: string, format: uuid }
        thread_ref: { type: string }
        subject: { type: string }
        reply_class: { type: string }
        campaign_id: { type: string, format: uuid, nullable: true }
        contact_id: { type: string, format: uuid, nullable: true }
        last_message_at: { type: string, format: date-time }
        participants: { type: array, items: { $ref: '#/components/schemas/CRMThreadParticipant' } }
        messages: { type: array, items: { $ref: '#/components/schemas/CRMThreadMessage' } }
    CRMThreadList:
      type: object
      required: [items]
      properties: { items: { type: array, items: { $ref: '#/components/schemas/CRMThread' } } }
    CRMEvent:
      type: object
      required: [id, name, kind, actor, data, occurred_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        kind: { type: string }
        object_type: { type: string }
        object_id: { type: string, format: uuid, nullable: true }
        contact_id: { type: string, format: uuid, nullable: true }
        company_id: { type: string, format: uuid, nullable: true }
        deal_id: { type: string, format: uuid, nullable: true }
        actor: { type: object, additionalProperties: true }
        data: { type: object, additionalProperties: true }
        linked_record_cached_name: { type: string }
        source_message_id: { type: string }
        source_thread_ref: { type: string }
        occurred_at: { type: string, format: date-time }
        merged_count: { type: integer, minimum: 1 }
    CRMEventList:
      type: object
      required: [items]
      properties: { items: { type: array, items: { $ref: '#/components/schemas/CRMEvent' } } }
    CRMTargetFields:
      type: object
      required: [target_type, target_id]
      properties:
        target_type: { type: string, enum: [contact, company, deal] }
        target_id: { type: string, format: uuid }
    CRMNoteUpdate:
      type: object
      required: [title, body]
      properties:
        title: { type: string, maxLength: 200 }
        body: { type: string, minLength: 1, maxLength: 20000 }
    CRMNoteInput:
      allOf:
        - $ref: '#/components/schemas/CRMNoteUpdate'
        - $ref: '#/components/schemas/CRMTargetFields'
    CRMNote:
      type: object
      required: [id, title, body, created_by_actor, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        body: { type: string }
        created_by_actor: { type: object, additionalProperties: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CRMNoteList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/CRMNote' } }
        next_cursor:
          type: string
          description: Cursor for the next page. Absent on the last page.
    CRMTaskInput:
      allOf:
        - $ref: '#/components/schemas/CRMTargetFields'
        - type: object
          required: [title, body, status]
          properties:
            title: { type: string, minLength: 1, maxLength: 200 }
            body: { type: string, maxLength: 20000 }
            due_at: { type: string, format: date-time, nullable: true }
            status: { type: string, enum: [open, in_progress, done, cancelled] }
            assignee_user_id: { type: string, format: uuid, nullable: true }
    CRMTask:
      type: object
      required: [id, title, body, status, created_by_actor, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        body: { type: string }
        due_at: { type: string, format: date-time, nullable: true }
        status: { type: string, enum: [open, in_progress, done, cancelled] }
        assignee_user_id: { type: string, format: uuid, nullable: true }
        created_by_actor: { type: object, additionalProperties: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CRMTaskList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/CRMTask' } }
        next_cursor:
          type: string
          description: Cursor for the next page. Absent on the last page.
    CRMContactEmailInput:
      type: object
      required: [email]
      properties: { email: { type: string, format: email } }
    CRMContactEmail:
      type: object
      required: [id, contact_id, email, is_primary, created_at]
      properties:
        id: { type: string, format: uuid }
        contact_id: { type: string, format: uuid }
        email: { type: string, format: email }
        is_primary: { type: boolean }
        created_at: { type: string, format: date-time }
    CRMContactEmailList:
      type: object
      required: [items]
      properties: { items: { type: array, items: { $ref: '#/components/schemas/CRMContactEmail' } } }
    InboxThreadSummary:
      type: object
      required:
        [
          id,
          mailbox_id,
          campaign_id,
          contact_id,
          contact_email,
          contact_first_name,
          contact_last_name,
          subject,
          last_reply_class,
          reply_label,
          unread,
          last_message_at,
        ]
      properties:
        id: { type: string, format: uuid }
        mailbox_id: { type: string, format: uuid }
        campaign_id: { type: string, format: uuid, nullable: true }
        contact_id: { type: string, format: uuid, nullable: true }
        contact_email: { type: string, description: "The linked contact's email, or \"\" when contact_id is null (e.g. a legacy direct-send match)." }
        contact_first_name: { type: string, description: "The linked contact's first name, or \"\" when contact_id is null." }
        contact_last_name: { type: string, description: "The linked contact's last name, or \"\" when contact_id is null." }
        subject: { type: string }
        last_reply_class: { type: string }
        reply_label:
          type: object
          allOf: [{ $ref: '#/components/schemas/InboxReplyLabelRef' }]
          nullable: true
          description: >-
            The workspace reply label resolved from last_reply_class for
            display, or null when the key no longer matches a label (readers
            degrade to the raw last_reply_class key).
        unread: { type: boolean }
        last_message_at: { type: string, format: date-time }
    InboxReplyLabelRef:
      type: object
      required: [key, label, color]
      properties:
        key: { type: string }
        label: { type: string }
        color: { type: string, description: "Hex color, #RRGGBB" }
    SendInboxReplyRequest:
      type: object
      required: [body_text]
      properties:
        body_text: { type: string, minLength: 1, maxLength: 100000 }
    InboxDraftReply:
      type: object
      required: [body_text]
      properties:
        body_text:
          type: string
          description: >-
            Suggested reply body, plain text, never empty and never HTML. The
            field name matches SendInboxReplyRequest.body_text so the client can
            hand the edited text straight back to the reply endpoint.
    InboxThreadPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/InboxThreadSummary' } }
    InboxMessage:
      type: object
      required: [direction, message_id, from_email, from_name, to_email, subject, body_text, body_html, reply_class, occurred_at]
      properties:
        direction: { type: string, enum: [inbound, outbound] }
        message_id: { type: string }
        from_email: { type: string }
        from_name: { type: string }
        to_email: { type: string }
        subject: { type: string }
        body_text: { type: string }
        body_html: { type: string }
        reply_class: { type: string }
        occurred_at: { type: string, format: date-time }
    InboxThreadDetail:
      allOf:
        - $ref: '#/components/schemas/InboxThreadSummary'
        - type: object
          required: [messages]
          properties:
            messages: { type: array, items: { $ref: '#/components/schemas/InboxMessage' } }
    SetInboxThreadReadRequest:
      type: object
      required: [unread]
      properties:
        unread: { type: boolean }
