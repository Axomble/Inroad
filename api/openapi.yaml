        - { $ref: '#/components/parameters/PageCursor' }
      responses:
        '200': { description: A page of the company's contacts, content: { application/json: { schema: { $ref: '#/components/schemas/CRMCompanyContactList' } } } }
        '404': { description: Company not found }
        '422': { description: Malformed cursor or non-positive limit }
  /crm/companies/{id}/deals:
    parameters: [{ $ref: '#/components/parameters/ID' }]
    get:
      operationId: crmListCompanyDeals
      tags: [crm]
      description: >-
