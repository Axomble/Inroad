openapi: 3.0.3
info:
  title: Inroad API
  version: 0.1.0
servers:
  - url: /api/v1
paths:
  /auth/register:
    post:
      operationId: authRegister
      tags: [auth]
      security: []
      parameters:
        - $ref: '#/components/parameters/CaptchaToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '200':
          description: Session
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionResponse' }
        '400': { description: Validation error }
        '403': { description: Captcha verification failed }
        '409': { description: Workspace or email already exists }
  /auth/login:
    post:
      operationId: authLogin
      tags: [auth]
      security: []
      parameters:
        - $ref: '#/components/parameters/CaptchaToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: >-
            A session (SessionResponse) for a user without a confirmed second
            factor, OR a single-use 2FA challenge (TwoFactorRequiredResponse,
            no tokens) for a user with 2FA enabled — the caller must then POST
            /auth/2fa/verify to obtain a session.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/SessionResponse'
                  - $ref: '#/components/schemas/TwoFactorRequiredResponse'
        '401': { description: Invalid credentials }
        '403': { description: Captcha verification failed }
        '429': { description: Too many attempts (rate limited); see Retry-After }
  /auth/refresh:
    post:
      operationId: authRefresh
      tags: [auth]
      security: []
      responses:
        '200':
          description: Refreshed session
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionResponse' }
        '401': { description: Invalid or expired refresh token }
  /auth/logout:
    post:
      operationId: authLogout
      tags: [auth]
      security: []
      responses:
        '200':
          description: Logged out
          content:
            application/json:
              schema: { type: object, properties: { status: { type: string } } }
  /auth/me:
    get:
      operationId: authMe
      tags: [auth]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Current identity
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeResponse' }
        '401': { description: Unauthorized }
  /auth/logout-all:
    post:
      operationId: authLogoutAll
      tags: [auth]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Logged out of all sessions
          content:
            application/json:
              schema: { type: object, properties: { status: { type: string } } }
        '401': { description: Unauthorized }
  /auth/switch-workspace:
    post:
      operationId: authSwitchWorkspace
      tags: [auth]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SwitchWorkspaceRequest' }
      responses:
        '200':
          description: Switched active workspace
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SwitchWorkspaceResponse' }
        '401': { description: Unauthorized }
        '403': { description: Not a member of the target workspace }
  /auth/sessions:
    get:
      operationId: authListSessions
      tags: [auth]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: The caller's active sessions (current one flagged)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionListResponse' }
        '401': { description: Unauthorized }
  /auth/sessions/revoke-others:
    post:
      operationId: authRevokeOtherSessions
      tags: [auth]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Revoked every session except the current one
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RevokeOthersResponse' }
        '401': { description: Unauthorized }
  /auth/sessions/{id}:
    delete:
      operationId: authRevokeSession
      tags: [auth]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '204': { description: Session revoked }
        '400': { description: Invalid session id }
        '401': { description: Unauthorized }
        '404': { description: No such session belonging to the caller }
  /auth/verify-email:
    post:
      operationId: authVerifyEmail
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VerifyEmailRequest' }
      responses:
        '204': { description: Email verified }
        '400': { description: Invalid or expired token }
  /auth/verify-email/resend:
    post:
      operationId: authResendVerification
      tags: [auth]
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Verification email re-sent }
        '401': { description: Unauthorized }
        '429': { description: Too many requests, try again shortly }
  /auth/password/forgot:
    post:
      operationId: authForgotPassword
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ForgotPasswordRequest' }
      responses:
        '204': { description: Reset email sent if the address matches an account (response is the same either way) }
        '400': { description: Validation error }
        '429': { description: Too many requests (rate limited); see Retry-After }
  /auth/password/reset:
    post:
      operationId: authResetPassword
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResetPasswordRequest' }
      responses:
        '204': { description: Password reset, all sessions revoked }
        '400': { description: Validation error, or invalid/expired token }
  /auth/invites/accept:
    post:
      operationId: authAcceptInvite
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AcceptInviteRequest' }
      responses:
        '200':
          description: Session
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionResponse' }
        '400': { description: Validation error }
        '404': { description: Invalid or expired invite }
        '422': { description: Password required to create an account }
  /auth/2fa:
    get:
      operationId: authTwoFactorStatus
      tags: [auth]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 2FA status for the caller
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TwoFactorStatusResponse' }
        '401': { description: Unauthorized }
  /auth/2fa/totp:
    post:
      operationId: authTwoFactorEnroll
      tags: [auth]
      security: [{ bearerAuth: [] }]
      description: >-
        Begin TOTP enrollment. Returns the base32 secret and an otpauth:// URI
        (render as a QR code). The secret is stored sealed but UNCONFIRMED and is
        never returned again — confirm with a code at /auth/2fa/totp/confirm.
      responses:
        '200':
          description: Pending enrollment secret
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TwoFactorEnrollResponse' }
        '401': { description: Unauthorized }
        '409': { description: Two-factor is already enabled }
    delete:
      operationId: authTwoFactorDisable
      tags: [auth]
      security: [{ bearerAuth: [] }]
      description: >-
        Disable 2FA. Requires a fresh TOTP code OR a recovery code as proof of
        possession. Also revokes the caller's OTHER sessions (a second-factor
        removal is a security downgrade).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TwoFactorCodeRequest' }
      responses:
        '204': { description: Two-factor disabled, other sessions revoked }
        '400': { description: Validation error, or two-factor is not enabled }
        '401': { description: Unauthorized, or invalid code }
  /auth/2fa/totp/confirm:
    post:
      operationId: authTwoFactorConfirm
      tags: [auth]
      security: [{ bearerAuth: [] }]
      description: >-
        Activate a pending TOTP enrollment by proving possession with a code.
        Returns the one-time recovery codes exactly once.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TwoFactorCodeRequest' }
      responses:
        '200':
          description: Two-factor enabled; recovery codes returned once
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TwoFactorConfirmResponse' }
        '400': { description: Enrollment not started, or invalid code }
        '401': { description: Unauthorized }
        '409': { description: Two-factor is already enabled }
  /auth/2fa/verify:
    post:
      operationId: authTwoFactorVerify
      tags: [auth]
      security: []
      description: >-
        Complete the login gate: exchange a 2FA challenge (from /auth/login) plus
        a TOTP or recovery code for a session. The challenge is single-use,
        TTL'd, and try-capped; any failure is a flat 401.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TwoFactorVerifyRequest' }
      responses:
        '200':
          description: Session
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionResponse' }
        '400': { description: Validation error }
        '401': { description: Invalid or expired challenge / code }
        '429': { description: Too many attempts (rate limited); see Retry-After }
  /auth/passkeys:
    get:
      operationId: authPasskeyList
      tags: [auth]
      security: [{ bearerAuth: [] }]
      description: List the caller's registered passkeys. No key material is returned.
      responses:
        '200':
          description: The caller's passkeys
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PasskeyListResponse' }
        '401': { description: Unauthorized }
  /auth/passkeys/{id}:
    delete:
      operationId: authPasskeyDelete
      tags: [auth]
      security: [{ bearerAuth: [] }]
      description: >-
        Delete one of the caller's passkeys (own-only). A foreign or unknown id
        returns 404 so a caller cannot probe another user's credentials.
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '204': { description: Passkey deleted }
        '400': { description: Invalid id }
        '401': { description: Unauthorized }
        '404': { description: Passkey not found }
  /auth/passkeys/register/begin:
    post:
      operationId: authPasskeyRegisterBegin
      tags: [auth]
      security: [{ bearerAuth: [] }]
      description: >-
        Begin adding a passkey to the caller's account. Returns an opaque
        session_id that binds the ceremony server-side plus the WebAuthn credential
        creation options for navigator.credentials.create. Requires a resident key
        and user verification.
      responses:
        '200':
          description: Registration options + ceremony session id
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PasskeyBeginResponse' }
        '401': { description: Unauthorized }
        '501': { description: Passkeys are not configured }
  /auth/passkeys/register/finish:
    post:
      operationId: authPasskeyRegisterFinish
      tags: [auth]
      security: [{ bearerAuth: [] }]
      description: >-
        Complete registration: submit the attestation from
        navigator.credentials.create along with the ceremony session_id. The
        server-stored challenge is consumed (single-use), the attestation verified,
        and the credential stored.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasskeyFinishRequest' }
      responses:
        '204': { description: Passkey registered }
        '400': { description: Validation error, invalid/expired challenge, or attestation failed }
        '401': { description: Unauthorized }
        '409': { description: This authenticator is already registered }
        '501': { description: Passkeys are not configured }
  /auth/passkeys/login/begin:
    post:
      operationId: authPasskeyLoginBegin
      tags: [auth]
      security: []
      description: >-
        Begin a discoverable (usernameless) passkey login. Public — no session
        exists yet. Returns an opaque session_id plus the WebAuthn credential
        request options for navigator.credentials.get; the allowed-credentials list
        is empty so the authenticator offers its resident keys.
      responses:
        '200':
          description: Assertion options + ceremony session id
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PasskeyBeginResponse' }
        '501': { description: Passkeys are not configured }
  /auth/passkeys/login/finish:
    post:
      operationId: authPasskeyLoginFinish
      tags: [auth]
      security: []
      description: >-
        Complete a discoverable passkey login: submit the assertion from
        navigator.credentials.get with the ceremony session_id. The user is
        resolved ONLY from the authenticated credential, the signature counter is
        verified to have increased (clone detection), and on success a session is
        minted exactly like a password login — but the TOTP gate is skipped because
        a user-verified passkey is strong auth. Any failure is a flat 401.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasskeyFinishRequest' }
      responses:
        '200':
          description: Session
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionResponse' }
        '400': { description: Validation error }
        '401': { description: Authentication failed }
        '429': { description: Too many attempts (rate limited); see Retry-After }
        '501': { description: Passkeys are not configured }
  /auth/email-otp/start:
    post:
      operationId: authEmailOTPStart
      tags: [auth]
      security: []
      description: >-
        Request a passwordless login code by email. ALWAYS returns 200 with the
        same generic body whether or not the email matches an account (no
        user-enumeration oracle); only a matching account is emailed a single-use,
        short-lived numeric code. Rate limited per client IP and per email
        (mail-bombing prevention); when a captcha is configured, an
        X-Captcha-Token header is required.
      parameters:
        - $ref: '#/components/parameters/CaptchaToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmailOTPStartRequest' }
      responses:
        '200':
          description: Generic acknowledgement (identical for existing and non-existing emails)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmailOTPStartResponse' }
        '400': { description: Validation error }
        '403': { description: Captcha verification failed }
        '429': { description: Too many requests (rate limited); see Retry-After }
  /auth/email-otp/verify:
    post:
      operationId: authEmailOTPVerify
      tags: [auth]
      security: []
      description: >-
        Exchange an emailed login code for a session. Email possession is a FIRST
        factor equivalent to a password: a user with confirmed 2FA still receives a
        TwoFactorRequiredResponse (no session) and must complete /auth/2fa/verify —
        the code never bypasses configured MFA. The code is single-use, TTL'd, and
        try-capped; every failure is a flat 401. Rate limited per client IP and per
        email.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmailOTPVerifyRequest' }
      responses:
        '200':
          description: >-
            A session (SessionResponse) for a user without a confirmed second
            factor, OR a single-use 2FA challenge (TwoFactorRequiredResponse, no
            tokens) for a user with 2FA enabled.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/SessionResponse'
                  - $ref: '#/components/schemas/TwoFactorRequiredResponse'
        '400': { description: Validation error }
        '401': { description: Invalid or expired code }
        '429': { description: Too many requests (rate limited); see Retry-After }
  /auth/api-keys:
    post:
      operationId: authApiKeyCreate
      tags: [auth]
      security: [{ bearerAuth: [] }]
      description: >-
        Mint a scoped API key for the caller's workspace. The full token
        (inrd_<prefix>_<secret>) is returned in this response EXACTLY ONCE and is
        never retrievable again — only its SHA-256 is stored. Grant a subset of the
        owned scope vocabulary; optionally restrict by CIDR allowlist, a per-minute
        rate limit, and an expiry. Session-authed only (an API key cannot mint keys).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApiKeyCreateRequest' }
      responses:
        '201':
          description: The created key metadata plus the one-time token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiKeyCreateResponse' }
        '400': { description: Validation error (unknown scope, bad CIDR, past expiry, non-positive rate limit) }
        '401': { description: Unauthorized }
    get:
      operationId: authApiKeyList
      tags: [auth]
      security: [{ bearerAuth: [] }]
      description: >-
        List the caller's workspace API keys, newest first. No secret or hash is
        ever returned — only the public prefix and metadata.
      responses:
        '200':
          description: The workspace's API keys
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiKeyListResponse' }
        '401': { description: Unauthorized }
  /auth/api-keys/{id}:
    delete:
      operationId: authApiKeyRevoke
      tags: [auth]
      security: [{ bearerAuth: [] }]
      description: >-
        Revoke one of the caller's workspace API keys. Idempotent (re-revoking
        succeeds); a foreign or unknown id returns 404 so a caller cannot probe or
        revoke another workspace's key.
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '204': { description: Key revoked }
        '400': { description: Invalid id }
        '401': { description: Unauthorized }
        '404': { description: API key not found }
  /workspaces/{id}/invites:
    post:
      operationId: createWorkspaceInvite
      tags: [invites]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateInviteRequest' }
      responses:
        '201': { description: Created invite, content: { application/json: { schema: { $ref: '#/components/schemas/Invite' } } } }
        '400': { description: Validation error }
        '401': { description: Unauthorized }
        '403': { description: Not an admin of this workspace, or workspace mismatch }
        '409': { description: An invite is already pending for this email }
    get:
      operationId: listWorkspaceInvites
      tags: [invites]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: Pending invites, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Invite' } } } } }
        '401': { description: Unauthorized }
        '403': { description: Not an admin of this workspace, or workspace mismatch }
  /workspaces/{id}/invites/{inviteId}:
    delete:
      operationId: revokeWorkspaceInvite
      tags: [invites]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: inviteId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Invite revoked }
        '400': { description: Invalid invite id }
        '401': { description: Unauthorized }
        '403': { description: Not an admin of this workspace, or workspace mismatch }
  /mailboxes:
    get:
      operationId: listMailboxes
      tags: [mailboxes]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Mailboxes in the workspace
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Mailbox' } }
        '401': { description: Unauthorized }
    post:
      operationId: connectMailbox
      tags: [mailboxes]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConnectMailboxRequest' }
      responses:
        '200':
          description: Connected mailbox
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Mailbox' }
        '400': { description: Validation error }
        '401': { description: Unauthorized }
        '409': { description: Mailbox already exists }
        '422': { description: Connection test failed }
  /mailboxes/{id}:
    get:
      operationId: getMailbox
      tags: [mailboxes]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Mailbox
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Mailbox' }
        '401': { description: Unauthorized }
        '404': { description: Not found }
    delete:
      operationId: deleteMailbox
      tags: [mailboxes]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Deleted }
        '401': { description: Unauthorized }
        '404': { description: Not found }
  /mailboxes/{id}/pause:
    post:
      operationId: pauseMailbox
      tags: [mailboxes]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Paused mailbox
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Mailbox' }
        '401': { description: Unauthorized }
        '404': { description: Not found }
  /mailboxes/{id}/resume:
    post:
      operationId: resumeMailbox
      tags: [mailboxes]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Resumed mailbox
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Mailbox' }
        '401': { description: Unauthorized }
        '404': { description: Not found }
  /mailboxes/{id}/warmup:
    get:
      operationId: getMailboxWarmup
      tags: [warmup]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Warmup detail for one mailbox, with a 30-day daily series
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WarmupDetail' }
        '401': { description: Unauthorized }
        '404': { description: Mailbox not found or not a warmup participant }
    put:
      operationId: enableMailboxWarmup
      tags: [warmup]
      security: [{ bearerAuth: [] }]
      description: Enable warmup on a mailbox or update its settings. Idempotent.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WarmupSettings' }
      responses:
        '200':
          description: Warmup enabled/updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WarmupParticipant' }
        '400': { description: Validation error (e.g. start_volume > max_volume) }
        '401': { description: Unauthorized }
        '404': { description: Mailbox not found }
    delete:
      operationId: disableMailboxWarmup
      tags: [warmup]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Warmup disabled }
        '401': { description: Unauthorized }
        '404': { description: Mailbox not found }
  /warmup/overview:
    get:
      operationId: getWarmupOverview
      tags: [warmup]
      security: [{ bearerAuth: [] }]
      description: Pool summary plus per-mailbox health and 7-day placement rates for the workspace.
      responses:
        '200':
          description: Warmup overview
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WarmupOverview' }
        '401': { description: Unauthorized }
  /lists:
    get:
      operationId: listLists
      tags: [lists]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Lists, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/List' } } } } }
        '401': { description: Unauthorized }
    post:
      operationId: createList
      tags: [lists]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [name], properties: { name: { type: string } } } } }
      responses:
        '200': { description: Created list, content: { application/json: { schema: { $ref: '#/components/schemas/List' } } } }
        '400': { description: Validation error }
        '401': { description: Unauthorized }
  /contacts/import:
    post:
      operationId: importContacts
      tags: [contacts]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: list, in: query, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { type: object, properties: { file: { type: string, format: binary } } }
      responses:
        '200': { description: Import result, content: { application/json: { schema: { $ref: '#/components/schemas/ImportResult' } } } }
        '400': { description: Validation error }
        '401': { description: Unauthorized }
        '404': { description: List not found }
  /contacts:
    get:
      operationId: listContacts
      tags: [contacts]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: list, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: limit, in: query, schema: { type: integer, default: 50 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        '200': { description: Contacts, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Contact' } } } } }
        '401': { description: Unauthorized }
  /campaigns:
    get:
      operationId: listCampaigns
      tags: [campaigns]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Campaigns, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Campaign' } } } } }
        '401': { description: Unauthorized }
    post:
      operationId: createCampaign
      tags: [campaigns]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateCampaignRequest' } } }
      responses:
        '200': { description: Created campaign, content: { application/json: { schema: { $ref: '#/components/schemas/Campaign' } } } }
        '400': { description: Validation error }
        '401': { description: Unauthorized }
        '404': { description: List not found }
        '422': { description: Mailbox not active }
  /campaigns/{id}:
    get:
      operationId: getCampaign
      tags: [campaigns]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: Campaign with steps + enrollment counts, content: { application/json: { schema: { $ref: '#/components/schemas/CampaignDetail' } } } }
        '401': { description: Unauthorized }
        '404': { description: Not found }
  /campaigns/{id}/tracking:
    put:
      operationId: updateCampaignTracking
      tags: [campaigns]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/UpdateCampaignTrackingRequest' } } }
      responses:
        '200':
          description: Tracking flag updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  tracking_enabled: { type: boolean }
        '400': { description: Invalid JSON }
        '401': { description: Unauthorized }
        '404': { description: Not found }
  /campaigns/{id}/enrollments:
    get:
      operationId: listCampaignEnrollments
      tags: [campaigns]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: limit, in: query, required: false, schema: { type: integer, default: 100, minimum: 1, maximum: 500 } }
        - { name: offset, in: query, required: false, schema: { type: integer, default: 0, minimum: 0 } }
      responses:
        '200': { description: Per-contact reply status for the campaign's enrollments, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/CampaignEnrollment' } } } } }
        '400': { description: Invalid campaign id }
        '401': { description: Unauthorized }
        '404': { description: Campaign not found }
        '500': { description: Could not list enrollments }
  /campaigns/{id}/steps:
    get:
      operationId: listSteps
      tags: [campaigns]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: Steps in order, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/SequenceStep' } } } } }
        '401': { description: Unauthorized }
        '404': { description: Campaign not found }
    post:
      operationId: createStep
      tags: [campaigns]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/StepRequest' } } }
      responses:
        '200': { description: Created step (appended at end), content: { application/json: { schema: { $ref: '#/components/schemas/SequenceStep' } } } }
        '400': { description: Validation error }
        '401': { description: Unauthorized }
        '404': { description: Campaign not found }
        '409': { description: Campaign not draft (structural edits are draft-only) }
  /campaigns/{id}/steps/{stepId}:
    put:
      operationId: updateStep
      tags: [campaigns]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: stepId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/StepRequest' } } }
      responses:
        '200': { description: Updated step (content edits allowed while running — live-reference), content: { application/json: { schema: { $ref: '#/components/schemas/SequenceStep' } } } }
        '400': { description: Validation error }
        '401': { description: Unauthorized }
        '404': { description: Campaign or step not found }
    delete:
      operationId: deleteStep
      tags: [campaigns]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: stepId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Deleted }
        '401': { description: Unauthorized }
        '404': { description: Campaign or step not found }
        '409': { description: Campaign not draft (delete is a structural edit) }
  /campaigns/{id}/steps/reorder:
    post:
      operationId: reorderSteps
      tags: [campaigns]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ReorderStepsRequest' } } }
      responses:
        '200': { description: Steps in the new order, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/SequenceStep' } } } } }
        '400': { description: step_ids is not a permutation of the campaign's step ids }
        '401': { description: Unauthorized }
        '404': { description: Campaign or step not found }
        '409': { description: Campaign not draft (reorder is a structural edit) }
  /campaigns/{id}/launch:
    post:
      operationId: launchCampaign
      tags: [campaigns]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200':
          description: Enrollment + queue counts
          content:
            application/json:
              schema:
                type: object
                properties:
                  queued: { type: integer }
                  total_enrolled: { type: integer }
                  failed_enqueue_count: { type: integer }
        '401': { description: Unauthorized }
        '404': { description: Not found }
        '409': { description: Already launched }
        '422': { description: Target list empty or campaign has no steps }
  # The unsubscribe endpoint is served outside the /api/v1 base — it is
  # public and browser-facing (no auth, returns HTML). RFC 8058 requires the
  # state change to live on POST so email preview scanners auto-following
  # GETs don't silently unsubscribe every recipient.
  /u/{token}:
    servers: [{ url: / }]
    get:
      operationId: unsubscribeConfirmPage
      tags: [unsubscribe]
      security: []
      parameters: [{ name: token, in: path, required: true, schema: { type: string } }]
      responses:
        '200':
          description: HTML confirmation page with a form that POSTs back
          content:
            text/html:
              schema: { type: string }
        '400': { description: Malformed or invalid token }
    post:
      operationId: unsubscribe
      tags: [unsubscribe]
      security: []
      parameters: [{ name: token, in: path, required: true, schema: { type: string } }]
      responses:
        '200':
          description: Suppression recorded (idempotent)
          content:
            text/html:
              schema: { type: string }
        '400': { description: Malformed or invalid token }
  # Open-pixel + click-redirect endpoints a recipient's mail client follows
  # unauthenticated, mirroring /u above -- also served outside the /api/v1
  # base. Not called by the SPA; documented here for completeness.
  /t/o/{token}.gif:
    servers: [{ url: / }]
    get:
      operationId: trackOpen
      tags: [tracking]
      security: []
      parameters: [{ name: token, in: path, required: true, schema: { type: string } }]
      responses:
        '200':
          description: >-
            1x1 transparent GIF, always -- served identically whether or not
            the token is valid, so the endpoint can never become an oracle.
          content:
            image/gif:
              schema: { type: string, format: binary }
  /t/c/{token}:
    servers: [{ url: / }]
    get:
      operationId: trackClick
      tags: [tracking]
      security: []
      parameters: [{ name: token, in: path, required: true, schema: { type: string } }]
      responses:
        '302': { description: Redirect to the signed destination URL }
        '404': { description: Malformed/tampered token or unknown send -- no redirect, nothing recorded }
  # OAuth 2.1 authorization server (Inroad acting as an OAuth PROVIDER). Mounted at
  # the TOP level under /oauth2 -- outside the /api/v1 base -- and distinct from the
  # /oauth mailbox-connect flow (Inroad as an OAuth CLIENT to Google/Microsoft). This
  # is P6a: dynamic client registration, the authorization endpoint, and consent. The
  # token endpoint is P6b.
  /oauth2/register:
    servers: [{ url: / }]
    post:
      operationId: oauth2Register
      tags: [oauth2]
      security: []
      description: >-
        RFC 7591 dynamic client registration. PUBLIC but rate-limited per client IP.
        Public PKCE client by default (token_endpoint_auth_method omitted or "none",
        no secret); request a client_secret_* method to get a confidential client
        whose secret is returned in this response EXACTLY ONCE (only its SHA-256 is
        stored). Each redirect_uri must be https (or a http loopback for native apps),
        carry no fragment, and requested scopes must all be OAuth-grantable (no
        admin/api-key/send scopes). When a session is present it is recorded so a
        workspace admin can later list/revoke the client.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OAuth2RegisterRequest' }
      responses:
        '201':
          description: The registered client; client_secret present only for a confidential client (once)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OAuth2Client' }
        '400': { description: Validation error (bad redirect_uri, non-grantable scope, unsupported grant/response type or auth method) }
        '429': { description: Registration rate limit exceeded }
  /oauth2/authorize:
    servers: [{ url: / }]
    get:
      operationId: oauth2Authorize
      tags: [oauth2]
      security: []
      description: >-
        OAuth 2.1 authorization endpoint (a top-level browser navigation, not an SPA
        fetch). response_type MUST be "code"; PKCE is mandatory and S256-only. The
        client and redirect_uri are validated FIRST (an unknown client or a
        redirect_uri that does not EXACTLY match the registered allowlist renders an
        error and never redirects); only after that are other errors returned by
        redirecting to the validated redirect_uri with error+state. The resource owner
        is resolved from the P1 session (never a parameter): if unauthenticated the
        browser is redirected to the SPA login with a return_to; if authenticated and
        a prior consent already covers the scopes a code is issued immediately,
        otherwise the browser is redirected to the SPA consent screen.
      parameters:
        - { name: response_type, in: query, required: true, schema: { type: string, enum: [code] } }
        - { name: client_id, in: query, required: true, schema: { type: string } }
        - { name: redirect_uri, in: query, required: true, schema: { type: string } }
        - { name: scope, in: query, required: true, schema: { type: string, description: space-delimited } }
        - { name: state, in: query, required: false, schema: { type: string } }
        - { name: code_challenge, in: query, required: true, schema: { type: string } }
        - { name: code_challenge_method, in: query, required: true, schema: { type: string, enum: [S256] } }
      responses:
        '302': { description: Redirect to the client redirect_uri (code+state or error+state), the SPA consent screen, or the SPA login page }
        '400':
          description: Unknown client or redirect_uri mismatch -- rendered inline, never redirected (anti-open-redirect)
          content:
            text/html:
              schema: { type: string }
  /oauth2/consent/{consent_id}:
    servers: [{ url: / }]
    get:
      operationId: oauth2ConsentData
      tags: [oauth2]
      security: [{ bearerAuth: [] }]
      description: >-
        Return the pending consent request's display data for the SPA consent screen.
        Session-authed; the request must belong to the session user and be live
        (unconsumed, unexpired), else 404.
      parameters: [{ name: consent_id, in: path, required: true, schema: { type: string } }]
      responses:
        '200':
          description: Consent request display data
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OAuth2ConsentData' }
        '401': { description: Unauthorized }
        '404': { description: Unknown, expired, consumed, or not this user's consent request }
  /oauth2/consent:
    servers: [{ url: / }]
    post:
      operationId: oauth2ConsentDecide
      tags: [oauth2]
      security: [{ bearerAuth: [] }]
      description: >-
        Record the resource owner's approve/deny decision. Session-authed and
        CSRF-guarded (double-submit); the service re-checks the session user owns the
        request. On approve it consumes the single-use request, remembers the consent,
        and issues a code; on deny it returns an access_denied redirect. The returned
        redirect_to is the URL the SPA navigates the browser to. Requires the
        X-CSRF-Token header (double-submit) matching the csrf_token cookie.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OAuth2ConsentDecision' }
      responses:
        '200':
          description: The URL to navigate the browser to (client redirect_uri with code+state, or error=access_denied+state)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OAuth2RedirectTo' }
        '400': { description: Validation error }
        '401': { description: Unauthorized }
        '403': { description: CSRF token mismatch }
        '404': { description: Unknown, expired, consumed, or not this user's consent request }
  /oauth2/clients:
    servers: [{ url: / }]
    get:
      operationId: oauth2ListClients
      tags: [oauth2]
      security: [{ bearerAuth: [] }]
      description: >-
        List the caller's workspace's registered OAuth clients, newest first. No
        client secret or hash is ever returned. Session-authed + admin, workspace-pinned.
      responses:
        '200':
          description: The workspace's OAuth clients
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OAuth2ClientList' }
        '401': { description: Unauthorized }
        '403': { description: Not an admin }
  /oauth2/clients/{client_id}:
    servers: [{ url: / }]
    delete:
      operationId: oauth2RevokeClient
      tags: [oauth2]
      security: [{ bearerAuth: [] }]
      description: >-
        Revoke one of the caller's workspace's OAuth clients. Idempotent; a foreign or
        unknown client_id returns 404. Session-authed + admin, workspace-pinned.
      parameters: [{ name: client_id, in: path, required: true, schema: { type: string } }]
      responses:
        '204': { description: Client revoked }
        '401': { description: Unauthorized }
        '403': { description: Not an admin }
        '404': { description: Client not found }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    CaptchaToken:
      name: X-Captcha-Token
      in: header
      required: false
      description: >-
        Client-solved captcha (Cloudflare Turnstile) token. Required ONLY when the
        server is configured with a captcha secret (INROAD_TURNSTILE_SECRET); on such
        a server a missing or invalid token is rejected 403. On a server without a
        captcha configured the header is ignored.
      schema: { type: string }
  schemas:
    EmailOTPStartRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }
    EmailOTPStartResponse:
      type: object
      required: [status]
      properties:
        status: { type: string, description: Generic acknowledgement; identical whether or not the email matched an account. }
    EmailOTPVerifyRequest:
      type: object
      required: [email, code]
      properties:
        email: { type: string, format: email }
        code: { type: string, description: The 6-digit numeric code delivered by email. }
    RegisterRequest:
      type: object
      required: [workspace_name, email, password]
      properties:
        workspace_name: { type: string }
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }
    SessionResponse:
      type: object
      required: [access_token, expires_in, user_id, active_workspace_id, role, memberships]
      properties:
        access_token: { type: string }
        expires_in: { type: integer }
        user_id: { type: string }
        active_workspace_id: { type: string }
        role: { type: string }
        memberships:
          type: array
          items: { $ref: '#/components/schemas/Membership' }
    Membership:
      type: object
      required: [workspace_id, workspace_name, role]
      properties:
        workspace_id: { type: string }
        workspace_name: { type: string }
        role: { type: string }
    MeResponse:
      type: object
      required: [user_id, active_workspace_id, role, memberships, email_verified]
      properties:
        user_id: { type: string }
        active_workspace_id: { type: string }
        role: { type: string }
        memberships:
          type: array
          items: { $ref: '#/components/schemas/Membership' }
        email_verified: { type: boolean, description: Whether the caller has confirmed their email address. }
    SwitchWorkspaceRequest:
      type: object
      required: [workspace_id]
      properties:
        workspace_id: { type: string }
    SessionInfo:
      type: object
      required: [id, workspace_id, created_at, expires_at, current]
      properties:
        id: { type: string, format: uuid }
        workspace_id: { type: string, format: uuid }
        user_agent: { type: string, nullable: true }
        ip: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        current: { type: boolean, description: Whether this is the session tied to the caller's current access token. }
    SessionListResponse:
      type: object
      required: [sessions]
      properties:
        sessions:
          type: array
          items: { $ref: '#/components/schemas/SessionInfo' }
    RevokeOthersResponse:
      type: object
      required: [revoked]
      properties:
        revoked: { type: integer, description: Number of other sessions revoked. }
    SwitchWorkspaceResponse:
      type: object
      required: [access_token, expires_in, active_workspace_id, role]
      properties:
        access_token: { type: string }
        expires_in: { type: integer }
        active_workspace_id: { type: string }
        role: { type: string }
    TwoFactorRequiredResponse:
      type: object
      required: [two_factor_required, challenge]
      properties:
        two_factor_required: { type: boolean, description: Always true; distinguishes this from a SessionResponse. }
        challenge: { type: string, description: Single-use, short-lived challenge token to submit to /auth/2fa/verify. }
    TwoFactorStatusResponse:
      type: object
      required: [totp_enabled, recovery_codes_remaining]
      properties:
        totp_enabled: { type: boolean }
        recovery_codes_remaining: { type: integer, description: Number of unused single-use recovery codes. }
    TwoFactorEnrollResponse:
      type: object
      required: [secret, otpauth_uri]
      properties:
        secret: { type: string, description: Base32 TOTP secret for manual entry. Returned only at enrollment. }
        otpauth_uri: { type: string, description: otpauth:// provisioning URI to render as a QR code. }
    TwoFactorConfirmResponse:
      type: object
      required: [recovery_codes]
      properties:
        recovery_codes:
          type: array
          description: Single-use recovery codes, shown exactly once.
          items: { type: string }
    TwoFactorCodeRequest:
      type: object
      required: [code]
      properties:
        code: { type: string, description: A TOTP code or a recovery code. }
    TwoFactorVerifyRequest:
      type: object
      required: [challenge, code]
      properties:
        challenge: { type: string, description: The challenge token returned by /auth/login. }
        code: { type: string, description: A TOTP code or a recovery code. }
    ApiKeyCreateRequest:
      type: object
      required: [name, scopes]
      properties:
        name: { type: string, description: Operator-facing label for the key. }
        scopes:
          type: array
          minItems: 1
          description: >-
            Granted scopes; a subset of the owned vocabulary (e.g. mailboxes:read,
            campaigns:send). The key holds exactly these.
          items: { type: string }
        ip_allowlist:
          type: array
          nullable: true
          description: >-
            Optional IPs or CIDRs the key may be used from; a bare IP is treated as
            a host route. Omit or leave empty for no restriction.
          items: { type: string }
        rate_limit_per_min:
          type: integer
          nullable: true
          description: Optional per-minute request cap. Omit for unlimited.
        expires_at:
          type: string
          format: date-time
          nullable: true
          description: Optional RFC3339 expiry. Omit for a key that never expires.
    ApiKey:
      type: object
      description: Non-secret view of an API key. Never carries the secret or its hash.
      required: [id, name, prefix, scopes, created_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        prefix: { type: string, description: Public, non-secret token prefix (the part before the secret). }
        scopes: { type: array, items: { type: string } }
        ip_allowlist: { type: array, nullable: true, items: { type: string } }
        rate_limit_per_min: { type: integer, nullable: true }
        expires_at: { type: string, format: date-time, nullable: true }
        revoked_at: { type: string, format: date-time, nullable: true }
        last_used_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
    ApiKeyCreateResponse:
      type: object
      required: [token, api_key]
      properties:
        token:
          type: string
          description: >-
            The full API key token (inrd_<prefix>_<secret>). SHOWN EXACTLY ONCE —
            store it now; it is never retrievable again.
        api_key: { $ref: '#/components/schemas/ApiKey' }
    ApiKeyListResponse:
      type: object
      required: [api_keys]
      properties:
        api_keys:
          type: array
          items: { $ref: '#/components/schemas/ApiKey' }
    PasskeyBeginResponse:
      type: object
      required: [session_id, publicKey]
      properties:
        session_id:
          type: string
          description: >-
            Opaque single-use ceremony handle. Echo it back in the matching finish
            call's session_id. The server holds the real challenge; this is never
            the challenge itself.
        publicKey:
          type: object
          additionalProperties: true
          description: >-
            The WebAuthn options object (PublicKeyCredentialCreationOptions for
            register, PublicKeyCredentialRequestOptions for login) as defined by the
            WebAuthn spec — pass straight to navigator.credentials.create/get.
    PasskeyFinishRequest:
      type: object
      required: [session_id, credential]
      properties:
        session_id:
          type: string
          description: The opaque session_id from the matching begin call.
        credential:
          type: object
          additionalProperties: true
          description: >-
            The PublicKeyCredential JSON returned by navigator.credentials.create
            (attestation) or navigator.credentials.get (assertion), serialized.
        label:
          type: string
          description: Optional friendly name for the passkey (registration only).
    PasskeyInfo:
      type: object
      required: [id, label, transports, created_at]
      properties:
        id: { type: string, format: uuid }
        label: { type: string }
        transports:
          type: array
          items: { type: string }
          description: Advisory transport hints (e.g. internal, hybrid). Always present; empty when none.
        created_at: { type: string, format: date-time }
        last_used_at: { type: string, format: date-time, nullable: true }
    PasskeyListResponse:
      type: object
      required: [passkeys]
      properties:
        passkeys:
          type: array
          items: { $ref: '#/components/schemas/PasskeyInfo' }
    VerifyEmailRequest:
      type: object
      required: [token]
      properties:
        token: { type: string }
    ForgotPasswordRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }
    ResetPasswordRequest:
      type: object
      required: [token, new_password]
      properties:
        token: { type: string }
        new_password: { type: string, minLength: 8 }
    AcceptInviteRequest:
      type: object
      required: [token]
      properties:
        token: { type: string }
        password: { type: string, minLength: 8 }
    CreateInviteRequest:
      type: object
      required: [email, role]
      properties:
        email: { type: string, format: email }
        role: { type: string, enum: [admin, member] }
    Invite:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        role: { type: string }
        status: { type: string }
        expires_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
    ConnectMailboxRequest:
      type: object
      required: [email, smtp_host, smtp_port, imap_host, imap_port, secret]
      properties:
        email: { type: string, format: email }
        display_name: { type: string }
        smtp_host: { type: string }
        smtp_port: { type: integer }
        smtp_username: { type: string }
        imap_host: { type: string }
        imap_port: { type: integer }
        imap_username: { type: string }
        secret: { type: string }
        allow_plaintext:
          type: boolean
          default: false
          description: >-
            Explicit opt-out from TLS, persisted on the mailbox so the connect
            test AND every subsequent send apply the SAME policy (rare
            cleartext-only internal relay). Omitted/false enforces TLS
            (STARTTLS on 25/587/2525, implicit TLS on 465); an absent value can
            never silently downgrade to cleartext auth. Replaces the removed
            use_tls flag.
    Mailbox:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        display_name: { type: string }
        provider: { type: string }
        smtp_host: { type: string }
        smtp_port: { type: integer }
        smtp_username: { type: string }
        imap_host: { type: string }
        imap_port: { type: integer }
        imap_username: { type: string }
        allow_plaintext: { type: boolean }
        daily_cap: { type: integer }
        min_interval_seconds: { type: integer }
        ramp_enabled: { type: boolean }
        ramp_start_cap: { type: integer }
        ramp_days: { type: integer }
        status: { type: string }
        last_error: { type: string }
        created_at: { type: string, format: date-time }
    List:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
    ImportResult:
      type: object
      properties:
        imported: { type: integer }
        skipped: { type: integer }
        duplicates: { type: integer }
    Contact:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        first_name: { type: string }
    Campaign:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        subject: { type: string }
        status: { type: string }
        stats: { type: object, additionalProperties: { type: integer } }
    CampaignDetail:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        subject: { type: string }
        status: { type: string }
        tracking_enabled: { type: boolean, description: Whether open/click tracking is injected into this campaign's sends. }
        stats: { type: object, additionalProperties: { type: integer }, description: send counts by status }
        enrollments: { type: object, additionalProperties: { type: integer }, description: enrollment counts by status }
        steps: { type: array, items: { $ref: '#/components/schemas/SequenceStep' } }
        metrics: { $ref: '#/components/schemas/Metrics' }
    Metrics:
      type: object
      description: >-
        Per-campaign engagement rollup. Rates are fractions in 0..1 rounded to
        4 decimal places. opens_indicative/open_rate are proxy-filtered but
        remain approximate -- clicks are the reliable signal.
      properties:
        sent: { type: integer }
        opens_indicative: { type: integer }
        clicks: { type: integer }
        replies: { type: integer }
        bounces: { type: integer }
        unsubscribes: { type: integer }
        open_rate: { type: number }
        click_rate: { type: number }
        reply_rate: { type: number }
        bounce_rate: { type: number }
        unsub_rate: { type: number }
    CampaignEnrollment:
      type: object
      description: >-
        One contact's enrollment reply status in a campaign. The reply fields
        (reply_class/reply_source/replied_at) are null until an inbound reply is
        classified for that enrollment.
      required: [email, first_name, status, reply_class, reply_source, replied_at]
      properties:
        email: { type: string }
        first_name: { type: string }
        status: { type: string, description: enrollment lifecycle status (active/completed/stopped) }
        reply_class:
          type: string
          nullable: true
          enum: [positive, negative, neutral, auto_reply, out_of_office, unsubscribe, unknown]
          description: classified sentiment/intent bucket of the reply
        reply_source:
          type: string
          nullable: true
          description: layer that decided the class (header/lexicon/model)
        replied_at:
          type: string
          format: date-time
          nullable: true
          description: RFC3339 timestamp the reply was classified
    SequenceStep:
      type: object
      properties:
        id: { type: string, format: uuid }
        step_order: { type: integer }
        delay_seconds: { type: integer, description: wait after the previous step's send before this one }
        subject: { type: string }
        body_text: { type: string }
        body_html: { type: string }
    StepRequest:
      type: object
      properties:
        delay_seconds: { type: integer, minimum: 0 }
        subject: { type: string, maxLength: 500 }
        body_text: { type: string }
        body_html: { type: string }
    ReorderStepsRequest:
      type: object
      required: [step_ids]
      properties:
        step_ids:
          type: array
          description: the FULL ordered list of the campaign's step ids, in the desired order
          items: { type: string, format: uuid }
    CreateCampaignRequest:
      type: object
      required: [name, mailbox_id, list_id, subject]
      properties:
        name: { type: string }
        mailbox_id: { type: string, format: uuid }
        list_id: { type: string, format: uuid }
        subject: { type: string }
        body_text: { type: string }
        body_html: { type: string }
    UpdateCampaignTrackingRequest:
      type: object
      properties:
        enabled: { type: boolean }
    WarmupSettings:
      type: object
      description: >-
        Warmup ramp settings for a mailbox. All fields optional on update; omitted
        fields keep their current (or default) value. Validated at the boundary:
        1 <= start_volume <= max_volume <= 200, ramp_increment >= 1,
        0 <= reply_rate <= 1.
      properties:
        start_volume: { type: integer, minimum: 1, maximum: 200, description: warmup emails/day at day 0 }
        max_volume: { type: integer, minimum: 1, maximum: 200, description: daily ceiling the ramp climbs to }
        ramp_increment: { type: integer, minimum: 1, description: emails/day added each day }
        reply_rate: { type: number, minimum: 0, maximum: 1, description: probability a warmup send is an in-thread reply }
    WarmupParticipant:
      type: object
      description: One mailbox's warmup enrollment state.
      required: [mailbox_id, enabled, start_volume, max_volume, ramp_increment, reply_rate, health_state, health_reason, started_at, today_sent, today_target]
      properties:
        mailbox_id: { type: string, format: uuid }
        enabled: { type: boolean }
        start_volume: { type: integer }
        max_volume: { type: integer }
        ramp_increment: { type: integer }
        reply_rate: { type: number }
        health_state:
          type: string
          enum: [healthy, watch, throttled, paused]
          description: reputation state derived from inbox-placement and behavior signals
        health_reason: { type: string, description: human-readable explanation of a non-healthy state }
        started_at: { type: string, format: date-time }
        today_sent: { type: integer, description: warmup emails sent by this mailbox today }
        today_target: { type: integer, description: "today's intended (un-jittered) daily ramp target; 0 when paused. The worker applies a ±20% per-day jitter factor, so today_sent may occasionally exceed this." }
    WarmupMailbox:
      type: object
      description: A participant enriched with rolling placement rates for the overview.
      required: [mailbox_id, email, enabled, health_state, health_reason, today_sent, today_target, inbox_rate_7d, spam_rate_7d]
      properties:
        mailbox_id: { type: string, format: uuid }
        email: { type: string }
        enabled: { type: boolean }
        health_state: { type: string, enum: [healthy, watch, throttled, paused] }
        health_reason: { type: string }
        today_sent: { type: integer }
        today_target: { type: integer }
        inbox_rate_7d: { type: number, description: "of this mailbox's SENT warmup mail over 7 days, the fraction that landed in partners' inboxes (0..1) — a sender-deliverability signal" }
        spam_rate_7d: { type: number, description: "of this mailbox's SENT warmup mail over 7 days, the fraction that landed in partners' spam (0..1)" }
    WarmupOverview:
      type: object
      description: >-
        Workspace warmup summary. pool_size is the number of enabled participants;
        warmup needs at least 2 to exchange mail (active is true when pool_size>=2).
      required: [pool_size, active, mailboxes]
      properties:
        pool_size: { type: integer }
        active: { type: boolean }
        mailboxes:
          type: array
          items: { $ref: '#/components/schemas/WarmupMailbox' }
    WarmupDayStat:
      type: object
      required: [day, sent, received, inbox, spam, replies]
      properties:
        day: { type: string, format: date, description: UTC day }
        sent: { type: integer, description: warmup mail this mailbox sent }
        received: { type: integer, description: warmup mail this mailbox received }
        inbox: { type: integer, description: "of this mailbox's SENT mail, how many landed in partners' inboxes (sender placement)" }
        spam: { type: integer, description: "of this mailbox's SENT mail, how many landed in partners' spam (sender placement)" }
        replies: { type: integer }
    WarmupDetail:
      type: object
      description: One mailbox's participant state plus its daily series.
      required: [participant, series]
      properties:
        participant: { $ref: '#/components/schemas/WarmupParticipant' }
        series:
          type: array
          description: daily stats, oldest first, up to 30 days
          items: { $ref: '#/components/schemas/WarmupDayStat' }
    OAuth2RegisterRequest:
      type: object
      required: [client_name, redirect_uris]
      description: RFC 7591 dynamic client registration request.
      properties:
        client_name: { type: string }
        redirect_uris:
          type: array
          minItems: 1
          items: { type: string }
          description: https (or http loopback) URIs, no fragment; exact-matched at /authorize
        grant_types:
          type: array
          items: { type: string, enum: [authorization_code, refresh_token] }
          description: defaults to [authorization_code]
        response_types:
          type: array
          items: { type: string, enum: [code] }
          description: defaults to [code]
        scope: { type: string, description: space-delimited; each scope must be OAuth-grantable }
        token_endpoint_auth_method:
          type: string
          enum: [none, client_secret_basic, client_secret_post]
          description: omitted or "none" => public PKCE client (no secret); client_secret_* => confidential
    OAuth2Client:
      type: object
      required: [client_id, client_name, redirect_uris, grant_types, response_types, scope, client_type, token_endpoint_auth_method, created_at]
      properties:
        client_id: { type: string }
        client_secret:
          type: string
          description: Present ONLY on a confidential client's registration response, shown exactly once. Never on a list.
        client_name: { type: string }
        redirect_uris: { type: array, items: { type: string } }
        grant_types: { type: array, items: { type: string } }
        response_types: { type: array, items: { type: string } }
        scope: { type: string, description: space-delimited registered scopes }
        client_type: { type: string, enum: [public, confidential] }
        token_endpoint_auth_method: { type: string }
        created_at: { type: string, format: date-time }
        revoked_at: { type: string, format: date-time, nullable: true }
    OAuth2ClientList:
      type: object
      required: [clients]
      properties:
        clients:
          type: array
          items: { $ref: '#/components/schemas/OAuth2Client' }
    OAuth2ConsentData:
      type: object
      required: [client_name, requested_scopes, redirect_uri]
      description: Display data the SPA renders on the consent screen.
      properties:
        client_name: { type: string }
        requested_scopes: { type: array, items: { type: string } }
        redirect_uri: { type: string }
    OAuth2ConsentDecision:
      type: object
      required: [consent_id, decision]
      properties:
        consent_id: { type: string }
        decision: { type: string, enum: [approve, deny] }
    OAuth2RedirectTo:
      type: object
      required: [redirect_to]
      properties:
        redirect_to: { type: string, description: URL the SPA navigates the browser to }
