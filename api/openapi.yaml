      operationId: crmUpdateCompany
      tags: [crm]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CRMCompanyInput' } } }
      responses:
        '200': { description: Updated company, content: { application/json: { schema: { $ref: '#/components/schemas/CRMCompany' } } } }
        '422': { description: Validation error }
    delete:
      operationId: crmDeleteCompany
      tags: [crm]
      responses:
        '204': { description: Company deleted }
        '409': { description: Company is still referenced }
  /crm/companies/{id}/contacts:
    parameters: [{ $ref: '#/components/parameters/ID' }]
    get:
      operationId: crmListCompanyContacts
      tags: [crm]
      description: >-
        The company's people, keyset-paginated by email. A sub-resource rather than
