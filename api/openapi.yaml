    post:
      operationId: crmCreateCompany
      tags: [crm]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CRMCompanyInput' } } }
      responses:
        '201':
          description: Created company
          content: { application/json: { schema: { $ref: '#/components/schemas/CRMCompany' } } }
        '422': { description: Validation error }
  /crm/companies/{id}:
    parameters: [{ $ref: '#/components/parameters/ID' }]
    get:
      operationId: crmGetCompany
      tags: [crm]
