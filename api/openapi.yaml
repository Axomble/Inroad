openapi: 3.0.3
info:
  title: Inroad API
  version: 0.1.0
servers:
  - url: /api/v1
paths:
  /auth/register:
    post:
      operationId: authRegister
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '200':
          description: Session
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionResponse' }
        '400': { description: Validation error }
        '409': { description: Workspace or email already exists }
  /auth/login:
    post:
      operationId: authLogin
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Session
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionResponse' }
        '401': { description: Invalid credentials }
  /auth/refresh:
    post:
      operationId: authRefresh
      tags: [auth]
      security: []
      responses:
        '200':
          description: Refreshed session
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionResponse' }
        '401': { description: Invalid or expired refresh token }
  /auth/logout:
    post:
      operationId: authLogout
      tags: [auth]
      security: []
      responses:
        '200':
          description: Logged out
          content:
            application/json:
              schema: { type: object, properties: { status: { type: string } } }
  /auth/me:
    get:
      operationId: authMe
      tags: [auth]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Current identity
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeResponse' }
        '401': { description: Unauthorized }
  /auth/logout-all:
    post:
      operationId: authLogoutAll
      tags: [auth]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Logged out of all sessions
          content:
            application/json:
              schema: { type: object, properties: { status: { type: string } } }
        '401': { description: Unauthorized }
  /auth/switch-workspace:
    post:
      operationId: authSwitchWorkspace
      tags: [auth]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SwitchWorkspaceRequest' }
      responses:
        '200':
          description: Switched active workspace
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SwitchWorkspaceResponse' }
        '401': { description: Unauthorized }
        '403': { description: Not a member of the target workspace }
  /auth/verify-email:
    post:
      operationId: authVerifyEmail
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VerifyEmailRequest' }
      responses:
        '204': { description: Email verified }
        '400': { description: Invalid or expired token }
  /auth/verify-email/resend:
    post:
      operationId: authResendVerification
      tags: [auth]
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Verification email re-sent }
        '401': { description: Unauthorized }
        '429': { description: Too many requests, try again shortly }
  /auth/password/forgot:
    post:
      operationId: authForgotPassword
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ForgotPasswordRequest' }
      responses:
        '204': { description: Reset email sent if the address matches an account (response is the same either way) }
        '400': { description: Validation error }
  /auth/password/reset:
    post:
      operationId: authResetPassword
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResetPasswordRequest' }
      responses:
        '204': { description: Password reset, all sessions revoked }
        '400': { description: Validation error, or invalid/expired token }
  /auth/invites/accept:
    post:
      operationId: authAcceptInvite
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AcceptInviteRequest' }
      responses:
        '200':
          description: Session
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionResponse' }
        '400': { description: Validation error }
        '404': { description: Invalid or expired invite }
        '422': { description: Password required to create an account }
  /workspaces/{id}/invites:
    post:
      operationId: createWorkspaceInvite
      tags: [invites]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateInviteRequest' }
      responses:
        '201': { description: Created invite, content: { application/json: { schema: { $ref: '#/components/schemas/Invite' } } } }
        '400': { description: Validation error }
        '401': { description: Unauthorized }
        '403': { description: Not an admin of this workspace, or workspace mismatch }
        '409': { description: An invite is already pending for this email }
    get:
      operationId: listWorkspaceInvites
      tags: [invites]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: Pending invites, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Invite' } } } } }
        '401': { description: Unauthorized }
        '403': { description: Not an admin of this workspace, or workspace mismatch }
  /workspaces/{id}/invites/{inviteId}:
    delete:
      operationId: revokeWorkspaceInvite
      tags: [invites]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: inviteId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Invite revoked }
        '400': { description: Invalid invite id }
        '401': { description: Unauthorized }
        '403': { description: Not an admin of this workspace, or workspace mismatch }
  /mailboxes:
    get:
      operationId: listMailboxes
      tags: [mailboxes]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Mailboxes in the workspace
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Mailbox' } }
        '401': { description: Unauthorized }
    post:
      operationId: connectMailbox
      tags: [mailboxes]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConnectMailboxRequest' }
      responses:
        '200':
          description: Connected mailbox
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Mailbox' }
        '400': { description: Validation error }
        '401': { description: Unauthorized }
        '409': { description: Mailbox already exists }
        '422': { description: Connection test failed }
  /mailboxes/{id}:
    get:
      operationId: getMailbox
      tags: [mailboxes]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Mailbox
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Mailbox' }
        '401': { description: Unauthorized }
        '404': { description: Not found }
    delete:
      operationId: deleteMailbox
      tags: [mailboxes]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Deleted }
        '401': { description: Unauthorized }
        '404': { description: Not found }
  /mailboxes/{id}/pause:
    post:
      operationId: pauseMailbox
      tags: [mailboxes]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Paused mailbox
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Mailbox' }
        '401': { description: Unauthorized }
        '404': { description: Not found }
  /mailboxes/{id}/resume:
    post:
      operationId: resumeMailbox
      tags: [mailboxes]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Resumed mailbox
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Mailbox' }
        '401': { description: Unauthorized }
        '404': { description: Not found }
  /mailboxes/{id}/warmup:
    get:
      operationId: getMailboxWarmup
      tags: [warmup]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Warmup detail for one mailbox, with a 30-day daily series
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WarmupDetail' }
        '401': { description: Unauthorized }
        '404': { description: Mailbox not found or not a warmup participant }
    put:
      operationId: enableMailboxWarmup
      tags: [warmup]
      security: [{ bearerAuth: [] }]
      description: Enable warmup on a mailbox or update its settings. Idempotent.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WarmupSettings' }
      responses:
        '200':
          description: Warmup enabled/updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WarmupParticipant' }
        '400': { description: Validation error (e.g. start_volume > max_volume) }
        '401': { description: Unauthorized }
        '404': { description: Mailbox not found }
    delete:
      operationId: disableMailboxWarmup
      tags: [warmup]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Warmup disabled }
        '401': { description: Unauthorized }
        '404': { description: Mailbox not found }
  /warmup/overview:
    get:
      operationId: getWarmupOverview
      tags: [warmup]
      security: [{ bearerAuth: [] }]
      description: Pool summary plus per-mailbox health and 7-day placement rates for the workspace.
      responses:
        '200':
          description: Warmup overview
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WarmupOverview' }
        '401': { description: Unauthorized }
  /lists:
    get:
      operationId: listLists
      tags: [lists]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Lists, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/List' } } } } }
        '401': { description: Unauthorized }
    post:
      operationId: createList
      tags: [lists]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [name], properties: { name: { type: string } } } } }
      responses:
        '200': { description: Created list, content: { application/json: { schema: { $ref: '#/components/schemas/List' } } } }
        '400': { description: Validation error }
        '401': { description: Unauthorized }
  /contacts/import:
    post:
      operationId: importContacts
      tags: [contacts]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: list, in: query, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { type: object, properties: { file: { type: string, format: binary } } }
      responses:
        '200': { description: Import result, content: { application/json: { schema: { $ref: '#/components/schemas/ImportResult' } } } }
        '400': { description: Validation error }
        '401': { description: Unauthorized }
        '404': { description: List not found }
  /contacts:
    get:
      operationId: listContacts
      tags: [contacts]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: list, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: limit, in: query, schema: { type: integer, default: 50 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        '200': { description: Contacts, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Contact' } } } } }
        '401': { description: Unauthorized }
  /campaigns:
    get:
      operationId: listCampaigns
      tags: [campaigns]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Campaigns, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Campaign' } } } } }
        '401': { description: Unauthorized }
    post:
      operationId: createCampaign
      tags: [campaigns]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateCampaignRequest' } } }
      responses:
        '200': { description: Created campaign, content: { application/json: { schema: { $ref: '#/components/schemas/Campaign' } } } }
        '400': { description: Validation error }
        '401': { description: Unauthorized }
        '404': { description: List not found }
        '422': { description: Mailbox not active }
  /campaigns/{id}:
    get:
      operationId: getCampaign
      tags: [campaigns]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: Campaign with steps + enrollment counts, content: { application/json: { schema: { $ref: '#/components/schemas/CampaignDetail' } } } }
        '401': { description: Unauthorized }
        '404': { description: Not found }
  /campaigns/{id}/tracking:
    put:
      operationId: updateCampaignTracking
      tags: [campaigns]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/UpdateCampaignTrackingRequest' } } }
      responses:
        '200':
          description: Tracking flag updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  tracking_enabled: { type: boolean }
        '400': { description: Invalid JSON }
        '401': { description: Unauthorized }
        '404': { description: Not found }
  /campaigns/{id}/enrollments:
    get:
      operationId: listCampaignEnrollments
      tags: [campaigns]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: limit, in: query, required: false, schema: { type: integer, default: 100, minimum: 1, maximum: 500 } }
        - { name: offset, in: query, required: false, schema: { type: integer, default: 0, minimum: 0 } }
      responses:
        '200': { description: Per-contact reply status for the campaign's enrollments, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/CampaignEnrollment' } } } } }
        '400': { description: Invalid campaign id }
        '401': { description: Unauthorized }
        '404': { description: Campaign not found }
        '500': { description: Could not list enrollments }
  /campaigns/{id}/steps:
    get:
      operationId: listSteps
      tags: [campaigns]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: Steps in order, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/SequenceStep' } } } } }
        '401': { description: Unauthorized }
        '404': { description: Campaign not found }
    post:
      operationId: createStep
      tags: [campaigns]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/StepRequest' } } }
      responses:
        '200': { description: Created step (appended at end), content: { application/json: { schema: { $ref: '#/components/schemas/SequenceStep' } } } }
        '400': { description: Validation error }
        '401': { description: Unauthorized }
        '404': { description: Campaign not found }
        '409': { description: Campaign not draft (structural edits are draft-only) }
  /campaigns/{id}/steps/{stepId}:
    put:
      operationId: updateStep
      tags: [campaigns]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: stepId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/StepRequest' } } }
      responses:
        '200': { description: Updated step (content edits allowed while running — live-reference), content: { application/json: { schema: { $ref: '#/components/schemas/SequenceStep' } } } }
        '400': { description: Validation error }
        '401': { description: Unauthorized }
        '404': { description: Campaign or step not found }
    delete:
      operationId: deleteStep
      tags: [campaigns]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: stepId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Deleted }
        '401': { description: Unauthorized }
        '404': { description: Campaign or step not found }
        '409': { description: Campaign not draft (delete is a structural edit) }
  /campaigns/{id}/steps/reorder:
    post:
      operationId: reorderSteps
      tags: [campaigns]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ReorderStepsRequest' } } }
      responses:
        '200': { description: Steps in the new order, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/SequenceStep' } } } } }
        '400': { description: step_ids is not a permutation of the campaign's step ids }
        '401': { description: Unauthorized }
        '404': { description: Campaign or step not found }
        '409': { description: Campaign not draft (reorder is a structural edit) }
  /campaigns/{id}/launch:
    post:
      operationId: launchCampaign
      tags: [campaigns]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200':
          description: Enrollment + queue counts
          content:
            application/json:
              schema:
                type: object
                properties:
                  queued: { type: integer }
                  total_enrolled: { type: integer }
                  failed_enqueue_count: { type: integer }
        '401': { description: Unauthorized }
        '404': { description: Not found }
        '409': { description: Already launched }
        '422': { description: Target list empty or campaign has no steps }
  # The unsubscribe endpoint is served outside the /api/v1 base — it is
  # public and browser-facing (no auth, returns HTML). RFC 8058 requires the
  # state change to live on POST so email preview scanners auto-following
  # GETs don't silently unsubscribe every recipient.
  /u/{token}:
    servers: [{ url: / }]
    get:
      operationId: unsubscribeConfirmPage
      tags: [unsubscribe]
      security: []
      parameters: [{ name: token, in: path, required: true, schema: { type: string } }]
      responses:
        '200':
          description: HTML confirmation page with a form that POSTs back
          content:
            text/html:
              schema: { type: string }
        '400': { description: Malformed or invalid token }
    post:
      operationId: unsubscribe
      tags: [unsubscribe]
      security: []
      parameters: [{ name: token, in: path, required: true, schema: { type: string } }]
      responses:
        '200':
          description: Suppression recorded (idempotent)
          content:
            text/html:
              schema: { type: string }
        '400': { description: Malformed or invalid token }
  # Open-pixel + click-redirect endpoints a recipient's mail client follows
  # unauthenticated, mirroring /u above -- also served outside the /api/v1
  # base. Not called by the SPA; documented here for completeness.
  /t/o/{token}.gif:
    servers: [{ url: / }]
    get:
      operationId: trackOpen
      tags: [tracking]
      security: []
      parameters: [{ name: token, in: path, required: true, schema: { type: string } }]
      responses:
        '200':
          description: >-
            1x1 transparent GIF, always -- served identically whether or not
            the token is valid, so the endpoint can never become an oracle.
          content:
            image/gif:
              schema: { type: string, format: binary }
  /t/c/{token}:
    servers: [{ url: / }]
    get:
      operationId: trackClick
      tags: [tracking]
      security: []
      parameters: [{ name: token, in: path, required: true, schema: { type: string } }]
      responses:
        '302': { description: Redirect to the signed destination URL }
        '404': { description: Malformed/tampered token or unknown send -- no redirect, nothing recorded }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    RegisterRequest:
      type: object
      required: [workspace_name, email, password]
      properties:
        workspace_name: { type: string }
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }
    SessionResponse:
      type: object
      required: [access_token, expires_in, user_id, active_workspace_id, role, memberships]
      properties:
        access_token: { type: string }
        expires_in: { type: integer }
        user_id: { type: string }
        active_workspace_id: { type: string }
        role: { type: string }
        memberships:
          type: array
          items: { $ref: '#/components/schemas/Membership' }
    Membership:
      type: object
      required: [workspace_id, workspace_name, role]
      properties:
        workspace_id: { type: string }
        workspace_name: { type: string }
        role: { type: string }
    MeResponse:
      type: object
      required: [user_id, active_workspace_id, role, memberships, email_verified]
      properties:
        user_id: { type: string }
        active_workspace_id: { type: string }
        role: { type: string }
        memberships:
          type: array
          items: { $ref: '#/components/schemas/Membership' }
        email_verified: { type: boolean, description: Whether the caller has confirmed their email address. }
    SwitchWorkspaceRequest:
      type: object
      required: [workspace_id]
      properties:
        workspace_id: { type: string }
    SwitchWorkspaceResponse:
      type: object
      required: [access_token, expires_in, active_workspace_id, role]
      properties:
        access_token: { type: string }
        expires_in: { type: integer }
        active_workspace_id: { type: string }
        role: { type: string }
    VerifyEmailRequest:
      type: object
      required: [token]
      properties:
        token: { type: string }
    ForgotPasswordRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }
    ResetPasswordRequest:
      type: object
      required: [token, new_password]
      properties:
        token: { type: string }
        new_password: { type: string, minLength: 8 }
    AcceptInviteRequest:
      type: object
      required: [token]
      properties:
        token: { type: string }
        password: { type: string, minLength: 8 }
    CreateInviteRequest:
      type: object
      required: [email, role]
      properties:
        email: { type: string, format: email }
        role: { type: string, enum: [admin, member] }
    Invite:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        role: { type: string }
        status: { type: string }
        expires_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
    ConnectMailboxRequest:
      type: object
      required: [email, smtp_host, smtp_port, imap_host, imap_port, secret]
      properties:
        email: { type: string, format: email }
        display_name: { type: string }
        smtp_host: { type: string }
        smtp_port: { type: integer }
        smtp_username: { type: string }
        imap_host: { type: string }
        imap_port: { type: integer }
        imap_username: { type: string }
        secret: { type: string }
        allow_plaintext:
          type: boolean
          default: false
          description: >-
            Explicit opt-out from TLS, persisted on the mailbox so the connect
            test AND every subsequent send apply the SAME policy (rare
            cleartext-only internal relay). Omitted/false enforces TLS
            (STARTTLS on 25/587/2525, implicit TLS on 465); an absent value can
            never silently downgrade to cleartext auth. Replaces the removed
            use_tls flag.
    Mailbox:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        display_name: { type: string }
        provider: { type: string }
        smtp_host: { type: string }
        smtp_port: { type: integer }
        smtp_username: { type: string }
        imap_host: { type: string }
        imap_port: { type: integer }
        imap_username: { type: string }
        allow_plaintext: { type: boolean }
        daily_cap: { type: integer }
        min_interval_seconds: { type: integer }
        ramp_enabled: { type: boolean }
        ramp_start_cap: { type: integer }
        ramp_days: { type: integer }
        status: { type: string }
        last_error: { type: string }
        created_at: { type: string, format: date-time }
    List:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
    ImportResult:
      type: object
      properties:
        imported: { type: integer }
        skipped: { type: integer }
        duplicates: { type: integer }
    Contact:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        first_name: { type: string }
    Campaign:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        subject: { type: string }
        status: { type: string }
        stats: { type: object, additionalProperties: { type: integer } }
    CampaignDetail:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        subject: { type: string }
        status: { type: string }
        tracking_enabled: { type: boolean, description: Whether open/click tracking is injected into this campaign's sends. }
        stats: { type: object, additionalProperties: { type: integer }, description: send counts by status }
        enrollments: { type: object, additionalProperties: { type: integer }, description: enrollment counts by status }
        steps: { type: array, items: { $ref: '#/components/schemas/SequenceStep' } }
        metrics: { $ref: '#/components/schemas/Metrics' }
    Metrics:
      type: object
      description: >-
        Per-campaign engagement rollup. Rates are fractions in 0..1 rounded to
        4 decimal places. opens_indicative/open_rate are proxy-filtered but
        remain approximate -- clicks are the reliable signal.
      properties:
        sent: { type: integer }
        opens_indicative: { type: integer }
        clicks: { type: integer }
        replies: { type: integer }
        bounces: { type: integer }
        unsubscribes: { type: integer }
        open_rate: { type: number }
        click_rate: { type: number }
        reply_rate: { type: number }
        bounce_rate: { type: number }
        unsub_rate: { type: number }
    CampaignEnrollment:
      type: object
      description: >-
        One contact's enrollment reply status in a campaign. The reply fields
        (reply_class/reply_source/replied_at) are null until an inbound reply is
        classified for that enrollment.
      required: [email, first_name, status, reply_class, reply_source, replied_at]
      properties:
        email: { type: string }
        first_name: { type: string }
        status: { type: string, description: enrollment lifecycle status (active/completed/stopped) }
        reply_class:
          type: string
          nullable: true
          enum: [positive, negative, neutral, auto_reply, out_of_office, unsubscribe, unknown]
          description: classified sentiment/intent bucket of the reply
        reply_source:
          type: string
          nullable: true
          description: layer that decided the class (header/lexicon/model)
        replied_at:
          type: string
          format: date-time
          nullable: true
          description: RFC3339 timestamp the reply was classified
    SequenceStep:
      type: object
      properties:
        id: { type: string, format: uuid }
        step_order: { type: integer }
        delay_seconds: { type: integer, description: wait after the previous step's send before this one }
        subject: { type: string }
        body_text: { type: string }
        body_html: { type: string }
    StepRequest:
      type: object
      properties:
        delay_seconds: { type: integer, minimum: 0 }
        subject: { type: string, maxLength: 500 }
        body_text: { type: string }
        body_html: { type: string }
    ReorderStepsRequest:
      type: object
      required: [step_ids]
      properties:
        step_ids:
          type: array
          description: the FULL ordered list of the campaign's step ids, in the desired order
          items: { type: string, format: uuid }
    CreateCampaignRequest:
      type: object
      required: [name, mailbox_id, list_id, subject]
      properties:
        name: { type: string }
        mailbox_id: { type: string, format: uuid }
        list_id: { type: string, format: uuid }
        subject: { type: string }
        body_text: { type: string }
        body_html: { type: string }
    UpdateCampaignTrackingRequest:
      type: object
      properties:
        enabled: { type: boolean }
    WarmupSettings:
      type: object
      description: >-
        Warmup ramp settings for a mailbox. All fields optional on update; omitted
        fields keep their current (or default) value. Validated at the boundary:
        1 <= start_volume <= max_volume <= 200, ramp_increment >= 1,
        0 <= reply_rate <= 1.
      properties:
        start_volume: { type: integer, minimum: 1, maximum: 200, description: warmup emails/day at day 0 }
        max_volume: { type: integer, minimum: 1, maximum: 200, description: daily ceiling the ramp climbs to }
        ramp_increment: { type: integer, minimum: 1, description: emails/day added each day }
        reply_rate: { type: number, minimum: 0, maximum: 1, description: probability a warmup send is an in-thread reply }
    WarmupParticipant:
      type: object
      description: One mailbox's warmup enrollment state.
      required: [mailbox_id, enabled, start_volume, max_volume, ramp_increment, reply_rate, health_state, health_reason, started_at, today_sent, today_target]
      properties:
        mailbox_id: { type: string, format: uuid }
        enabled: { type: boolean }
        start_volume: { type: integer }
        max_volume: { type: integer }
        ramp_increment: { type: integer }
        reply_rate: { type: number }
        health_state:
          type: string
          enum: [healthy, watch, throttled, paused]
          description: reputation state derived from inbox-placement and behavior signals
        health_reason: { type: string, description: human-readable explanation of a non-healthy state }
        started_at: { type: string, format: date-time }
        today_sent: { type: integer, description: warmup emails sent by this mailbox today }
        today_target: { type: integer, description: today's ramp target (0 when paused) }
    WarmupMailbox:
      type: object
      description: A participant enriched with rolling placement rates for the overview.
      required: [mailbox_id, email, enabled, health_state, health_reason, today_sent, today_target, inbox_rate_7d, spam_rate_7d]
      properties:
        mailbox_id: { type: string, format: uuid }
        email: { type: string }
        enabled: { type: boolean }
        health_state: { type: string, enum: [healthy, watch, throttled, paused] }
        health_reason: { type: string }
        today_sent: { type: integer }
        today_target: { type: integer }
        inbox_rate_7d: { type: number, description: "of this mailbox's SENT warmup mail over 7 days, the fraction that landed in partners' inboxes (0..1) — a sender-deliverability signal" }
        spam_rate_7d: { type: number, description: "of this mailbox's SENT warmup mail over 7 days, the fraction that landed in partners' spam (0..1)" }
    WarmupOverview:
      type: object
      description: >-
        Workspace warmup summary. pool_size is the number of enabled participants;
        warmup needs at least 2 to exchange mail (active is true when pool_size>=2).
      required: [pool_size, active, mailboxes]
      properties:
        pool_size: { type: integer }
        active: { type: boolean }
        mailboxes:
          type: array
          items: { $ref: '#/components/schemas/WarmupMailbox' }
    WarmupDayStat:
      type: object
      required: [day, sent, received, inbox, spam, replies]
      properties:
        day: { type: string, format: date, description: UTC day }
        sent: { type: integer, description: warmup mail this mailbox sent }
        received: { type: integer, description: warmup mail this mailbox received }
        inbox: { type: integer, description: "of this mailbox's SENT mail, how many landed in partners' inboxes (sender placement)" }
        spam: { type: integer, description: "of this mailbox's SENT mail, how many landed in partners' spam (sender placement)" }
        replies: { type: integer }
    WarmupDetail:
      type: object
      description: One mailbox's participant state plus its daily series.
      required: [participant, series]
      properties:
        participant: { $ref: '#/components/schemas/WarmupParticipant' }
        series:
          type: array
          description: daily stats, oldest first, up to 30 days
          items: { $ref: '#/components/schemas/WarmupDayStat' }
