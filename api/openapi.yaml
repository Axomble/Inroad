openapi: 3.0.3
info:
  title: Inroad API
  version: 0.1.0
servers:
  - url: /api/v1
security:
  - bearerAuth: []
paths:
  /auth/register:
    post:
      operationId: authRegister
      tags: [auth]
      security: []
      parameters:
        - $ref: '#/components/parameters/CaptchaToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '200':
          description: Session
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionResponse' }
        '400': { description: Validation error }
        '403': { description: Captcha verification failed }
        '409': { description: Workspace or email already exists }
  /auth/login:
    post:
      operationId: authLogin
      tags: [auth]
      security: []
      parameters:
        - $ref: '#/components/parameters/CaptchaToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: >-
            A session (SessionResponse) for a user without a confirmed second
            factor, OR a single-use 2FA challenge (TwoFactorRequiredResponse,
            no tokens) for a user with 2FA enabled — the caller must then POST
            /auth/2fa/verify to obtain a session.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/SessionResponse'
                  - $ref: '#/components/schemas/TwoFactorRequiredResponse'
        '401': { description: Invalid credentials }
        '403': { description: Captcha verification failed }
        '429': { description: Too many attempts (rate limited); see Retry-After }
  /auth/refresh:
    post:
      operationId: authRefresh
      tags: [auth]
      security: []
      responses:
        '200':
          description: Refreshed session
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionResponse' }
        '401': { description: Invalid or expired refresh token }
  /auth/logout:
    post:
      operationId: authLogout
      tags: [auth]
      security: []
      responses:
        '200':
          description: Logged out
          content:
            application/json:
              schema: { type: object, properties: { status: { type: string } } }
  /auth/me:
    get:
      operationId: authMe
      tags: [auth]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Current identity
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeResponse' }
        '401': { description: Unauthorized }
  /auth/logout-all:
    post:
      operationId: authLogoutAll
      tags: [auth]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Logged out of all sessions
          content:
            application/json:
              schema: { type: object, properties: { status: { type: string } } }
        '401': { description: Unauthorized }
  /auth/switch-workspace:
    post:
      operationId: authSwitchWorkspace
      tags: [auth]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SwitchWorkspaceRequest' }
      responses:
        '200':
          description: Switched active workspace
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SwitchWorkspaceResponse' }
        '401': { description: Unauthorized }
        '403': { description: Not a member of the target workspace }
  /auth/sessions:
    get:
      operationId: authListSessions
      tags: [auth]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: The caller's active sessions (current one flagged)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionListResponse' }
        '401': { description: Unauthorized }
  /auth/sessions/revoke-others:
    post:
      operationId: authRevokeOtherSessions
      tags: [auth]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Revoked every session except the current one
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RevokeOthersResponse' }
        '401': { description: Unauthorized }
  /auth/sessions/{id}:
    delete:
      operationId: authRevokeSession
      tags: [auth]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '204': { description: Session revoked }
        '400': { description: Invalid session id }
        '401': { description: Unauthorized }
        '404': { description: No such session belonging to the caller }
  /auth/verify-email:
    post:
      operationId: authVerifyEmail
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VerifyEmailRequest' }
      responses:
        '204': { description: Email verified }
        '400': { description: Invalid or expired token }
  /auth/verify-email/resend:
    post:
      operationId: authResendVerification
      tags: [auth]
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Verification email re-sent }
        '401': { description: Unauthorized }
        '429': { description: "Too many requests, try again shortly" }
  /auth/password/forgot:
    post:
      operationId: authForgotPassword
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ForgotPasswordRequest' }
      responses:
        '204': { description: Reset email sent if the address matches an account (response is the same either way) }
        '400': { description: Validation error }
        '429': { description: Too many requests (rate limited); see Retry-After }
  /auth/password/reset:
    post:
      operationId: authResetPassword
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResetPasswordRequest' }
      responses:
        '204': { description: "Password reset, all sessions revoked" }
        '400': { description: "Validation error, or invalid/expired token" }
  /auth/invites/accept:
    post:
      operationId: authAcceptInvite
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AcceptInviteRequest' }
      responses:
        '200':
          description: Session
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionResponse' }
        '400': { description: Validation error }
        '404': { description: Invalid or expired invite }
        '422': { description: Password required to create an account }
  /auth/oauth/google/start:
    get:
      operationId: authGoogleSignInRedirect
      tags: [auth]
      security: []
      description: >-
        Begin a Google sign-in/sign-up as a TOP-LEVEL BROWSER NAVIGATION: the SPA
        does window.location.assign on this URL and reads no body. Responds 302 to
        Google's consent screen, or 302 back to the login page with
        `google_error=disabled` when this deployment has no Google credentials.
        Distinct from POST /mailboxes/oauth/google/start, which is authenticated and
        requests Gmail scopes to connect a mailbox; this flow requests only
        openid/email/profile.
      parameters:
        - name: return_to
          in: query
          required: false
          description: >-
            In-app path to land on after sign-in. Validated server-side as a
            same-origin path (anything else is silently dropped) and remembered
            against the state nonce rather than echoed through Google.
          schema: { type: string }
      responses:
        '302': { description: "Redirect to Google's consent screen, or back to the login page with google_error=disabled" }
    post:
      operationId: authGoogleSignInStart
      tags: [auth]
      security: []
      description: >-
        The same flow for a caller that wants the consent URL WITHOUT being
        navigated. Answers 501 when Google sign-in is unconfigured, so a client can
        hide the button instead of offering one that only redirects to an error, and
        it is the only way to pass an invite token (which must not sit in a URL the
        browser records in history).
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GoogleSignInStartRequest' }
      responses:
        '200':
          description: Google consent URL
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GoogleSignInStartResponse' }
        '400': { description: Validation error }
        '501': { description: Google sign-in is not configured on this deployment }
  /auth/oauth/google/callback:
    get:
      operationId: authGoogleSignInCallback
      tags: [auth]
      security: []
      description: >-
        The top-level browser navigation Google redirects to after consent. Not
        callable with fetch. It authenticates from the signed, single-use `state`
        (no cookie is available on a cross-site redirect) and derives the workspace
        server-side from the provider identity, never from a query parameter. It
        never returns JSON and never returns a 5xx.


        On SUCCESS it 302s to `{APP_BASE_URL}/auth/google/callback?signin=ok` with
        the refresh + CSRF cookies set (call POST /auth/refresh for the access
        token), plus `&return_to=<path>` when one was requested at start. On FAILURE
        it 302s to the SPA login route `{APP_BASE_URL}/?google_error=<reason>`, where
        reason is one of: denied, bad_state, no_email, email_unverified, disabled,
        invite_invalid, exchange_failed, server_error.
      parameters:
        - { name: code, in: query, required: false, schema: { type: string } }
        - { name: state, in: query, required: false, schema: { type: string } }
        - { name: error, in: query, required: false, schema: { type: string } }
      responses:
        '302': { description: "Redirect to the SPA: signin=ok on success, google_error=<reason> on failure" }
  /auth/2fa:
    get:
      operationId: authTwoFactorStatus
      tags: [auth]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 2FA status for the caller
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TwoFactorStatusResponse' }
        '401': { description: Unauthorized }
  /auth/2fa/totp:
    post:
      operationId: authTwoFactorEnroll
      tags: [auth]
      security: [{ bearerAuth: [] }]
      description: >-
        Begin TOTP enrollment. Returns the base32 secret and an otpauth:// URI
        (render as a QR code). The secret is stored sealed but UNCONFIRMED and is
        never returned again — confirm with a code at /auth/2fa/totp/confirm.
      responses:
        '200':
          description: Pending enrollment secret
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TwoFactorEnrollResponse' }
        '401': { description: Unauthorized }
        '409': { description: Two-factor is already enabled }
    delete:
      operationId: authTwoFactorDisable
      tags: [auth]
      security: [{ bearerAuth: [] }]
      description: >-
        Disable 2FA. Requires a fresh TOTP code OR a recovery code as proof of
        possession. Also revokes the caller's OTHER sessions (a second-factor
        removal is a security downgrade).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TwoFactorCodeRequest' }
      responses:
        '204': { description: "Two-factor disabled, other sessions revoked" }
        '400': { description: "Validation error, or two-factor is not enabled" }
        '401': { description: "Unauthorized, or invalid code" }
  /auth/2fa/totp/confirm:
    post:
      operationId: authTwoFactorConfirm
      tags: [auth]
      security: [{ bearerAuth: [] }]
      description: >-
        Activate a pending TOTP enrollment by proving possession with a code.
        Returns the one-time recovery codes exactly once.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TwoFactorCodeRequest' }
      responses:
        '200':
          description: Two-factor enabled; recovery codes returned once
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TwoFactorConfirmResponse' }
        '400': { description: "Enrollment not started, or invalid code" }
        '401': { description: Unauthorized }
        '409': { description: Two-factor is already enabled }
  /auth/2fa/verify:
    post:
      operationId: authTwoFactorVerify
      tags: [auth]
      security: []
      description: >-
        Complete the login gate: exchange a 2FA challenge (from /auth/login) plus
        a TOTP or recovery code for a session. The challenge is single-use,
        TTL'd, and try-capped; any failure is a flat 401.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TwoFactorVerifyRequest' }
      responses:
        '200':
          description: Session
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionResponse' }
        '400': { description: Validation error }
        '401': { description: Invalid or expired challenge / code }
        '429': { description: Too many attempts (rate limited); see Retry-After }
  /auth/passkeys:
    get:
      operationId: authPasskeyList
      tags: [auth]
      security: [{ bearerAuth: [] }]
      description: List the caller's registered passkeys. No key material is returned.
      responses:
        '200':
          description: The caller's passkeys
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PasskeyListResponse' }
        '401': { description: Unauthorized }
  /auth/passkeys/{id}:
    delete:
      operationId: authPasskeyDelete
      tags: [auth]
      security: [{ bearerAuth: [] }]
      description: >-
        Delete one of the caller's passkeys (own-only). A foreign or unknown id
        returns 404 so a caller cannot probe another user's credentials.
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '204': { description: Passkey deleted }
        '400': { description: Invalid id }
        '401': { description: Unauthorized }
        '404': { description: Passkey not found }
  /auth/passkeys/register/begin:
    post:
      operationId: authPasskeyRegisterBegin
      tags: [auth]
      security: [{ bearerAuth: [] }]
      description: >-
        Begin adding a passkey to the caller's account. Returns an opaque
        session_id that binds the ceremony server-side plus the WebAuthn credential
        creation options for navigator.credentials.create. Requires a resident key
        and user verification.
      responses:
        '200':
          description: Registration options + ceremony session id
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PasskeyBeginResponse' }
        '401': { description: Unauthorized }
        '501': { description: Passkeys are not configured }
  /auth/passkeys/register/finish:
    post:
      operationId: authPasskeyRegisterFinish
      tags: [auth]
      security: [{ bearerAuth: [] }]
      description: >-
        Complete registration: submit the attestation from
        navigator.credentials.create along with the ceremony session_id. The
        server-stored challenge is consumed (single-use), the attestation verified,
        and the credential stored.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasskeyFinishRequest' }
      responses:
        '204': { description: Passkey registered }
        '400': { description: "Validation error, invalid/expired challenge, or attestation failed" }
        '401': { description: Unauthorized }
        '409': { description: This authenticator is already registered }
        '501': { description: Passkeys are not configured }
  /auth/passkeys/login/begin:
    post:
      operationId: authPasskeyLoginBegin
      tags: [auth]
      security: []
      description: >-
        Begin a discoverable (usernameless) passkey login. Public — no session
        exists yet. Returns an opaque session_id plus the WebAuthn credential
        request options for navigator.credentials.get; the allowed-credentials list
        is empty so the authenticator offers its resident keys.
      responses:
        '200':
          description: Assertion options + ceremony session id
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PasskeyBeginResponse' }
        '501': { description: Passkeys are not configured }
  /auth/passkeys/login/finish:
    post:
      operationId: authPasskeyLoginFinish
      tags: [auth]
      security: []
      description: >-
        Complete a discoverable passkey login: submit the assertion from
        navigator.credentials.get with the ceremony session_id. The user is
        resolved ONLY from the authenticated credential, the signature counter is
        verified to have increased (clone detection), and on success a session is
        minted exactly like a password login — but the TOTP gate is skipped because
        a user-verified passkey is strong auth. Any failure is a flat 401.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasskeyFinishRequest' }
      responses:
        '200':
          description: Session
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionResponse' }
        '400': { description: Validation error }
        '401': { description: Authentication failed }
        '429': { description: Too many attempts (rate limited); see Retry-After }
        '501': { description: Passkeys are not configured }
  /auth/email-otp/start:
    post:
      operationId: authEmailOTPStart
      tags: [auth]
      security: []
      description: >-
        Request a passwordless login code by email. ALWAYS returns 200 with the
        same generic body whether or not the email matches an account (no
        user-enumeration oracle); only a matching account is emailed a single-use,
        short-lived numeric code. Rate limited per client IP and per email
        (mail-bombing prevention); when a captcha is configured, an
        X-Captcha-Token header is required.
      parameters:
        - $ref: '#/components/parameters/CaptchaToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmailOTPStartRequest' }
      responses:
        '200':
          description: Generic acknowledgement (identical for existing and non-existing emails)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmailOTPStartResponse' }
        '400': { description: Validation error }
        '403': { description: Captcha verification failed }
        '429': { description: Too many requests (rate limited); see Retry-After }
  /auth/email-otp/verify:
    post:
      operationId: authEmailOTPVerify
      tags: [auth]
      security: []
      description: >-
        Exchange an emailed login code for a session. Email possession is a FIRST
        factor equivalent to a password: a user with confirmed 2FA still receives a
        TwoFactorRequiredResponse (no session) and must complete /auth/2fa/verify —
        the code never bypasses configured MFA. The code is single-use, TTL'd, and
        try-capped; every failure is a flat 401. Rate limited per client IP and per
        email.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmailOTPVerifyRequest' }
      responses:
        '200':
          description: >-
            A session (SessionResponse) for a user without a confirmed second
            factor, OR a single-use 2FA challenge (TwoFactorRequiredResponse, no
            tokens) for a user with 2FA enabled.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/SessionResponse'
                  - $ref: '#/components/schemas/TwoFactorRequiredResponse'
        '400': { description: Validation error }
        '401': { description: Invalid or expired code }
        '429': { description: Too many requests (rate limited); see Retry-After }
  /auth/api-keys:
    post:
      operationId: authApiKeyCreate
      tags: [auth]
      security: [{ bearerAuth: [] }]
      description: >-
        Mint a scoped API key for the caller's workspace. The full token
        (inrd_<prefix>_<secret>) is returned in this response EXACTLY ONCE and is
        never retrievable again — only its SHA-256 is stored. Grant a subset of the
        owned scope vocabulary; optionally restrict by CIDR allowlist, a per-minute
        rate limit, and an expiry. Session-authed only (an API key cannot mint keys).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApiKeyCreateRequest' }
      responses:
        '201':
          description: The created key metadata plus the one-time token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiKeyCreateResponse' }
        '400': { description: "Validation error (unknown scope, bad CIDR, past expiry, non-positive rate limit)" }
        '401': { description: Unauthorized }
    get:
      operationId: authApiKeyList
      tags: [auth]
      security: [{ bearerAuth: [] }]
      description: >-
        List the caller's workspace API keys, newest first. No secret or hash is
        ever returned — only the public prefix and metadata.
      responses:
        '200':
          description: The workspace's API keys
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiKeyListResponse' }
        '401': { description: Unauthorized }
  /auth/api-keys/{id}:
    delete:
      operationId: authApiKeyRevoke
      tags: [auth]
      security: [{ bearerAuth: [] }]
      description: >-
        Revoke one of the caller's workspace API keys. Idempotent (re-revoking
        succeeds); a foreign or unknown id returns 404 so a caller cannot probe or
        revoke another workspace's key.
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '204': { description: Key revoked }
        '400': { description: Invalid id }
        '401': { description: Unauthorized }
        '404': { description: API key not found }
  /workspaces/{id}/onboarding/complete:
    post:
      operationId: completeWorkspaceOnboarding
      tags: [workspaces]
      security: [{ bearerAuth: [] }]
      description: >-
        Name the caller's workspace and mark onboarding finished, in one atomic
        statement. Owner/admin only, and `{id}` must equal the active workspace in
        the caller's token. Idempotent: on an already-completed workspace it
        returns the stored name and original timestamp WITHOUT renaming, so it is
        not a rename endpoint.
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CompleteOnboardingRequest' }
      responses:
        '200':
          description: Onboarding state after the call
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OnboardingResponse' }
        '400': { description: Validation error }
        '401': { description: Unauthorized }
        '403': { description: "Not an admin of this workspace, or workspace mismatch" }
        '404': { description: No such workspace }
  /workspaces/{id}/invites:
    post:
      operationId: createWorkspaceInvite
      tags: [invites]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateInviteRequest' }
      responses:
        '201': { description: Created invite, content: { application/json: { schema: { $ref: '#/components/schemas/Invite' } } } }
        '400': { description: Validation error }
        '401': { description: Unauthorized }
        '403': { description: "Not an admin of this workspace, or workspace mismatch" }
        '409': { description: An invite is already pending for this email }
    get:
      operationId: listWorkspaceInvites
      tags: [invites]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: Pending invites, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Invite' } } } } }
        '401': { description: Unauthorized }
        '403': { description: "Not an admin of this workspace, or workspace mismatch" }
  /workspaces/{id}/invites/{inviteId}:
    delete:
      operationId: revokeWorkspaceInvite
      tags: [invites]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: inviteId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Invite revoked }
        '400': { description: Invalid invite id }
        '401': { description: Unauthorized }
        '403': { description: "Not an admin of this workspace, or workspace mismatch" }
  /mailboxes:
    get:
      operationId: listMailboxes
      tags: [mailboxes]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Mailboxes in the workspace
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Mailbox' } }
        '401': { description: Unauthorized }
    post:
      operationId: connectMailbox
      tags: [mailboxes]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConnectMailboxRequest' }
      responses:
        '200':
          description: Connected mailbox
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Mailbox' }
        '400': { description: Validation error }
        '401': { description: Unauthorized }
        '409': { description: Mailbox already exists }
        '422': { description: Connection test failed }
  /mailboxes/{id}:
    get:
      operationId: getMailbox
      tags: [mailboxes]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Mailbox
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Mailbox' }
        '401': { description: Unauthorized }
        '404': { description: Not found }
    delete:
      operationId: deleteMailbox
      tags: [mailboxes]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Deleted }
        '401': { description: Unauthorized }
        '404': { description: Not found }
  /mailboxes/{id}/pause:
    post:
      operationId: pauseMailbox
      tags: [mailboxes]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Paused mailbox
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Mailbox' }
        '401': { description: Unauthorized }
        '404': { description: Not found }
  /mailboxes/{id}/resume:
    post:
      operationId: resumeMailbox
      tags: [mailboxes]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Resumed mailbox
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Mailbox' }
        '401': { description: Unauthorized }
        '404': { description: Not found }
  /mailboxes/{id}/warmup:
    get:
      operationId: getMailboxWarmup
      tags: [warmup]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Warmup detail for one mailbox, with a 30-day daily series
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WarmupDetail' }
        '401': { description: Unauthorized }
        '404': { description: Mailbox not found or not a warmup participant }
    put:
      operationId: enableMailboxWarmup
      tags: [warmup]
      security: [{ bearerAuth: [] }]
      description: Enable warmup on a mailbox or update its settings. Idempotent.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WarmupSettings' }
      responses:
        '200':
          description: Warmup enabled/updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WarmupParticipant' }
        '400': { description: Validation error (e.g. start_volume > max_volume) }
        '401': { description: Unauthorized }
        '404': { description: Mailbox not found }
    delete:
      operationId: disableMailboxWarmup
      tags: [warmup]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Warmup disabled }
        '401': { description: Unauthorized }
        '404': { description: Mailbox not found }
  /warmup/overview:
    get:
      operationId: getWarmupOverview
      tags: [warmup]
      security: [{ bearerAuth: [] }]
      description: Pool summary plus per-mailbox health and 7-day placement rates for the workspace.
      responses:
        '200':
          description: Warmup overview
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WarmupOverview' }
        '401': { description: Unauthorized }
  /warmup/mailboxes/{mailbox_id}/transitions:
    get:
      operationId: listWarmupTransitions
      tags: [warmup]
      security: [{ bearerAuth: [] }]
      description: >-
        The append-only record of every automated warmup state change for one
        mailbox, newest first. Each row names the metric, sample size and
        threshold that produced it, so an operator can answer "why is this
        mailbox here, and what clears it" without reading logs — the
        explainability requirement the reputation design sets against showing a
        bare score.
      parameters:
        - name: mailbox_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        '200':
          description: Transition history
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WarmupTransitionPage' }
        '401': { description: Unauthorized }
        '404': { description: Mailbox not found in this workspace }
  /pulse:
    get:
      operationId: getPulse
      tags: [pulse]
      security: [{ bearerAuth: [] }]
      description: >-
        The workspace-wide aggregate read-model behind the console chrome
        (pulse card, nav counts, overview tiles): mailbox/warmup/campaign/contact
        counts, today's sending meter, and severity-sorted attention rows.
        One O(1)-size payload for the caller's active workspace; poll it
        rather than fetching lists to count them.
      responses:
        '200':
          description: Workspace pulse
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pulse' }
        '401': { description: Unauthorized }
  /reports/campaigns:
    get:
      operationId: getCampaignReport
      tags: [reporting]
      security: [{ bearerAuth: [] }]
      description: >-
        Every campaign in the workspace with its lifetime performance, plus the
        workspace roll-up — the cross-campaign comparison in one request rather
        than one request per campaign.


        Totals are weighted by volume (summed counts over summed denominators),
        never an average of the per-campaign rates.


        Figures are LIFETIME, not windowed, so every rate means exactly what the
        same-named rate on the campaign detail page means. Note the two
        denominators: `open_rate` and `click_rate` are per SEND, while
        `reply_rate`, `bounce_rate` and `unsub_rate` are per ENROLLED CONTACT.
        Rates are fractions in [0,1].
      responses:
        '200':
          description: Cross-campaign performance report
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CampaignReport' }
        '401': { description: Unauthorized }
        '403': { description: Missing the campaigns:read scope }
  /ai/settings:
    get:
      operationId: getAISettings
      tags: [ai]
      security: [{ bearerAuth: [] }]
      description: >-
        Workspace AI settings (model defaults, enabled models, additional
        instructions). Returns the sentinel defaults when the workspace has
        never saved settings.
      responses:
        '200':
          description: AI settings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AISettings' }
        '401': { description: Unauthorized }
    put:
      operationId: updateAISettings
      tags: [ai]
      security: [{ bearerAuth: [] }]
      description: >-
        Update workspace AI settings. Omitted fields keep their current (or
        default) value. Model references must be ids from GET /ai/models
        ("<provider_id>/<name>") or the field's own sentinel. Requires
        workspace admin/owner role.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AISettingsUpdate' }
      responses:
        '200':
          description: Updated AI settings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AISettings' }
        '400': { description: Validation error (unavailable model id or wrong sentinel) }
        '401': { description: Unauthorized }
        '403': { description: Insufficient role (admin/owner required) }
  /ai/providers:
    get:
      operationId: listAIProviders
      tags: [ai]
      security: [{ bearerAuth: [] }]
      description: The workspace's configured provider doors, masked (key prefix only).
      responses:
        '200':
          description: Configured providers
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AIProviderList' }
        '401': { description: Unauthorized }
    post:
      operationId: createAIProvider
      tags: [ai]
      security: [{ bearerAuth: [] }]
      description: >-
        Configure a provider door. The credential object is sealed WHOLE under
        the workspace's encryption key and never returned; responses carry only
        configured=true and a display prefix (first 8 chars of the api key /
        access key id, or the service account's client_email). config holds
        non-secret connection settings and is validated per kind (see
        AIProviderCreateRequest). User-supplied base_url/endpoint hosts must be
        https for public hosts; private/loopback hosts are rejected unless the
        operator set INROAD_AI_ALLOW_PRIVATE_BASE_URL=true. Requires workspace
        admin/owner role.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AIProviderCreateRequest' }
      responses:
        '201':
          description: Provider configured (masked)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AIProvider' }
        '400': { description: 'Validation error (unknown kind, missing kind-required credentials/config, URL policy violation)' }
        '401': { description: Unauthorized }
        '403': { description: Insufficient role (admin/owner required) }
        '409': { description: 'A provider with this (kind, target) already exists' }
  /ai/providers/{id}:
    put:
      operationId: updateAIProvider
      tags: [ai]
      security: [{ bearerAuth: [] }]
      description: >-
        Update a provider door. credentials absent = keep the sealed
        credential; config absent = keep; display_name absent = keep. kind is
        immutable.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AIProviderUpdateRequest' }
      responses:
        '200':
          description: Updated provider (masked)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AIProvider' }
        '400': { description: Validation error }
        '401': { description: Unauthorized }
        '403': { description: Insufficient role (admin/owner required) }
        '404': { description: Provider not found }
        '409': { description: 'A provider with this (kind, target) already exists' }
    delete:
      operationId: deleteAIProvider
      tags: [ai]
      security: [{ bearerAuth: [] }]
      description: Remove a provider door; its custom models cascade with it.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Provider removed }
        '401': { description: Unauthorized }
        '403': { description: Insufficient role (admin/owner required) }
        '404': { description: Provider not found }
  /ai/providers/{id}/discover:
    post:
      operationId: discoverAIProviderModels
      tags: [ai]
      security: [{ bearerAuth: [] }]
      description: >-
        Best-effort model-list discovery against the provider's own endpoint
        (OpenAI-compatible GET /models, Anthropic/Google list endpoints, Azure
        deployments list). Returns CANDIDATES only — nothing is persisted;
        create chosen ones via POST /ai/models. supported=false means the kind
        has no discovery path yet (bedrock, vertex_*) and manual entry is the
        way. The dial goes through the SSRF-guarded client with the same
        private-host gating as config validation. Requires workspace
        admin/owner role.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Discovery result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AIDiscoveryResult' }
        '401': { description: Unauthorized }
        '403': { description: Insufficient role (admin/owner required) }
        '404': { description: Provider not found }
        '502': { description: 'The provider endpoint could not be listed (dial refused, auth rejected, not a model list)' }
  /ai/models:
    get:
      operationId: listAIModels
      tags: [ai]
      security: [{ bearerAuth: [] }]
      description: >-
        The workspace's merged model list: models.dev catalog entries for
        native-kind doors (anthropic/openai/google) plus user-defined custom
        models on any door. Every entry's id is the stable composite
        "<provider_id>/<name>" — settings reference exactly these ids. When
        models.dev is unreachable and no cached snapshot exists, catalog
        entries are absent (custom models still listed).
      responses:
        '200':
          description: Merged model list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AIModelList' }
        '401': { description: Unauthorized }
    post:
      operationId: createAIModel
      tags: [ai]
      security: [{ bearerAuth: [] }]
      description: >-
        Register a user-defined model under a provider door (from discovery
        candidates or manual entry). Requires workspace admin/owner role.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AIModelCreateRequest' }
      responses:
        '201':
          description: Created model
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AIModel' }
        '400': { description: Validation error }
        '401': { description: Unauthorized }
        '403': { description: Insufficient role (admin/owner required) }
        '404': { description: Provider not found }
        '409': { description: A model with this name already exists on this provider }
  /ai/models/{id}:
    delete:
      operationId: deleteAIModel
      tags: [ai]
      security: [{ bearerAuth: [] }]
      description: >-
        Delete a user-defined model by its custom_model_id (catalog entries
        are not deletable — disable them via settings.enabled_model_ids).
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Model removed }
        '401': { description: Unauthorized }
        '403': { description: Insufficient role (admin/owner required) }
        '404': { description: Model not found }
  /agent/threads:
    get:
      operationId: listAgentThreads
      tags: [agent]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 30 } }
      responses:
        '200': { description: Owner-scoped threads, content: { application/json: { schema: { $ref: '#/components/schemas/AgentThreadList' } } } }
        '401': { description: Unauthorized }
    post:
      operationId: createAgentThread
      tags: [agent]
      security: [{ bearerAuth: [] }]
      responses:
        '201': { description: Empty thread, content: { application/json: { schema: { $ref: '#/components/schemas/AgentThread' } } } }
        '401': { description: Unauthorized }
  /agent/threads/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getAgentThread
      tags: [agent]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Thread and transcript, content: { application/json: { schema: { $ref: '#/components/schemas/AgentThread' } } } }
        '404': { description: Thread not found }
    patch:
      operationId: renameAgentThread
      tags: [agent]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [title], properties: { title: { type: string, minLength: 1, maxLength: 120 } } } } }
      responses:
        '200': { description: Renamed thread, content: { application/json: { schema: { $ref: '#/components/schemas/AgentThread' } } } }
        '404': { description: Thread not found }
    delete:
      operationId: deleteAgentThread
      tags: [agent]
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Thread archived }
        '404': { description: Thread not found }
  /agent/threads/{id}/messages:
    post:
      operationId: sendAgentMessage
      tags: [agent]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AgentSendRequest' } } }
      responses:
        '202': { description: Run started or message queued, content: { application/json: { schema: { $ref: '#/components/schemas/AgentSendResult' } } } }
        '404': { description: Thread not found }
  /agent/threads/{id}/queue:
    get:
      operationId: listAgentQueue
      tags: [agent]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Pending messages, content: { application/json: { schema: { $ref: '#/components/schemas/AgentQueue' } } } }
  /agent/threads/{id}/queue/{messageID}:
    delete:
      operationId: deleteAgentQueuedMessage
      tags: [agent]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: messageID, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Queued message removed }
        '404': { description: Thread or queued message not found }
  /agent/threads/{id}/stop:
    post:
      operationId: stopAgentRun
      tags: [agent]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '202': { description: Cancellation requested }
        '409': { description: Thread has no active run }
  /agent/threads/{id}/stream:
    get:
      operationId: streamAgentThread
      tags: [agent]
      security: [{ bearerAuth: [] }]
      description: Fetch-based SSE stream. Reconnect with Last-Event-ID or after_seq.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: after_seq, in: query, schema: { type: integer, minimum: 0 } }
        - { name: Last-Event-ID, in: header, schema: { type: string } }
      responses:
        '200': { description: Agent event stream, content: { text/event-stream: { schema: { type: string } } } }
        '404': { description: Thread not found }
        '429': { description: Too many concurrent streams for this user }
  /agent/approvals:
    get:
      operationId: listAgentApprovals
      tags: [agent]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: status, in: query, schema: { $ref: '#/components/schemas/AgentApprovalStatus' } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 30 } }
      responses:
        '200': { description: Owner-scoped approval actions, content: { application/json: { schema: { $ref: '#/components/schemas/AgentApprovalList' } } } }
        '401': { description: Unauthorized }
  /agent/approvals/{actionID}:
    parameters:
      - { name: actionID, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getAgentApproval
      tags: [agent]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Approval action, content: { application/json: { schema: { $ref: '#/components/schemas/AgentApproval' } } } }
        '404': { description: Approval not found }
  /agent/approvals/{actionID}/decision:
    parameters:
      - { name: actionID, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: decideAgentApproval
      tags: [agent]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AgentApprovalDecisionRequest' } } }
      responses:
        '200': { description: Updated approval action, content: { application/json: { schema: { $ref: '#/components/schemas/AgentApproval' } } } }
        '400': { description: Invalid decision or edited arguments }
        '404': { description: Approval not found }
        '409': { description: Approval already decided or expired }
  /lists:
    get:
      operationId: listLists
      tags: [lists]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Lists, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/List' } } } } }
        '401': { description: Unauthorized }
    post:
      operationId: createList
      tags: [lists]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [name], properties: { name: { type: string } } } } }
      responses:
        '200': { description: Created list, content: { application/json: { schema: { $ref: '#/components/schemas/List' } } } }
        '400': { description: Validation error }
        '401': { description: Unauthorized }
  /lists/{id}:
    patch:
      operationId: renameList
      tags: [lists]
      security: [{ bearerAuth: [] }]
      description: Renames the list.
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [name], properties: { name: { type: string } } } } }
      responses:
        '200': { description: Renamed list, content: { application/json: { schema: { $ref: '#/components/schemas/List' } } } }
        '400': { description: "Invalid JSON, or name is missing/too long" }
        '401': { description: Unauthorized }
        '404': { description: Not found }
    delete:
      operationId: deleteList
      tags: [lists]
      security: [{ bearerAuth: [] }]
      description: >-
        Deletes a list and its memberships. A list a campaign still references
        cannot be deleted.
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '204': { description: Deleted }
        '401': { description: Unauthorized }
        '404': { description: Not found }
        '409': { description: List is used by a campaign }
  /contacts/import:
    post:
      operationId: importContacts
      tags: [contacts]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: list, in: query, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { type: object, properties: { file: { type: string, format: binary } } }
      responses:
        '200': { description: Import result, content: { application/json: { schema: { $ref: '#/components/schemas/ImportResult' } } } }
        '400': { description: Validation error }
        '401': { description: Unauthorized }
        '404': { description: List not found }
  /contacts:
    get:
      operationId: listContacts
      tags: [contacts]
      security: [{ bearerAuth: [] }]
      description: >-
        Keyset-paginated contact search. Pages seek by cursor rather than OFFSET, so
        a deep page costs the same as the first. Omitting `list` searches every
        contact in the workspace. `total` is exact below the cap and flagged capped
        above it, so the count can never become an unbounded scan.
      parameters:
        - name: list
          in: query
          required: false
          description: Restrict to one list. Omit for all contacts in the workspace.
          schema: { type: string, format: uuid }
        - name: q
          in: query
          description: >-
            Case-insensitive substring match across email, first name, last name and
            company. Minimum 2 characters.
          schema: { type: string, minLength: 2 }
        - name: sort
          in: query
          schema: { $ref: '#/components/schemas/ContactSort' }
        - name: cursor
          in: query
          description: >-
            Opaque cursor from a previous page's next_cursor/prev_cursor. Omit for
            the first page. Must match the current sort.
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        '200': { description: A page of contacts, content: { application/json: { schema: { $ref: '#/components/schemas/ContactPage' } } } }
        '400': { description: "Malformed cursor, or a cursor that does not match the requested sort" }
        '401': { description: Unauthorized }
        '404': { description: List not found }
        '422': { description: "q shorter than 2 characters, unknown sort, or limit out of range" }
  /custom-fields:
    get:
      operationId: listCustomFields
      tags: [contacts]
      security: [{ bearerAuth: [] }]
      description: >-
        The workspace's custom field definitions, ARCHIVED ONES INCLUDED. Archived
        definitions are returned rather than hidden because they are the
        explanation for values a contact still carries under a key no form offers
        any more; a client that dropped them would make real data look like
        corruption. Filter on `archived` to render only the live set.
      responses:
        '200':
          description: The workspace's custom field definitions
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/CustomFieldDef' } }
        '401': { description: Unauthorized }
    post:
      operationId: createCustomField
      tags: [contacts]
      security: [{ bearerAuth: [] }]
      description: >-
        Define a custom field. `key` is what appears inside a template token
        (`{{custom.<key>}}`) and what addresses the value on a contact, so it is
        normalised to lower case and must match `^[a-z][a-z0-9_]{0,39}$`. The
        personalizer's lookup is case-sensitive and resolves a miss to the empty
        string, so allowing `Industry` and `industry` to coexist would let a casing
        slip mail a blank where a value was intended.


        A key is claimed permanently, archived definitions included: values are
        addressed by key in a schemaless object, so reusing one would hand the new
        definition the retired field's values under a type it never validated.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CustomFieldCreate' }
      responses:
        '201': { description: The created definition, content: { application/json: { schema: { $ref: '#/components/schemas/CustomFieldDef' } } } }
        '400': { description: "Invalid key, label, type, or options (a select needs options; nothing else may carry them)" }
        '401': { description: Unauthorized }
        '403': { description: Insufficient scope }
        '409': { description: "The key is already used (including by an archived field), or the workspace is at its field limit" }
  /custom-fields/{fieldID}:
    parameters:
      - { name: fieldID, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      operationId: updateCustomField
      tags: [contacts]
      security: [{ bearerAuth: [] }]
      description: >-
        Edit a definition's label, and a select's options. `key` and `type` are
        deliberately not editable: both are load-bearing on data already written -
        the key addresses stored values and appears in tokens operators have typed
        into live sequences, and the type is the promise every existing value was
        validated under. Changing either would silently reinterpret history, so the
        replacement path is archive-then-create.


        Removing an option that contacts already hold does NOT rewrite those
        contacts. Their value stays and keeps rendering in emails; it simply stops
        being offered in the form.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CustomFieldUpdate' }
      responses:
        '200': { description: The updated definition, content: { application/json: { schema: { $ref: '#/components/schemas/CustomFieldDef' } } } }
        '400': { description: "fieldID is not a uuid, or the label/options are invalid" }
        '401': { description: Unauthorized }
        '403': { description: Insufficient scope }
        '404': { description: No such field in this workspace }
        '409': { description: The field is archived and cannot be edited }
    delete:
      operationId: archiveCustomField
      tags: [contacts]
      security: [{ bearerAuth: [] }]
      description: >-
        Archive (retire) a definition. This is NOT a delete: stored values on every
        contact are left exactly where they are, and keep rendering in emails. A
        real delete would silently rewrite every contact row in the workspace with
        no undo; an operator who wants the data gone clears values first.


        Archiving hides the field from forms, from CSV import mapping, and from
        token resolution - so a `{{custom.<key>}}` token naming it starts failing
        campaign preflight. The response is the archived definition (200, not 204)
        so a client updates it in place rather than dropping it from the list.


        Idempotent: archiving an already-archived field returns it unchanged rather
        than moving `archived_at`.
      responses:
        '200': { description: The archived definition, content: { application/json: { schema: { $ref: '#/components/schemas/CustomFieldDef' } } } }
        '400': { description: fieldID is not a uuid }
        '401': { description: Unauthorized }
        '403': { description: Insufficient scope }
        '404': { description: No such field in this workspace }
  /contacts/{id}/fields:
    parameters: [{ $ref: '#/components/parameters/ID' }]
    get:
      operationId: getContactCustomFields
      tags: [contacts]
      security: [{ bearerAuth: [] }]
      description: >-
        One contact's custom values, each paired with the definition describing it.
        Every LIVE field appears, including ones with no value, so a form renders
        the whole set from this one response. A value whose key has no live
        definition appears with a null `def` - that is how an archived-key value
        stays visible instead of vanishing from a page meant to show what the
        record actually holds.
      responses:
        '200':
          description: The contact's custom field values
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/CustomFieldValue' } }
        '400': { description: id is not a uuid }
        '401': { description: Unauthorized }
        '404': { description: Contact not found }
    put:
      operationId: setContactCustomFields
      tags: [contacts]
      security: [{ bearerAuth: [] }]
      description: >-
        Replace the contact's custom values with the submitted set.


        A REPLACE, not a merge: the caller is an edit form that rendered every live
        field, so a live key it omitted was cleared on purpose. (CSV import is the
        merge case and goes through POST /contacts/import instead, which is why a
        partial upload cannot erase enrichment an earlier one supplied.)


        Every submitted key must name a live field and every value must satisfy its
        type - writing to an archived key is refused, because the field is retired
        precisely so nothing new accumulates under it. Values already stored under
        archived or unknown keys are preserved untouched: the form never showed
        them, so its silence about them is not an instruction. An empty value
        clears its key rather than storing an empty string.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CustomFieldValueSet' }
      responses:
        '200':
          description: The contact's custom field values after the write
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/CustomFieldValue' } }
        '400': { description: "id is not a uuid, a key has no live field, or a value fails its field's type" }
        '401': { description: Unauthorized }
        '403': { description: Insufficient scope }
        '404': { description: Contact not found }
  /contacts/{id}:
    parameters: [{ $ref: '#/components/parameters/ID' }]
    get:
      operationId: getContact
      tags: [contacts]
      security: [{ bearerAuth: [] }]
      description: >-
        One contact's record: its own fields, its CRM company, and the deals it is
        the primary contact on. Only the cheap relational fields live here -
        engagement history aggregates over sends and tracking events and is a
        separate resource, so this response stays a two-index read.
      responses:
        '200': { description: The contact record, content: { application/json: { schema: { $ref: '#/components/schemas/ContactDetail' } } } }
        '400': { description: id is not a uuid }
        '401': { description: Unauthorized }
        '404': { description: "Contact not found. A contact in another workspace is indistinguishable from one that does not exist." }
  /contacts/{id}/company:
    parameters: [{ $ref: '#/components/parameters/ID' }]
    put:
      operationId: setContactCompany
      tags: [contacts]
      security: [{ bearerAuth: [] }]
      description: >-
        Link a contact to a company, or unlink it by sending an explicit null. This
        is the only write path for `contacts.company_id`, which is what populates
        `ContactDetail.company` and the company's contact roster.


        A PUT on a single-value sub-resource rather than a PATCH on the contact,
        because unlinking has to be expressible: a PATCH would have to distinguish
        an ABSENT company_id from a null one, and getting that wrong silently
        either unlinks or refuses to. Here null means unlink, always.


        Deliberately NOT done implicitly: creating a deal that names both a company
        and a contact does not link them. A deal's company is who the money is
        with, which is not necessarily who the contact works for, and a link that
        appeared as a side effect would reappear after a user removed it.


        Requires the contacts:write scope. It does not additionally require
        crm:write (unlike the contact-alias writes) because company_id is CRM
        metadata with no effect on the send path.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContactCompanyLink' }
      responses:
        '200': { description: The updated contact record, content: { application/json: { schema: { $ref: '#/components/schemas/ContactDetail' } } } }
        '400': { description: "id is not a uuid, or the body is not a single JSON object with a company_id" }
        '401': { description: Unauthorized }
        '403': { description: Insufficient scope }
        '404': { description: "Contact not found, or the company is not in this workspace. The message says which." }
  /contacts/{id}/engagement:
    parameters: [{ $ref: '#/components/parameters/ID' }]
    get:
      operationId: getContactEngagement
      tags: [contacts]
      security: [{ bearerAuth: [] }]
      description: >-
        The contact's outreach history rolled up across every campaign: sends,
        indicative opens, clicks, and reply/bounce/unsubscribe outcomes, plus the
        campaigns they are enrolled in. Counts use the same definitions as the
        per-campaign rollup (see Metrics), so the two never disagree. Separate from
        GET /contacts/{id} because it aggregates over sends and tracking_events and
        is both the slow half of the page and the half that changes on its own
        schedule.
      responses:
        '200': { description: The contact's engagement rollup, content: { application/json: { schema: { $ref: '#/components/schemas/ContactEngagement' } } } }
        '400': { description: id is not a uuid }
        '401': { description: Unauthorized }
        '404': { description: Contact not found }
  /sending-domains:
    get:
      operationId: listSendingDomains
      tags: [mailboxes]
      security: [{ bearerAuth: [] }]
      description: >-
        Email-authentication status for every domain this workspace sends from,
        derived from its mailboxes. Informational: nothing here blocks a send. A
        domain that has never been checked appears with state "unknown" and a null
        checked_at rather than being omitted.
      responses:
        '200': { description: "One row per sending domain", content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/SendingDomain' } } } } }
        '401': { description: Unauthorized }
        '500': { description: "Could not load domains" }
  /sending-domains/{domain}/check:
    post:
      operationId: checkSendingDomain
      tags: [mailboxes]
      security: [{ bearerAuth: [] }]
      description: >-
        Re-run the DNS lookups for one domain now, so an operator who has just
        fixed a record does not wait for the daily sweep. Only domains the
        workspace actually sends from can be checked; anything else is a 404, so
        this cannot be used to resolve arbitrary names through our resolver.
      parameters:
        - { name: domain, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: "Updated status", content: { application/json: { schema: { $ref: '#/components/schemas/SendingDomain' } } } }
        '401': { description: Unauthorized }
        '404': { description: "This workspace has no mailbox on that domain" }
        '500': { description: "Lookup could not be performed" }
  /deliverability:
    get:
      operationId: getWorkspaceDeliverability
      tags: [deliverability]
      security: [{ bearerAuth: [] }]
      description: >-
        Workspace deliverability rollup over the scoring window. Every component
        carries `measured`: a signal with no feed is absent, NOT
        zero-and-therefore-perfect, so the UI can say "not measured" rather than
        imply a clean rate nobody observed.
      responses:
        '200': { description: "Score, components, series and at-risk lists", content: { application/json: { schema: { $ref: '#/components/schemas/DeliverabilityReport' } } } }
        '401': { description: Unauthorized }
        '500': { description: "Could not compute" }
  /campaigns/{id}/deliverability:
    get:
      operationId: getCampaignDeliverability
      tags: [deliverability]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: "Score for one campaign, plus any automatic pauses", content: { application/json: { schema: { $ref: '#/components/schemas/CampaignDeliverability' } } } }
        '401': { description: Unauthorized }
        '404': { description: Campaign not found }
  /campaigns/{id}/guardrails:
    put:
      operationId: updateCampaignGuardrails
      tags: [deliverability]
      security: [{ bearerAuth: [] }]
      description: >-
        Circuit-breaker settings. On by default: a safeguard nobody enables
        protects nobody, and the minimum-sample rule is what makes on-by-default
        safe.
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CampaignGuardrails' } } }
      responses:
        '200': { description: "Updated", content: { application/json: { schema: { $ref: '#/components/schemas/CampaignGuardrails' } } } }
        '400': { description: "Invalid JSON or campaign id" }
        '401': { description: Unauthorized }
        '404': { description: Campaign not found }
        '422': { description: "A threshold outside 0.1..100" }
  /deliverability/events:
    post:
      operationId: ingestDeliverabilityEvent
      tags: [deliverability]
      security: [{ bearerAuth: [] }]
      description: >-
        Machine endpoint for an external pipeline (an SES SNS subscriber, a
        provider webhook) to report a complaint or bounce. Idempotent on
        provider_event_id: a retried delivery must not inflate the rate a circuit
        breaker reads. A complaint also suppresses the address workspace-wide,
        being the strongest opt-out signal there is.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/DeliverabilityEvent' } } }
      responses:
        '202': { description: "Accepted" }
        '200': { description: "Duplicate replay, already recorded" }
        '400': { description: "Invalid JSON" }
        '401': { description: Unauthorized }
        '422': { description: "Unknown kind, or a missing email or provider_event_id" }
  /campaigns:
    get:
      operationId: listCampaigns
      tags: [campaigns]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Campaigns, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Campaign' } } } } }
        '401': { description: Unauthorized }
    post:
      operationId: createCampaign
      tags: [campaigns]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateCampaignRequest' } } }
      responses:
        '200': { description: Created campaign, content: { application/json: { schema: { $ref: '#/components/schemas/Campaign' } } } }
        '400': { description: Validation error }
        '401': { description: Unauthorized }
        '404': { description: List not found }
        '422': { description: Mailbox not active }
  /campaigns/{id}:
    get:
      operationId: getCampaign
      tags: [campaigns]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: Campaign with steps + enrollment counts, content: { application/json: { schema: { $ref: '#/components/schemas/CampaignDetail' } } } }
        '401': { description: Unauthorized }
        '404': { description: Not found }
    put:
      operationId: renameCampaign
      tags: [campaigns]
      security: [{ bearerAuth: [] }]
      description: Renames the campaign. Allowed at any lifecycle status.
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/RenameCampaignRequest' } } }
      responses:
        '200': { description: Renamed campaign, content: { application/json: { schema: { $ref: '#/components/schemas/Campaign' } } } }
        '400': { description: "Invalid JSON, or name is missing/too long" }
        '401': { description: Unauthorized }
        '404': { description: Not found }
    delete:
      operationId: deleteCampaign
      tags: [campaigns]
      security: [{ bearerAuth: [] }]
      description: >-
        Deletes a campaign that has never been launched, along with its send
        windows, sender pool and sequence steps. Draft only.
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '204': { description: Deleted }
        '401': { description: Unauthorized }
        '404': { description: Not found }
        '409': { description: Campaign is not a draft }
  /campaigns/{id}/pause:
    post:
      operationId: pauseCampaign
      tags: [campaigns]
      security: [{ bearerAuth: [] }]
      description: Stops a running campaign from dispatching further step advances. Allowed only from running.
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '204': { description: Paused }
        '401': { description: Unauthorized }
        '404': { description: Not found }
        '409': { description: Campaign is not running }
  /campaigns/{id}/resume:
    post:
      operationId: resumeCampaign
      tags: [campaigns]
      security: [{ bearerAuth: [] }]
      description: >-
        Restarts a paused campaign. Allowed only from paused; works
        identically whether the pause was set by an operator or by the
        deliverability circuit breaker.
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '204': { description: Resumed }
        '401': { description: Unauthorized }
        '404': { description: Not found }
        '409': { description: Campaign is not paused }
  /campaigns/{id}/tracking:
    put:
      operationId: updateCampaignTracking
      tags: [campaigns]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/UpdateCampaignTrackingRequest' } } }
      responses:
        '200':
          description: Tracking flag updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  tracking_enabled: { type: boolean }
        '400': { description: Invalid JSON }
        '401': { description: Unauthorized }
        '404': { description: Not found }
  /campaigns/{id}/schedule:
    get:
      operationId: getCampaignSchedule
      tags: [campaigns]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: "The campaign's timezone, weekly send windows, and a preview of upcoming send times", content: { application/json: { schema: { $ref: '#/components/schemas/CampaignSchedule' } } } }
        '400': { description: Invalid campaign id }
        '401': { description: Unauthorized }
        '404': { description: Campaign not found }
        '500': { description: Could not load schedule }
    put:
      operationId: updateCampaignSchedule
      tags: [campaigns]
      security: [{ bearerAuth: [] }]
      description: >-
        Full replace of the timezone and every send window. A weekday absent from
        `days` is closed. Editable while the campaign is running: the change
        applies to sends scheduled after it, and does not move work already
        scheduled.
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CampaignScheduleRequest' } } }
      responses:
        '200': { description: Schedule replaced, content: { application/json: { schema: { $ref: '#/components/schemas/CampaignSchedule' } } } }
        '400': { description: "Invalid JSON or campaign id" }
        '401': { description: Unauthorized }
        '404': { description: Campaign not found }
        '422': { description: "Unknown timezone, an invalid or overlapping window, or a week with nothing open" }
        '500': { description: Could not save schedule }
  /campaigns/{id}/results:
    parameters: [{ $ref: '#/components/parameters/ID' }]
    get:
      operationId: getCampaignResults
      tags: [campaigns]
      security: [{ bearerAuth: [] }]
      description: >-
        Per-step, per-variant performance: sends, indicative opens, clicks, and
        reply/bounce/unsubscribe outcomes, plus a conservative reading of which
        A/B variant is winning.


        Every numerator is defined identically to the campaign-wide rollup (see
        Metrics), so a variant breakdown always sums to the campaign total rather
        than telling a second story. Opens carry the same proxy filtering: a
        comparison built on raw pixel hits would rank whichever arm reached more
        Gmail users.


        OUTCOME ATTRIBUTION: a reply, bounce or unsubscribe is attributed to the
        step and variant of the LAST message that contact received, because that
        is the message they answered. The consequence worth knowing is that on a
        multi-step campaign, replies concentrate on whichever step actually landed
        them - a step's reply count is not "replies from people who received this
        step".
      responses:
        '200': { description: The campaign's per-step results, content: { application/json: { schema: { $ref: '#/components/schemas/CampaignResults' } } } }
        '400': { description: id is not a uuid }
        '401': { description: Unauthorized }
        '404': { description: Campaign not found }
        '503': { description: "Reporting is not available on this server. Distinct from 500: nothing is wrong with the request or the campaign." }
  /campaigns/{id}/results.csv:
    parameters: [{ $ref: '#/components/parameters/ID' }]
    get:
      operationId: exportCampaignResults
      tags: [campaigns]
      security: [{ bearerAuth: [] }]
      description: >-
        The same results as a flat CSV, one row per (step, variant).


        A separate endpoint rather than a format parameter, because the two differ
        in more than encoding: this is a flat table, where the JSON is nested by
        step. Rates are raw ratios rather than percentages, because a spreadsheet
        formats them and a pre-multiplied "4.2" is ambiguous between 4.2% and
        420%. The winner is deliberately not a column - it is a judgement with a
        "too close to call" state, and a bare boolean loses the part that matters.
      responses:
        '200':
          description: CSV export
          content:
            text/csv:
              schema: { type: string }
        '400': { description: id is not a uuid }
        '401': { description: Unauthorized }
        '404': { description: Campaign not found }
        '503': { description: Reporting is not available on this server }
  /campaigns/{id}/senders:
    get:
      operationId: getCampaignSenders
      tags: [campaigns]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: "The campaign's sender pool and rotation mode", content: { application/json: { schema: { $ref: '#/components/schemas/CampaignSenderPool' } } } }
        '400': { description: "Invalid campaign id" }
        '401': { description: Unauthorized }
        '404': { description: Campaign not found }
        '500': { description: "Could not load senders" }
    put:
      operationId: updateCampaignSenders
      tags: [campaigns]
      security: [{ bearerAuth: [] }]
      description: >-
        Full replace of the sender pool and rotation mode. Editable while the
        campaign is running: it affects future contact assignments only and never
        moves a thread already in flight, since follow-up steps must send from the
        mailbox that started the thread. Rotation counters are preserved for
        mailboxes that remain in the pool.
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CampaignSenderPoolRequest' } } }
      responses:
        '200': { description: "Sender pool replaced", content: { application/json: { schema: { $ref: '#/components/schemas/CampaignSenderPool' } } } }
        '400': { description: "Invalid JSON or campaign id" }
        '401': { description: Unauthorized }
        '404': { description: Campaign not found }
        '422': { description: "Empty sender list, a duplicate or non-workspace or inactive mailbox, or a weight out of range" }
        '500': { description: "Could not save senders" }
  /campaigns/{id}/enrollments:
    get:
      operationId: listCampaignEnrollments
      tags: [campaigns]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: limit, in: query, required: false, schema: { type: integer, default: 100, minimum: 1, maximum: 500 } }
        - { name: offset, in: query, required: false, schema: { type: integer, default: 0, minimum: 0 } }
      responses:
        '200': { description: Per-contact reply status for the campaign's enrollments, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/CampaignEnrollment' } } } } }
        '400': { description: Invalid campaign id }
        '401': { description: Unauthorized }
        '404': { description: Campaign not found }
        '500': { description: Could not list enrollments }
  /campaigns/{id}/steps:
    get:
      operationId: listSteps
      tags: [campaigns]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: Steps in order, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/SequenceStep' } } } } }
        '401': { description: Unauthorized }
        '404': { description: Campaign not found }
    post:
      operationId: createStep
      tags: [campaigns]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/StepRequest' } } }
      responses:
        '200': { description: Created step (appended at end), content: { application/json: { schema: { $ref: '#/components/schemas/SequenceStep' } } } }
        '400': { description: Validation error }
        '401': { description: Unauthorized }
        '404': { description: Campaign not found }
        '409': { description: Campaign not draft (structural edits are draft-only) }
  /campaigns/{id}/steps/{stepId}:
    put:
      operationId: updateStep
      tags: [campaigns]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: stepId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/StepRequest' } } }
      responses:
        '200': { description: Updated step (content edits allowed while running — live-reference), content: { application/json: { schema: { $ref: '#/components/schemas/SequenceStep' } } } }
        '400': { description: Validation error }
        '401': { description: Unauthorized }
        '404': { description: Campaign or step not found }
    delete:
      operationId: deleteStep
      tags: [campaigns]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: stepId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Deleted }
        '401': { description: Unauthorized }
        '404': { description: Campaign or step not found }
        '409': { description: Campaign not draft (delete is a structural edit) }
  /campaigns/{id}/steps/{stepId}/variants:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: stepId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: listStepVariants
      tags: [campaigns]
      security: [{ bearerAuth: [] }]
      description: >-
        The step's A/B ALTERNATIVES. The step's own subject and body are variant
        A and are not repeated here - see SequenceStep.variant_weight for its
        share of the split. A step with an empty list is a normal single-copy
        step and sends its own content regardless of that weight.
      responses:
        '200':
          description: The step's variants
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/StepVariant' } }
        '400': { description: stepId is not a uuid }
        '401': { description: Unauthorized }
        '404': { description: Campaign or step not found }
    post:
      operationId: createStepVariant
      tags: [campaigns]
      security: [{ bearerAuth: [] }]
      description: >-
        Add an alternative to the step.


        Allowed on a RUNNING campaign, unlike creating a step. Adding or
        reweighting an arm changes what future sends contain, which is the same
        class of change as editing a step's body (already permitted live), not a
        structural change to the sequence. Requiring a pause to start an A/B test
        would mean pausing to learn anything.


        Refused with 409 when the resulting step would have every arm at weight
        0, because nothing could then be selected and every send for that step
        would fail at delivery time.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/StepVariantRequest' } } }
      responses:
        '201': { description: The created variant, content: { application/json: { schema: { $ref: '#/components/schemas/StepVariant' } } } }
        '400': { description: "Invalid label (1-40 characters) or a negative weight" }
        '401': { description: Unauthorized }
        '403': { description: Insufficient scope }
        '404': { description: Campaign or step not found }
        '409': { description: "Label already used on this step, the step is at its variant limit, or no arm would be left with a weight above zero" }
  /campaigns/{id}/steps/{stepId}/variants/{variantId}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: stepId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: variantId, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      operationId: updateStepVariant
      tags: [campaigns]
      security: [{ bearerAuth: [] }]
      description: >-
        Edit one alternative's label, weight and copy. Setting weight to 0
        retires the arm without losing the sends already attributed to it - this
        is the supported way to stop a losing variant.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/StepVariantRequest' } } }
      responses:
        '200': { description: The updated variant, content: { application/json: { schema: { $ref: '#/components/schemas/StepVariant' } } } }
        '400': { description: "Invalid label or a negative weight" }
        '401': { description: Unauthorized }
        '403': { description: Insufficient scope }
        '404': { description: Variant not found }
        '409': { description: "Label already used on this step, or this edit would leave no arm with a weight above zero" }
    delete:
      operationId: deleteStepVariant
      tags: [campaigns]
      security: [{ bearerAuth: [] }]
      description: >-
        Delete an alternative that has NEVER SENT.


        A variant with delivery history is refused with 409. sends.variant_id is
        ON DELETE SET NULL, so deleting one would silently re-attribute its
        messages to the base copy - the losing arm's results would fold into the
        winner's and make the comparison read better than it was. Set the weight
        to 0 instead; the arm stops sending and its numbers stay intact.
      responses:
        '204': { description: Deleted }
        '401': { description: Unauthorized }
        '403': { description: Insufficient scope }
        '404': { description: Variant not found }
        '409': { description: "The variant has already sent (set its weight to 0 instead), or deleting it would leave no arm with a weight above zero" }
  /campaigns/{id}/steps/{stepId}/base-weight:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: stepId, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      operationId: setStepBaseWeight
      tags: [campaigns]
      security: [{ bearerAuth: [] }]
      description: >-
        Set the weight of the step's OWN copy - the "A" side of the split.


        Its own endpoint rather than a field on the step update, because it is
        the one attribute of a step that changes what an in-flight A/B test
        measures: folding it into the content PUT would let an unrelated body
        edit silently reweight a running test.


        Zero retires the base copy without deleting what it said, which is how a
        winning variant is promoted. Refused with 409 if no arm would be left.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/StepBaseWeightRequest' } } }
      responses:
        '200':
          description: The step's variants after the change
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/StepVariant' } }
        '400': { description: Negative weight }
        '401': { description: Unauthorized }
        '403': { description: Insufficient scope }
        '404': { description: Campaign or step not found }
        '409': { description: This would leave no arm with a weight above zero }
  /campaigns/{id}/steps/reorder:
    post:
      operationId: reorderSteps
      tags: [campaigns]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ReorderStepsRequest' } } }
      responses:
        '200': { description: Steps in the new order, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/SequenceStep' } } } } }
        '400': { description: step_ids is not a permutation of the campaign's step ids }
        '401': { description: Unauthorized }
        '404': { description: Campaign or step not found }
        '409': { description: Campaign not draft (reorder is a structural edit) }
  /campaigns/{id}/launch:
    post:
      operationId: launchCampaign
      tags: [campaigns]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200':
          description: Enrollment + queue counts
          content:
            application/json:
              schema:
                type: object
                properties:
                  queued: { type: integer }
                  total_enrolled: { type: integer }
                  failed_enqueue_count: { type: integer }
        '401': { description: Unauthorized }
        '404': { description: Not found }
        '409': { description: Already launched }
        '422': { description: Target list empty or campaign has no steps }
  /campaigns/{id}/preflight:
    get:
      operationId: getCampaignPreflight
      tags: [campaigns]
      security: [{ bearerAuth: [] }]
      description: >-
        Launch-readiness report: nine independent checks (sequence steps,
        empty bodies, schedule windows, sender pool, audience, sending-domain
        authentication, tracking, daily limit, warmup health). ready is true
        iff no check is severity fail — a warn is informational and never
        blocks a launch.
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: Readiness report, content: { application/json: { schema: { $ref: '#/components/schemas/CampaignPreflight' } } } }
        '400': { description: Invalid campaign id }
        '401': { description: Unauthorized }
        '404': { description: Campaign not found }
  /campaigns/{id}/test-send:
    post:
      operationId: testSendCampaign
      tags: [campaigns]
      security: [{ bearerAuth: [] }]
      description: >-
        Validates the request (campaign/step ownership, an eligible sender
        exists, rate limit) and enqueues an execution-plane task that renders
        the step for a preview recipient and sends it through the campaign's
        first enabled+active pool mailbox. Personalization uses the campaign
        list's first contact where one exists, otherwise synthetic
        first_name=Alex, company=Acme. Nothing is persisted to sends; tracking
        links are never rewritten and no List-Unsubscribe header is set.
        Rate-limited (5/workspace/minute). The send itself is asynchronous —
        a 202 means the task was queued, not that delivery has completed.
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/TestSendRequest' } } }
      responses:
        '202': { description: Queued, content: { application/json: { schema: { $ref: '#/components/schemas/TestSendResponse' } } } }
        '400': { description: "Invalid JSON, campaign id, step_id, or to address" }
        '401': { description: Unauthorized }
        '404': { description: Campaign or step not found }
        '422':
          description: >-
            No enabled sender with an active mailbox, or the recipient is on
            the workspace's suppression list (unsubscribed or bounced) --
            {"error": "recipient_suppressed"}
        '429': { description: Too many test sends; try again shortly }
  # The unsubscribe endpoint is served outside the /api/v1 base — it is
  # public and browser-facing (no auth, returns HTML). RFC 8058 requires the
  # state change to live on POST so email preview scanners auto-following
  # GETs don't silently unsubscribe every recipient.
  /u/{token}:
    servers: [{ url: / }]
    get:
      operationId: unsubscribeConfirmPage
      tags: [unsubscribe]
      security: []
      parameters: [{ name: token, in: path, required: true, schema: { type: string } }]
      responses:
        '200':
          description: HTML confirmation page with a form that POSTs back
          content:
            text/html:
              schema: { type: string }
        '400': { description: Malformed or invalid token }
    post:
      operationId: unsubscribe
      tags: [unsubscribe]
      security: []
      parameters: [{ name: token, in: path, required: true, schema: { type: string } }]
      responses:
        '200':
          description: Suppression recorded (idempotent)
          content:
            text/html:
              schema: { type: string }
        '400': { description: Malformed or invalid token }
  # Open-pixel + click-redirect endpoints a recipient's mail client follows
  # unauthenticated, mirroring /u above -- also served outside the /api/v1
  # base. Not called by the SPA; documented here for completeness.
  /t/o/{token}.gif:
    servers: [{ url: / }]
    get:
      operationId: trackOpen
      tags: [tracking]
      security: []
      parameters: [{ name: token, in: path, required: true, schema: { type: string } }]
      responses:
        '200':
          description: >-
            1x1 transparent GIF, always -- served identically whether or not
            the token is valid, so the endpoint can never become an oracle.
          content:
            image/gif:
              schema: { type: string, format: binary }
  /t/c/{token}:
    servers: [{ url: / }]
    get:
      operationId: trackClick
      tags: [tracking]
      security: []
      parameters: [{ name: token, in: path, required: true, schema: { type: string } }]
      responses:
        '302': { description: Redirect to the signed destination URL }
        '404': { description: "Malformed/tampered token or unknown send -- no redirect, nothing recorded" }
  # OAuth 2.1 authorization server (Inroad acting as an OAuth PROVIDER). Mounted at
  # the TOP level under /oauth2 -- outside the /api/v1 base -- and distinct from the
  # /oauth mailbox-connect flow (Inroad as an OAuth CLIENT to Google/Microsoft). This
  # is P6a: dynamic client registration, the authorization endpoint, and consent. P6b
  # adds the token endpoint, introspection, and revocation below.
  /oauth2/register:
    servers: [{ url: / }]
    post:
      operationId: oauth2Register
      tags: [oauth2]
      security: [{ bearerAuth: [] }]
      description: >-
        RFC 7591 dynamic client registration, restricted to an authenticated workspace
        ADMIN (and rate-limited per client IP as defense-in-depth). The registering
        admin's user + workspace are recorded on the client, so every client is
        workspace-owned and listable/revocable through the admin API. Public PKCE client
        by default (token_endpoint_auth_method omitted or "none", no secret); request a
        client_secret_* method to get a confidential client whose secret is returned in
        this response EXACTLY ONCE (only its SHA-256 is stored). Each redirect_uri must
        be https (or an http loopback for native apps), carry no fragment and no
        userinfo, and requested scopes must all be OAuth-grantable (no admin/api-key/send
        scopes).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OAuth2RegisterRequest' }
      responses:
        '201':
          description: The registered client; client_secret present only for a confidential client (once)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OAuth2Client' }
        '400': { description: "Validation error (bad redirect_uri, non-grantable scope, unsupported grant/response type or auth method)" }
        '401': { description: Unauthorized }
        '403': { description: Not an admin }
        '429': { description: Registration rate limit exceeded }
  /oauth2/authorize:
    servers: [{ url: / }]
    get:
      operationId: oauth2Authorize
      tags: [oauth2]
      security: []
      description: >-
        OAuth 2.1 authorization endpoint (a top-level browser navigation, not an SPA
        fetch). response_type MUST be "code"; PKCE is mandatory and S256-only. The
        client and redirect_uri are validated FIRST (an unknown client or a
        redirect_uri that does not EXACTLY match the registered allowlist renders an
        error and never redirects); only after that are other errors returned by
        redirecting to the validated redirect_uri with error+state. The resource owner
        is resolved from the P1 session (never a parameter): if unauthenticated the
        browser is redirected to the SPA login with a return_to; if authenticated and
        a prior consent already covers the scopes a code is issued immediately,
        otherwise the browser is redirected to the SPA consent screen.
      parameters:
        - { name: response_type, in: query, required: true, schema: { type: string, enum: [code] } }
        - { name: client_id, in: query, required: true, schema: { type: string } }
        - { name: redirect_uri, in: query, required: true, schema: { type: string } }
        - { name: scope, in: query, required: true, schema: { type: string, description: space-delimited } }
        - { name: state, in: query, required: false, schema: { type: string } }
        - { name: code_challenge, in: query, required: true, schema: { type: string } }
        - { name: code_challenge_method, in: query, required: true, schema: { type: string, enum: [S256] } }
      responses:
        '302': { description: "Redirect to the client redirect_uri (code+state or error+state), the SPA consent screen, or the SPA login page" }
        '400':
          description: Unknown client or redirect_uri mismatch -- rendered inline, never redirected (anti-open-redirect)
          content:
            text/html:
              schema: { type: string }
  /oauth2/consent/{consent_id}:
    servers: [{ url: / }]
    get:
      operationId: oauth2ConsentData
      tags: [oauth2]
      security: [{ bearerAuth: [] }]
      description: >-
        Return the pending consent request's display data for the SPA consent screen.
        Session-authed; the request must belong to the session user and be live
        (unconsumed, unexpired), else 404.
      parameters: [{ name: consent_id, in: path, required: true, schema: { type: string } }]
      responses:
        '200':
          description: Consent request display data
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OAuth2ConsentData' }
        '401': { description: Unauthorized }
        '404': { description: "Unknown, expired, consumed, or not this user's consent request" }
  /oauth2/consent:
    servers: [{ url: / }]
    post:
      operationId: oauth2ConsentDecide
      tags: [oauth2]
      security: [{ bearerAuth: [] }]
      description: >-
        Record the resource owner's approve/deny decision. Session-authed and
        CSRF-guarded (double-submit); the service re-checks the session user owns the
        request. On approve it consumes the single-use request, remembers the consent,
        and issues a code; on deny it returns an access_denied redirect. The returned
        redirect_to is the URL the SPA navigates the browser to. Requires the
        X-CSRF-Token header (double-submit) matching the csrf_token cookie.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OAuth2ConsentDecision' }
      responses:
        '200':
          description: The URL to navigate the browser to (client redirect_uri with code+state, or error=access_denied+state)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OAuth2RedirectTo' }
        '400': { description: Validation error }
        '401': { description: Unauthorized }
        '403': { description: CSRF token mismatch }
        '404': { description: "Unknown, expired, consumed, or not this user's consent request" }
  /oauth2/clients:
    servers: [{ url: / }]
    get:
      operationId: oauth2ListClients
      tags: [oauth2]
      security: [{ bearerAuth: [] }]
      description: >-
        List the caller's workspace's registered OAuth clients, newest first. No
        client secret or hash is ever returned. Session-authed + admin, workspace-pinned.
      responses:
        '200':
          description: The workspace's OAuth clients
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OAuth2ClientList' }
        '401': { description: Unauthorized }
        '403': { description: Not an admin }
  /oauth2/clients/{client_id}:
    servers: [{ url: / }]
    delete:
      operationId: oauth2RevokeClient
      tags: [oauth2]
      security: [{ bearerAuth: [] }]
      description: >-
        Revoke one of the caller's workspace's OAuth clients. Idempotent; a foreign or
        unknown client_id returns 404. Session-authed + admin, workspace-pinned.
      parameters: [{ name: client_id, in: path, required: true, schema: { type: string } }]
      responses:
        '204': { description: Client revoked }
        '401': { description: Unauthorized }
        '403': { description: Not an admin }
        '404': { description: Client not found }
  /oauth2/token:
    servers: [{ url: / }]
    post:
      operationId: oauth2Token
      tags: [oauth2]
      security: []
      description: >-
        OAuth 2.1 token endpoint (RFC 6749 §4). The CLIENT authenticates itself (not a
        session): a public client by its client_id + PKCE, a confidential client by its
        secret via client_secret_basic (HTTP Basic) or client_secret_post (form field).
        Supported grants: authorization_code (with mandatory PKCE code_verifier; the code
        is single-use and its client_id/redirect_uri/PKCE bindings are all verified) and
        refresh_token (rotating, single-use; presenting an already-used token is reuse and
        revokes the whole family; scope may only narrow). No password/implicit/
        client_credentials grant. Access tokens are opaque, short-lived, and revocable.
        Errors use the RFC 6749 §5.2 JSON shape.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema: { $ref: '#/components/schemas/OAuth2TokenRequest' }
      responses:
        '200':
          description: The issued token pair (RFC 6749 §5.1)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OAuth2TokenResponse' }
        '400':
          description: invalid_request / invalid_grant / unsupported_grant_type / invalid_scope
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OAuth2TokenError' }
        '401':
          description: invalid_client (client authentication failed); carries a Basic WWW-Authenticate challenge
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OAuth2TokenError' }
  /oauth2/introspect:
    servers: [{ url: / }]
    post:
      operationId: oauth2Introspect
      tags: [oauth2]
      security: []
      description: >-
        RFC 7662 token introspection. The requesting client authenticates as at the token
        endpoint. Returns active + metadata for a live access or refresh token; an unknown,
        expired, or revoked token returns exactly {"active": false} with no other detail
        (no token-existence oracle).
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema: { $ref: '#/components/schemas/OAuth2IntrospectRequest' }
      responses:
        '200':
          description: 'Token metadata (active) or {"active": false}'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OAuth2IntrospectResponse' }
        '401':
          description: invalid_client
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OAuth2TokenError' }
  /oauth2/revoke:
    servers: [{ url: / }]
    post:
      operationId: oauth2Revoke
      tags: [oauth2]
      security: []
      description: >-
        RFC 7009 token revocation. The requesting client authenticates as at the token
        endpoint and may revoke ONLY its own tokens; revoking a refresh token also revokes
        its whole rotation family. Always returns 200 — even for an unknown or foreign
        token — so there is no token-existence oracle.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema: { $ref: '#/components/schemas/OAuth2RevokeRequest' }
      responses:
        '200': { description: Revoked (or a no-op for an unknown/foreign token) }
        '401':
          description: invalid_client
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OAuth2TokenError' }
  /crm/companies:
    get:
      operationId: crmListCompanies
      tags: [crm]
      parameters:
        - { $ref: '#/components/parameters/PageLimit' }
        - { $ref: '#/components/parameters/PageCursor' }
