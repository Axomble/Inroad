# Inroad Production / Self-Hosting Compose Manifest
# Zero-config entrypoint for self-hosting in deploy/compose.
# Usage: docker compose -f deploy/compose/docker-compose.yml up -d

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-inroad}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-inroad}
      POSTGRES_DB: ${POSTGRES_DB:-inroad}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-inroad}"]
      interval: 3s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

  migrate:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.api
    entrypoint: ["/usr/local/bin/migrate", "up"]
    environment:
      INROAD_DATABASE_URL: ${INROAD_DATABASE_URL:-postgres://${POSTGRES_USER:-inroad}:${POSTGRES_PASSWORD:-inroad}@postgres:5432/${POSTGRES_DB:-inroad}?sslmode=disable}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.api
    environment:
      INROAD_DATABASE_URL: ${INROAD_DATABASE_URL:-postgres://${POSTGRES_USER:-inroad}:${POSTGRES_PASSWORD:-inroad}@postgres:5432/${POSTGRES_DB:-inroad}?sslmode=disable}
      INROAD_REDIS_ADDR: ${INROAD_REDIS_ADDR:-redis:6379}
      INROAD_JWT_SECRET: ${INROAD_JWT_SECRET:-dev-jwt-secret-not-for-production-use}
      INROAD_MASTER_KEY: ${INROAD_MASTER_KEY:-ZGV2LW1hc3Rlci1rZXktZm9yLWxvY2FsLW9ubHkhISE=}
      INROAD_WEB_DIR: /srv/web
      INROAD_PUBLIC_URL: ${INROAD_PUBLIC_URL:-http://localhost:8080}
      INROAD_ENV: ${INROAD_ENV:-production}
      INROAD_LOG_LEVEL: ${INROAD_LOG_LEVEL:-info}
    ports:
      - "${API_PORT:-8080}:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.worker
    environment:
      INROAD_DATABASE_URL: ${INROAD_DATABASE_URL:-postgres://${POSTGRES_USER:-inroad}:${POSTGRES_PASSWORD:-inroad}@postgres:5432/${POSTGRES_DB:-inroad}?sslmode=disable}
      INROAD_REDIS_ADDR: ${INROAD_REDIS_ADDR:-redis:6379}
      INROAD_JWT_SECRET: ${INROAD_JWT_SECRET:-dev-jwt-secret-not-for-production-use}
      INROAD_MASTER_KEY: ${INROAD_MASTER_KEY:-ZGV2LW1hc3Rlci1rZXktZm9yLWxvY2FsLW9ubHkhISE=}
      INROAD_ENV: ${INROAD_ENV:-production}
      INROAD_LOG_LEVEL: ${INROAD_LOG_LEVEL:-info}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.web
    ports:
      - "${WEB_PORT:-80}:80"
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
