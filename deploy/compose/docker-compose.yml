services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: inroad
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: inroad
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inroad"]
      interval: 3s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10
  api:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.api
    environment:
      INROAD_DATABASE_URL: postgres://inroad:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/inroad?sslmode=disable
      INROAD_REDIS_ADDR: redis:6379
      INROAD_JWT_SECRET: ${INROAD_JWT_SECRET:?set INROAD_JWT_SECRET in .env (openssl rand -base64 32)}
      INROAD_MASTER_KEY: ${INROAD_MASTER_KEY:?set INROAD_MASTER_KEY in .env (base64 of 32 bytes)}
      INROAD_WEB_DIR: /srv/web
    ports: ["8080:8080"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
  worker:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.worker
    environment:
      INROAD_DATABASE_URL: postgres://inroad:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/inroad?sslmode=disable
      INROAD_REDIS_ADDR: redis:6379
      INROAD_JWT_SECRET: ${INROAD_JWT_SECRET:?set INROAD_JWT_SECRET in .env (openssl rand -base64 32)}
      INROAD_MASTER_KEY: ${INROAD_MASTER_KEY:?set INROAD_MASTER_KEY in .env (base64 of 32 bytes)}
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
volumes:
  pgdata:
