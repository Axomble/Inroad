# Production values for Inroad Helm Chart

global:
  env: "production"
  publicUrl: "http://inroad.local"

image:
  repositoryApi: "ghcr.io/axomble/inroad-api"
  repositoryWorker: "ghcr.io/axomble/inroad-worker"
  tag: "latest"
  pullPolicy: "IfNotPresent"
  imagePullSecrets: []

secrets:
  # Base64 or plain string for secrets (overridden at install/upgrade time)
  jwtSecret: "dev-jwt-secret-not-for-production-use"
  masterKey: "ZGV2LW1hc3Rlci1rZXktZm9yLWxvY2FsLW9ubHkhISE="

database:
  # Database connection string (PostgreSQL)
  url: "postgres://inroad:inroad@postgres:5432/inroad?sslmode=disable"

redis:
  # Redis host:port address
  addr: "redis:6379"

api:
  replicaCount: 2
  port: 8080
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}

worker:
  replicaCount: 2
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: true
  className: "nginx"
  annotations:
    kubernetes.io/ingress.class: nginx
    # cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: inroad.local
      paths:
        - path: /
          pathType: Prefix
  tls: []
  # - secretName: inroad-tls
  #   hosts:
  #     - inroad.local
