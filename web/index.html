<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- SVG first: browsers that support it get the theme-aware mark (it carries
         its own prefers-color-scheme block). The .ico is the fallback for older
         browsers and for Windows surfaces that read the container's 16/32/48
         sizes rather than scaling one bitmap. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" sizes="16x16 32x32 48x48" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inroad</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
