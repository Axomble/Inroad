<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="Inroad">
  <title>Inroad</title>
  <!--
    Static twin of web/src/components/layout/brand-mark.tsx, for the favicon and
    anywhere an <img> is needed. Same geometry; the component's currentColor is
    resolved here to a fixed ink, and a prefers-color-scheme block flips it for
    dark browser chrome. Keep the three path "d" values identical to the
    component when either changes.
  -->
  <style>
    .mark { fill: #11150d; }
    @media (prefers-color-scheme: dark) { .mark { fill: #f2f7e8; } }
  </style>
  <g class="mark">
    <path d="M44 6 26 43 21 27Z" opacity="0.45"/>
    <path d="M21 27 44 6 26 43Z" opacity="0.7"/>
    <path d="M4 21 44 6 21 27Z"/>
  </g>
</svg>
