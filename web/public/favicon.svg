<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="Inroad">
  <title>Inroad</title>
  <!--
    Same geometry as brand/inroad-mark.svg and the BrandMark component. Kept as
    its own file rather than a copy-by-reference because a favicon is fetched
    standalone by the browser and cannot inherit anything from the page.
    The previous favicon was a purple glyph left over from a template; it
    matched nothing else in the product.
  -->
  <style>
    .mark { fill: #11150d; }
    @media (prefers-color-scheme: dark) { .mark { fill: #f2f7e8; } }
  </style>
  <g class="mark">
    <path d="M44 6 26 43 21 27Z" opacity="0.45"/>
    <path d="M21 27 44 6 26 43Z" opacity="0.7"/>
    <path d="M4 21 44 6 21 27Z"/>
  </g>
</svg>
